apiVersion: v1
kind: Pod
metadata:
  name: pod04
  namespace: add-capabilities
spec:
  initContainers:
  - name: init
    image: somedummybusyboximage:1.1.0
    securityContext:
      capabilities:
        add:
        - SETFCAP
        - SETUID
  containers:
  - name: busybox
    image: somedummybusyboximage:1.1.0
    securityContext:
      capabilities:
        add:
        - SETFCAP
        - SETUID
