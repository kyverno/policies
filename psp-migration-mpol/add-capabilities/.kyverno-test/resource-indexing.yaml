apiVersion: v1
kind: Pod
metadata:
  name: pod04
  namespace: add-capabilities
spec:
  initContainers:
  - name: init
    image: somedummybusyboximage:1.1.0
  containers:
  - name: busybox
    image: somedummybusyboximage:1.1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: pod05
  namespace: add-capabilities
spec:
  containers:
  - name: busybox
    image: somedummybusyboximage:1.1.0
    securityContext:
      capabilities:
        add:
        - SETFCAP
