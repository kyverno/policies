name: add-apparmor-annotations
version: 1.0.0
displayName: Add AppArmor Annotations
createdAt: "2023-05-22T00:00:00.000Z"
description: >-
  In the earlier Pod Security Policy controller, it was possible to define a setting which would enable AppArmor for all the containers within a Pod so they may be assigned the desired profile. Assigning an AppArmor profile, accomplished via an annotation, is useful in that it allows secure defaults to be defined and may also result in passing other validation rules such as those in the Pod Security Standards. This policy mutates Pods to add an annotation for every container to enabled AppArmor at the runtime/default level.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/psp-migration-mpol/add-apparmor/add-apparmor.yaml
  ```
keywords:
  - kyverno
  - PSP Migration
readme: |
  In the earlier Pod Security Policy controller, it was possible to define a setting which would enable AppArmor for all the containers within a Pod so they may be assigned the desired profile. Assigning an AppArmor profile, accomplished via an annotation, is useful in that it allows secure defaults to be defined and may also result in passing other validation rules such as those in the Pod Security Standards. This policy mutates Pods to add an annotation for every container to enabled AppArmor at the runtime/default level.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-apparmor-annotations` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  `variables.containersToMutate` filters `variables.allContainers` against
  `exceptions.allowedImages`, populated from matching exceptions' `spec.images`.
  It excludes approved images across regular, init, and ephemeral containers
  from AppArmor annotation patches, while all remaining containers receive
  `runtime/default`. Image matching is exact, not a wildcard or prefix match.
  See the [tested example](https://github.com/kyverno/policies/blob/main/psp-migration-mpol/add-apparmor/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "PSP Migration"
  kyverno/kubernetesVersion: "1.24"
  kyverno/subject: "Pod,Annotation"
