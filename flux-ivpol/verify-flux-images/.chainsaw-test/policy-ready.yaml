apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-flux-images
status:
  conditionStatus:
    (conditions[?type == 'RBACPermissionsGranted']):
      - reason: Succeeded
        status: "True"
    (conditions[?type == 'WebhookConfigured']):
      - reason: Succeeded
        status: "True"
        type: WebhookConfigured
