name: verify-flux-images
version: 1.0.0
displayName: Verify Flux Images
createdAt: "2026-10-27T15:00:00Z"
description: >-
  Verifies keyless Cosign signatures of Flux controller images published to GHCR and Docker Hub.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/flux-ivpol/verify-flux-images/verify-flux-images.yaml
  ```
keywords:
  - kyverno
  - Flux
  - Software Supply Chain Security
readme: |
  Requires Kyverno 1.19.2 or later for repository-bound certificate extension checks.

  Verifies keyless Cosign signatures for Flux source, kustomize, helm, notification, image-reflector, and image-automation controller images on GHCR and Docker Hub. Signatures must use GitHub Actions OIDC and have a Rekor transparency-log entry. Each controller has its own attestor requiring the certificate's `githubWorkflowRepository` extension to identify that exact `fluxcd/<controller>` repository. The anchored identity regex accepts only version tags (`v<major>.<minor>.<patch>`) of the reusable `fluxcd/gha-workflows/.github/workflows/controller-release.yaml` workflow. This supports older and newer Flux releases without trusting arbitrary callers of the reusable workflow. The separate `fluxcd/flux2` release workflow signs the Flux manifests artifact, not these controller images, so it is intentionally not accepted here.

  Image matching uses `parseImageReference` to normalize Docker Hub shorthand (`fluxcd/<controller>`) and the `docker.io`/`index.docker.io` aliases. Only the six exact controller repositories on GHCR or Docker Hub are matched; similarly named registries and repositories are left alone. Tags, digest references, and untagged references are matched. Flux does not publish a `latest` tag, so an untagged reference produces a registry lookup error rather than bypassing verification.

  By default, signature violations are reported in Audit mode and are not blocked. Webhook failures are ignored to keep temporary registry or transparency-log outages from blocking admission. Set `spec.validationActions` to `[Deny]` and `spec.failurePolicy` to `Fail` for fail-closed enforcement.

  Image tags and digest handling preserve the legacy policy: this policy neither mutates tags to digests nor requires digest references. Background evaluation is disabled. It verifies matched regular and init containers in Pods and built-in pod-controller templates, including ReplicationControllers. Ephemeral containers are checked on Pod updates to the `pods/ephemeralcontainers` subresource.

  ### Fine-grained PolicyException use

  A PolicyException can bypass signature verification for a specific Pod only when its `matchConditions` identify that exact request and require every regular, init, and ephemeral container image to equal an explicitly approved image. Do not grant a broad namespace or image-pattern exception. A mixed-image Pod or sibling Pod must not match the exception. See the tested example in `.chainsaw-test/exception.yaml`.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Flux, Software Supply Chain Security"
  kyverno/kubernetesVersion: "1.23"
  kyverno/subject: "Pod"
