apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-flux-images
policies:
  - ../verify-flux-images.yaml
resources:
  - resources.yaml
results:
  - isImageValidatingPolicy: true
    kind: Pod
    policy: verify-flux-images
    resources:
      - unrelated-image
      - lookalike-registry
      - lookalike-repository
      - lookalike-container-categories
    result: pass
  - isImageValidatingPolicy: true
    kind: Pod
    policy: verify-flux-images
    resources:
      - unsigned-digest-only-image
    result: fail
  - isImageValidatingPolicy: true
    kind: Deployment
    policy: verify-flux-images
    resources:
      - unrelated-controller-image
    result: pass
  - isImageValidatingPolicy: true
    kind: ReplicationController
    policy: verify-flux-images
    resources:
      - unrelated-replication-controller-image
    result: pass
  - isImageValidatingPolicy: true
    kind: ReplicationController
    policy: verify-flux-images
    resources:
      - unsigned-replication-controller-image
    result: fail
  - isImageValidatingPolicy: true
    kind: StatefulSet
    policy: verify-flux-images
    resources:
      - unrelated-statefulset-image
    result: pass
  - isImageValidatingPolicy: true
    kind: StatefulSet
    policy: verify-flux-images
    resources:
      - unsigned-statefulset-image
    result: fail
  - isImageValidatingPolicy: true
    kind: DaemonSet
    policy: verify-flux-images
    resources:
      - unrelated-daemonset-image
    result: pass
  - isImageValidatingPolicy: true
    kind: DaemonSet
    policy: verify-flux-images
    resources:
      - unsigned-daemonset-image
    result: fail
  - isImageValidatingPolicy: true
    kind: ReplicaSet
    policy: verify-flux-images
    resources:
      - unrelated-replicaset-image
    result: pass
  - isImageValidatingPolicy: true
    kind: ReplicaSet
    policy: verify-flux-images
    resources:
      - unsigned-replicaset-image
    result: fail
  - isImageValidatingPolicy: true
    kind: Job
    policy: verify-flux-images
    resources:
      - unrelated-job-image
    result: pass
  - isImageValidatingPolicy: true
    kind: Job
    policy: verify-flux-images
    resources:
      - unsigned-job-image
    result: fail
  - isImageValidatingPolicy: true
    kind: CronJob
    policy: verify-flux-images
    resources:
      - unrelated-cronjob-image
    result: pass
  - isImageValidatingPolicy: true
    kind: CronJob
    policy: verify-flux-images
    resources:
      - unsigned-cronjob-image
    result: fail
