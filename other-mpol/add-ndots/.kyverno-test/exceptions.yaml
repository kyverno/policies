apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: add-ndots-exception
  namespace: policy-exceptions
spec:
  policyRefs: [{kind: MutatingPolicy, name: add-ndots}]
  matchConditions:
  - name: exact-resource
    expression: object.metadata.?namespace.orValue('') == '' && object.metadata.name == 'myapp-pod'
