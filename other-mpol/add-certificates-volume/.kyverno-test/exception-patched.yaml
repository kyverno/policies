apiVersion: v1
kind: Pod
metadata:
  name: exception-pod
  namespace: team-a
  annotations: {inject-certs: enabled}
spec:
  containers:
  - {name: first, image: registry.example/skip-first:1}
  - name: middle
    image: registry.example/mutate-middle:1
    volumeMounts: [{name: etc-ssl-certs, mountPath: /etc/ssl/certs}]
  - {name: last, image: registry.example/skip-last:1}
  volumes: [{name: etc-ssl-certs, configMap: {name: ca-pemstore}}]
