name: add-pod-proxies
version: 1.0.0
displayName: Add Pod Proxies
createdAt: "2023-04-10T20:30:02.000Z"
description: >-
  In restricted environments, Pods may not be allowed to egress directly to all destinations and some overrides to specific addresses may need to go through a corporate proxy. This policy adds proxy information to Pods in the form of environment variables. It will add the `env` array if not present. If any Pods have any of these env vars, they will be overwritten with the value(s) in this policy.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/add-pod-proxies/add-pod-proxies.yaml
  ```
keywords:
  - kyverno
  - Sample
readme: |
  In restricted environments, Pods may not be allowed to egress directly to all destinations and some overrides to specific addresses may need to go through a corporate proxy. This policy adds proxy information to Pods in the form of environment variables. It will add the `env` array if not present. If any Pods have any of these env vars, they will be overwritten with the value(s) in this policy.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-pod-proxies` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Kyverno exposes matching exceptions' `spec.images` as `exceptions.allowedImages`.
  Exact image matches skip proxy environment injection for regular containers
  in Pods and the explicitly matched controller templates. Other regular
  containers still receive `HTTP_PROXY`, `HTTPS_PROXY`, and `NO_PROXY`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/add-pod-proxies/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample"
  kyverno/subject: "Pod"
