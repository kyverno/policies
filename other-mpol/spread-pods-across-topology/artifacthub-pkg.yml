name: spread-pods-across-topology
version: 1.0.0
displayName: Spread Pods Across Nodes
createdAt: "2023-04-10T20:30:07.000Z"
description: >-
  Deployments to a Kubernetes cluster with multiple availability zones often need to distribute those replicas to align with those zones to ensure site-level failures do not impact availability. This policy matches Deployments with the label `distributed=required` and mutates them to spread Pods across zones.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/spread-pods-across-topology/spread-pods-across-topology.yaml
  ```
keywords:
  - kyverno
  - Sample
readme: |
  Deployments to a Kubernetes cluster with multiple availability zones often need to distribute those replicas to align with those zones to ensure site-level failures do not impact availability. This policy matches Deployments with the label `distributed=required` and mutates them to spread Pods across zones.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `spread-pods` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/spread-pods-across-topology/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
