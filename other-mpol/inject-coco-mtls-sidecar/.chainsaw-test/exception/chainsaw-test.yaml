apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: inject-coco-mtls-sidecar-exception
spec:
  steps:
  - name: policy-exceptions-namespace
    skipDelete: true
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
  - try:
    - apply: {file: ../../inject-coco-mtls-sidecar.yaml}
    - assert:
        file: ../policy-ready.yaml
        timeout: 90s
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata: {name: coco-sidecar-config, namespace: default}
          data:
            sidecar_image: ghcr.io/confidential-containers/secure-sidecar:v1.0
            https_port: "9443"
            forward_port: "9080"
            tls_cert_uri: https://kbs.example.com/certs/tls.crt
    - apply: {file: exception.yaml}
    - script:
        content: |
          set -eu
          probe_output=".inject-coco-sidecar-exception-$$.json"
          probe_error=".inject-coco-sidecar-exception-$$.stderr"
          trap 'rm -f "$probe_output" "$probe_error"' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if kubectl create --dry-run=server -f pod.yaml -o json > "$probe_output" 2> "$probe_error" &&
              jq -e \
                '(.spec.containers | length == 1) and ([.spec.containers[] | select(.name == "coco-sidecar")] | length == 0)' \
                "$probe_output" >/dev/null 2>> "$probe_error"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            printf 'timed out waiting for PolicyException to suppress the CoCo sidecar; last probe response:\n' >&2
            cat "$probe_output" >&2
            printf 'last kubectl/jq stderr:\n' >&2
            cat "$probe_error" >&2
            exit 1
          fi
    - apply: {file: pod.yaml}
    - assert: {file: pod-unchanged.yaml}
    - apply: {file: pod-sibling.yaml}
    - assert:
        file: pod-sibling-patched.yaml
        timeout: 30s
