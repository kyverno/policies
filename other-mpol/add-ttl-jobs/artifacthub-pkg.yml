name: add-ttl-jobs
version: 1.0.0
displayName: Add TTL to Jobs
createdAt: "2023-04-10T20:30:02.000Z"
description: >-
  Jobs which are user created can often pile up and consume excess space in the cluster. In Kubernetes 1.23, the TTL-after-finished controller is stable and will automatically clean up these Jobs if the ttlSecondsAfterFinished is specified. This policy adds the ttlSecondsAfterFinished field to an Job that does not have an ownerReference set if not already specified.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/add-ttl-jobs/add-ttl-jobs.yaml
  ```
keywords:
  - kyverno
  - Other
readme: |
  Jobs which are user created can often pile up and consume excess space in the cluster. In Kubernetes 1.23, the TTL-after-finished controller is stable and will automatically clean up these Jobs if the ttlSecondsAfterFinished is specified. This policy adds the ttlSecondsAfterFinished field to an Job that does not have an ownerReference set if not already specified.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-ttl-jobs` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Put the exact control token `ttlSecondsAfterFinished` in `spec.allowedValues`,
  which Kyverno exposes as `exceptions.allowedValues`, to skip the TTL mutation
  on the matched Job. This is a field-level control, not an allowed TTL value.
  Other eligible Jobs without ownerReferences or a TTL still receive the default
  `ttlSecondsAfterFinished: 900`; existing TTL values are not overwritten.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/add-ttl-jobs/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.23"
  kyverno/subject: "Job"
