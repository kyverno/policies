apiVersion: batch/v1
kind: Job
metadata:
  name: addjob02
  ownerReferences: []
spec:
  ttlSecondsAfterFinished: 900
  template:
    spec:
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:1.35
        command: ["sleep", "3600"]
      restartPolicy: Never
  backoffLimit: 4
