apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: exception, namespace: policy-exceptions}
spec:
  policyRefs: [{name: add-ttl-jobs, kind: MutatingPolicy}]
  allowedValues: [ttlSecondsAfterFinished]
  matchConditions: [{name: exact, expression: object.metadata.namespace == 'team-a' && object.metadata.name == 'exception-job'}]
