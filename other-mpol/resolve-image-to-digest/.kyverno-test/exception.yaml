apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: registry-exemption, namespace: policy-exceptions}
spec:
  policyRefs: [{kind: MutatingPolicy, name: resolve-image-to-digest}]
  images: [registry.invalid/exempt:1]
  matchConditions:
  - name: exact-pod
    expression: object.metadata.namespace == 'default' && object.metadata.name == 'partial-exception'
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: scope-exemption, namespace: policy-exceptions}
spec:
  policyRefs: [{kind: MutatingPolicy, name: resolve-image-to-digest}]
  images: [registry.example/mutate:1]
  matchConditions:
  - name: exact-pod
    expression: object.metadata.namespace == 'default' && object.metadata.name == 'scope-target'
