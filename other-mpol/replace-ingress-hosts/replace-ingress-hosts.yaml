apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: replace-ingress-hosts
  annotations:
    policies.kyverno.io/title: Replace Ingress Hosts
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      An Ingress may specify host names at a variety of locations in the same resource.
      This policy replaces host names that end with `old.com` with `new.com` in all
      relevant fields including spec.rules[].host, spec.tls[].hosts[], and spec.tls[].secretName.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          object.spec.?rules.orValue([]).map(rule, 
            has(rule.host) && rule.host.endsWith('.old.com') ?
            JSONPatch{
              op: "replace",
              path: "/spec/rules/" + string(object.spec.rules.indexOf(rule)) + "/host",
              value: rule.host.replace('.old.com', '.new.com')
            } : null
          ).filter(patch, patch != null)
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          has(object.spec.tls) ? [JSONPatch{
            op: "replace",
            path: "/spec/tls",
            value: object.spec.tls.map(tlsEntry,
              has(tlsEntry.hosts) ?
                (has(tlsEntry.secretName) ? {
                  "hosts": dyn(tlsEntry.hosts.map(host, host.endsWith('.old.com') ? host.replace('.old.com', '.new.com') : host)),
                  "secretName": dyn(tlsEntry.secretName.replace('.old.com', '.new.com'))
                } : {
                  "hosts": tlsEntry.hosts.map(host, host.endsWith('.old.com') ? host.replace('.old.com', '.new.com') : host)
                }) :
                (has(tlsEntry.secretName) ? {
                  "secretName": tlsEntry.secretName.replace('.old.com', '.new.com')
                } : tlsEntry)
            )
          }] : []
