# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cordon-and-drain-node
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ../cordon-and-drain-node.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - script:
        content: |
          kubectl label nodes --all testing=drain --overwrite
    - assert:
        file: node-assert.yaml
    finally:
    - script:
        content: |
          kubectl label nodes --all testing- || true
          kubectl taint nodes --all kyverno-evicted:NoExecute- || true
          kubectl uncordon --all nodes || true
