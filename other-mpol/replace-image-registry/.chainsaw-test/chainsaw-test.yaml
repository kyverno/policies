# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: replace-image-registry
spec:
  steps:
  - name: policy-exceptions-namespace
    skipDelete: true
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
  - name: step-01
    try:
    - apply:
        file: ../replace-image-registry.yaml
    - apply:
        file: ns.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pods.yaml
    - assert:
        file: pod-patched.yaml
    - assert:
        file: pod-patched02.yaml
    - assert:
        file: pod-patched03.yaml
  - name: step-03
    try:
    - apply:
        file: partial-exception.yaml
    - script:
        content: |
          set -eu
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          for attempt in $(seq 1 60); do
            if kubectl create --dry-run=server -f partial-exception-pod.yaml -o json > "$probe_dir/result.json" 2> "$probe_dir/error.log" &&
              jq -e '[.spec.containers[].image] == ["approved.example/keep:1", "myregistry.corp.com/example/mutate:1", "myregistry.corp.com/example/mutate-last:1"]' "$probe_dir/result.json" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$probe_dir/error.log" >&2
          exit 1
    - apply:
        file: partial-exception-pod.yaml
    - assert:
        file: partial-exception-pod-patched.yaml
    - script:
        content: kubectl delete all --all --force --grace-period=0 -n replace-registry-ns
