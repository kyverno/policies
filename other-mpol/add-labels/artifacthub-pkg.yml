readme: |
  Labels are used as an important source of metadata describing objects in various ways or triggering other functionality. Labels are also a very basic concept and should be used throughout Kubernetes. This policy performs a simple mutation which adds a label `foo=bar` to Pods, Services, ConfigMaps, and Secrets.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-labels` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Put the exact control token `label:foo` in `spec.allowedValues`, which Kyverno
  exposes as `exceptions.allowedValues`, to skip adding or overwriting `foo=bar`
  on the matched resource. This names the label operation, not a label value;
  other resources still receive the normal mutation.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/add-labels/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
