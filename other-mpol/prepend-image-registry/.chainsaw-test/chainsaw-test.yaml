# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: prepend-image-registry
spec:
  steps:
  - name: policy-exceptions-namespace
    skipDelete: true
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
  - name: step-01
    try:
    - apply:
        file: ../prepend-image-registry.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: namespace.yaml
    - apply:
        file: exception.yaml
    - script:
        content: |
          set -eu
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          for attempt in $(seq 1 60); do
            if kubectl create --dry-run=server -f ../.kyverno-test/resource.yaml -o json > "$probe_dir/result.json" 2> "$probe_dir/error.log" &&
              jq -e '.spec.initContainers[0].image == "kyverno/kyverno:latest" and .spec.initContainers[1].image == "registry.io/busybox:1.28" and .spec.containers[0].image == "registry.io/kyverno/kyverno:1.2.3" and .spec.containers[1].image == "registry.io/redis:latest"' "$probe_dir/result.json" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$probe_dir/error.log" >&2
          exit 1
    - apply:
        file: ../.kyverno-test/resource.yaml
    - apply:
        file: ../.kyverno-test/withoutinitcontainer.yaml
    - apply:
        file: ../.kyverno-test/resourceFailed.yaml
    - apply:
        file: pods.yaml
    - assert:
        file: exception-patched.yaml
    - assert:
        file: pods-patched.yaml
    - error:
        file: ../.kyverno-test/patchedResourceWithoutInitContainer.yaml
    - error:
        file: ../.kyverno-test/failpatchedResource.yaml
