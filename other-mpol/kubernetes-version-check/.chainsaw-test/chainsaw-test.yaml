# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: kubernetes-version-check
spec:
  steps:
  - name: step-00
    try:
    - apply:
        file: permissions.yaml
  - name: step-01
    try:
    - apply:
        file: ../kubernetes-version-check.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: chainsaw-step-02-apply-1.yaml
    - apply:
        file: chainsaw-step-02-apply-2.yaml
  - name: step-03
    try:
    - script:
        content: |
          server_minor=$(kubectl version -o json | jq -r '.serverVersion.minor' | tr -d '+')
          secret_minor=$(kubectl get secret kversion-secret -n kubversion-ns -o=jsonpath='{.metadata.labels.apiminorversion}' | tr -d '+')
          echo "Server minor: $server_minor, Secret minor: $secret_minor"
          if [ -n "$secret_minor" ] && [ "$server_minor" = "$secret_minor" ]; then
            exit 0
          else
            echo "Version check failed: server=$server_minor, secret=$secret_minor"
            exit 1
          fi
    finally:
    - script:
        content: |
          kubectl delete namespace kubversion-ns --ignore-not-found
          kubectl delete -f permissions.yaml --ignore-not-found
