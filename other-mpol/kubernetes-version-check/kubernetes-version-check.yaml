apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: kubernetes-version-check
  annotations:
    policies.kyverno.io/title: Kubernetes Version Check
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      It is often needed to make decisions for resources based upon the version
      of the Kubernetes API server in the cluster. This policy serves as an example
      for how to retrieve the minor version of the Kubernetes API server and subsequently
      use in a policy behavior. It will mutate a Secret upon its creation with a label
      called `apiminorversion` the value of which is the minor version of the API server.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  variables:
    - name: caCm
      expression: >-
        resource.Get("v1", "configmaps", "kube-system", "kube-root-ca.crt")
    - name: caCert
      expression: >-
        size(variables.caCm) > 0 && "data" in variables.caCm && "ca.crt" in variables.caCm.data ?
        string(variables.caCm.data["ca.crt"]) : ""
    - name: versionInfo
      expression: >-
        http.Client(variables.caCert).Get("https://kubernetes.default.svc/version")
    - name: minorVersion
      expression: >-
        has(variables.versionInfo.minor) ? string(variables.versionInfo.minor) :
        (has(variables.versionInfo.body) && has(variables.versionInfo.body.minor) ? string(variables.versionInfo.body.minor) : "")
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.minorVersion != "" ? (
            has(object.metadata.labels) ?
              [JSONPatch{op: "add", path: "/metadata/labels/apiminorversion", value: variables.minorVersion}]
            :
              [JSONPatch{op: "add", path: "/metadata/labels", value: {}},
               JSONPatch{op: "add", path: "/metadata/labels/apiminorversion", value: variables.minorVersion}]
          ) : []
