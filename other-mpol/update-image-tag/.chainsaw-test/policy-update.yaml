apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: update-image-tag
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["CREATE", "UPDATE"]

  matchConditions:
    - name: has-vault-inject-annotation
      expression: "has(object.metadata.annotations) && object.metadata.annotations['vault.hashicorp.com/agent-inject'] == 'true'"

  variables:
    - name: containers
      expression: "object.spec.template.spec.containers"

    - name: vaultAgentIndex
      expression: >-
        variables.containers.map(c, c.name).indexOf('vault-agent')

    - name: hasVaultAgent
      expression: "variables.vaultAgentIndex >= 0"

  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.hasVaultAgent &&
          has(object.metadata.annotations) &&
          object.metadata.annotations['vault.hashicorp.com/agent-inject'] == 'true' ?
          [
            JSONPatch{
              op: "replace",
              path: "/spec/template/spec/containers/" + string(variables.vaultAgentIndex) + "/image",
              value: "vault:1.6.0"
            }
          ] : []
