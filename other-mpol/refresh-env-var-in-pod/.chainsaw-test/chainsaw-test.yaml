# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: refresh-env-var-in-pod
spec:
  steps:
  - name: step-00
    try:
    - apply:
        file: chainsaw-step-00-apply-1.yaml
  - name: step-01
    try:
    - apply:
        file: ../refresh-env-var-in-pod.yaml
    - apply:
        file: ns.yaml
    - apply:
        file: secret.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: deployment.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        namespace: refresh-env-var-ns
        timeout: 1m
        for:
          condition:
            name: Ready
            value: 'true'
    - script:
        content: |
          kubectl get pod -n refresh-env-var-ns --no-headers | awk '{print $1}' > deploy-names.txt
  - name: step-04
    try:
    - sleep:
        duration: 5s
    - apply:
        file: chainsaw-step-04-apply-1.yaml
    - apply:
        file: chainsaw-step-04-apply-2.yaml
  - name: step-05
    try:
    - sleep:
        duration: 5s
    - script:
        content: |
          annotation=$(kubectl get deploy deployment01 -n refresh-env-var-ns -o json | kyverno jp query "spec.template.metadata.annotations.\"corp.org/random\" || '' " | tail -n 1 | cut -d '"' -f 2)
          if [ -n "$annotation" ]; then
            exit 0
          else
            echo "Expected deployment01 to have a non-empty random annotation, got: '$annotation'"
            exit 1
          fi
    - script:
        content: |
          annotation=$(kubectl get deploy deployment02 -n refresh-env-var-ns -o json | kyverno jp query "spec.template.metadata.annotations.\"corp.org/random\" || '' " | tail -n 1 | cut -d '"' -f 2)
          if [ -n "$annotation" ] && [ "$annotation" != "1234abcd" ]; then
            exit 0
          else
            echo "Expected deployment02 annotation to change from 1234abcd to a new random value, got: '$annotation'"
            exit 1
          fi
    - script:
        content: |
          annotation=$(kubectl get deploy deployment03 -n refresh-env-var-ns -o json | kyverno jp query "spec.template.metadata.annotations.\"corp.org/random\" || '' " | tail -n 1 | cut -d '"' -f 2)
          if [ "$annotation" = "1234abcd" ]; then
            exit 0
          else
            echo "Expected deployment03 annotation to remain 1234abcd, got: '$annotation'"
            exit 1
          fi
    - sleep:
        duration: 5s
    - script:
        content: |
          old_name=$(grep deployment01 deploy-names.txt)
          new_pod=$(kubectl get pod --no-headers -n refresh-env-var-ns -o custom-columns=":metadata.name" | grep deployment01 | grep -v "^${old_name}$" | head -n 1)
          if [ -z "$new_pod" ]; then
            new_pod=$(kubectl get pod --no-headers -n refresh-env-var-ns -o custom-columns=":metadata.name" | grep deployment01 | head -n 1)
          fi
          env_one=$(kubectl exec -n refresh-env-var-ns "$new_pod" -- printenv ENV_SECRET)
          if [ "$env_one" = "bar" ]; then
            exit 0
          else
            echo "Expected ENV_SECRET to be 'bar' in new pod $new_pod, got: '$env_one'"
            exit 1
          fi
    - sleep:
        duration: 5s
    - script:
        content: |
          old_name=$(grep deployment02 deploy-names.txt)
          new_pod=$(kubectl get pod --no-headers -n refresh-env-var-ns -o custom-columns=":metadata.name" | grep deployment02 | grep -v "^${old_name}$" | head -n 1)
          if [ -z "$new_pod" ]; then
            new_pod=$(kubectl get pod --no-headers -n refresh-env-var-ns -o custom-columns=":metadata.name" | grep deployment02 | head -n 1)
          fi
          env_two=$(kubectl exec -n refresh-env-var-ns "$new_pod" -- printenv ENV_SECRET)
          if [ "$env_two" = "bar" ]; then
            exit 0
          else
            echo "Expected ENV_SECRET to be 'bar' in new pod $new_pod, got: '$env_two'"
            exit 1
          fi
    - sleep:
        duration: 5s
    - script:
        content: |
          old_name=$(grep deployment03 deploy-names.txt)
          current_pod=$(kubectl get pod --no-headers -n refresh-env-var-ns -o custom-columns=":metadata.name" | grep deployment03 | head -n 1)
          if [ "$current_pod" != "$old_name" ]; then
            echo "Fail: deployment03 was patched unexpectedly (expected $old_name, found $current_pod)."
            exit 1
          fi
          three_env_one=$(kubectl exec -n refresh-env-var-ns "$current_pod" -- printenv ENV_SECRET)
          if [ "$three_env_one" = "foo" ]; then
            exit 0
          else
            echo "Failed. Value of ENV_SECRET is currently $three_env_one."
            exit 1
          fi
    - script:
        content: kubectl delete all --all --force --grace-period=0 -n refresh-env-var-ns
