apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: refresh-volumes-in-pods
  annotations:
    policies.kyverno.io/title: Refresh Volumes in Pods
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,ConfigMap
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Although ConfigMaps and Secrets mounted as volumes to a Pod, when the contents change,
      will eventually propagate to the Pods mounting them, this process may take between 60-90 seconds.
      In order to reduce that time, a modification made to downstream Pods will cause the changes
      to take effect almost instantly. This policy watches for changes to ConfigMaps which have been
      marked for this quick reloading process which contain the label `kyverno.io/watch=true` and
      will write an annotation to any Pods which mount them as volumes causing a fast refresh in their
      contents. See the related policy entitled "Refresh Environment Variables in Pods" for a similar
      reloading process when ConfigMaps and Secrets are consumed as environment variables instead.
      Use of this policy may require providing the Kyverno ServiceAccount with permission
      to update Pods.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["configmaps"]
  matchConditions:
  - name: watched-configmap
    expression: "has(object.metadata.labels) && object.metadata.labels['kyverno.io/watch'] == 'true'"
  variables:
  - name: cmName
    expression: "object.metadata.name"
  targetMatchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods"]
  targetMatchConditions:
  - name: mounts-configmap-volume
    expression: >-
      has(object.metadata.namespace) &&
      object.metadata.namespace == request.namespace &&
      has(object.spec.volumes) &&
      object.spec.volumes.exists(v,
        has(v.configMap) && has(v.configMap.name) &&
        v.configMap.name == variables.cmName
      )
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        !has(object.metadata) ?
          [JSONPatch{op: "add", path: "/metadata", value: {"annotations": {"corp.org/random": random('[0-9a-z]{8}')}}}] :
        has(object.metadata.annotations) ?
          [JSONPatch{op: "add", path: "/metadata/annotations/" + jsonpatch.escapeKey("corp.org/random"), value: random('[0-9a-z]{8}')}] :
          [JSONPatch{op: "add", path: "/metadata/annotations", value: {"corp.org/random": random('[0-9a-z]{8}')}}]
