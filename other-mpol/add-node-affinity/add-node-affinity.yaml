apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-node-affinity
  annotations:
    policies.kyverno.io/title: Add Node Affinity
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.21"
    policies.kyverno.io/description: >-
      Node affinity, similar to node selection, is a way to specify which node(s) on which Pods will be scheduled
      but based on more complex conditions. This policy will add node affinity to a Deployment and if one already
      exists an expression will be added to it.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments"]
  variables:
  - name: expression
    expression: "{'key': dyn('zone_weight'), 'operator': dyn('Lt'), 'values': dyn(['400'])}"
  - name: podSpec
    expression: object.spec.template.spec
  - name: terms
    expression: >-
      variables.podSpec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.?nodeSelectorTerms.orValue([])
  - name: termsPath
    expression: "'/spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms'"
  - name: lastTermPath
    expression: "variables.termsPath + '/' + string(variables.terms.size() - 1)"
  matchConditions:
  # Skip when the last term already carries the expression so that repeated
  # UPDATE requests do not append duplicates.
  - name: expression-not-present
    expression: >-
      variables.terms.size() == 0 ||
      !variables.terms[variables.terms.size() - 1].?matchExpressions.orValue([]).exists(e,
        e.key == 'zone_weight' && e.operator == 'Lt' && e.?values.orValue([]) == ['400'])
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        !has(variables.podSpec.affinity) ?
          [JSONPatch{op: "add", path: "/spec/template/spec/affinity", value: {"nodeAffinity": {"requiredDuringSchedulingIgnoredDuringExecution": {"nodeSelectorTerms": [{"matchExpressions": [variables.expression]}]}}}}] :
        !has(variables.podSpec.affinity.nodeAffinity) ?
          [JSONPatch{op: "add", path: "/spec/template/spec/affinity/nodeAffinity", value: {"requiredDuringSchedulingIgnoredDuringExecution": {"nodeSelectorTerms": [{"matchExpressions": [variables.expression]}]}}}] :
        !has(variables.podSpec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) ?
          [JSONPatch{op: "add", path: "/spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution", value: {"nodeSelectorTerms": [{"matchExpressions": [variables.expression]}]}}] :
        variables.terms.size() == 0 ?
          [JSONPatch{op: "add", path: variables.termsPath, value: [{"matchExpressions": [variables.expression]}]}] :
        !has(variables.terms[variables.terms.size() - 1].matchExpressions) ?
          [JSONPatch{op: "add", path: variables.lastTermPath + "/matchExpressions", value: [variables.expression]}] :
          [JSONPatch{op: "add", path: variables.lastTermPath + "/matchExpressions/-", value: variables.expression}]
