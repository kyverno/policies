apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: add-node-affinity-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - name: add-node-affinity
    kind: MutatingPolicy
  matchConditions:
  - name: exact-resource
    expression: object.metadata.namespace == 'default' && object.metadata.name == 'exception-deployment'
