apiVersion: apps/v1
kind: Deployment
metadata:
  name: exception-deployment
  namespace: default
  labels:
    app: exception
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exception
  template:
    metadata:
      labels:
        app: exception
    spec:
      containers:
      - name: busybox
        image: busybox:1.36
