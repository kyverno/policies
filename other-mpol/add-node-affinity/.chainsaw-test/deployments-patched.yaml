apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-deployment
  labels:
    app: tomcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: zone_weight
                operator: Lt
                values:
                - "400"
      containers:
      - name: tomcat
        image: ghcr.io/kyverno/test-busybox:1.35
        command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: fookey
                operator: In
                values:
                - bar
              - key: zone_weight
                operator: Lt
                values:
                - "400"
      containers:
      - name: nginx
        image: ghcr.io/kyverno/test-busybox:1.35
        command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: zone_weight
                operator: Lt
                values:
                - "400"
              matchFields:
              - key: metadata.name
                operator: In
                values:
                - red
      containers:
      - name: redis
        image: ghcr.io/kyverno/test-busybox:1.35
        command: ["sleep", "3600"]
