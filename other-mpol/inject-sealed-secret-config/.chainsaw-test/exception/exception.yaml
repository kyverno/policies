apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: skip-sealed-secret-env
  namespace: policy-exceptions
spec:
  policyRefs: [{kind: MutatingPolicy, name: inject-sealed-secret-config}]
  images: [nginx:1.20]
  matchConditions:
  - name: exact-target
    expression: object.metadata.?namespace.orValue('') == 'default' && object.metadata.name == 'exception-pod'
