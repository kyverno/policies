apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: restart-deployment-on-secret-change
  annotations:
    policies.kyverno.io/title: Restart Deployment On Secret Change
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      If Secrets are mounted in ways which do not naturally allow updates to
      be live refreshed it may be necessary to modify a Deployment. This policy
      watches a Secret and if it changes will write an annotation
      to one or more target Deployments thus triggering a new rollout and thereby
      refreshing the referred Secret. It may be necessary to grant additional privileges
      to the Kyverno ServiceAccount, via one of the existing ClusterRoleBindings or a new
      one, so it can modify Deployments.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["secrets"]
  matchConditions:
  - name: is-mysecret-in-default
    expression: "object.metadata.name == 'mysecret' && has(object.metadata.namespace) && object.metadata.namespace == 'default'"
  variables:
  - name: secretResourceVersion
    expression: "request.object.metadata.resourceVersion"
  targetMatchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["deployments"]
      resourceNames: ["busybox"]
  targetMatchConditions:
  - name: is-default-busybox
    expression: "has(object.metadata.namespace) && object.metadata.namespace == 'default' && object.metadata.name == 'busybox'"
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        !has(object.spec.template.metadata) ?
          [JSONPatch{op: "add", path: "/spec/template/metadata", value: {"annotations": {"ops.corp.com/triggerrestart": variables.secretResourceVersion}}}] :
        has(object.spec.template.metadata.annotations) ?
          [JSONPatch{op: "add", path: "/spec/template/metadata/annotations/" + jsonpatch.escapeKey("ops.corp.com/triggerrestart"), value: variables.secretResourceVersion}] :
          [JSONPatch{op: "add", path: "/spec/template/metadata/annotations", value: {"ops.corp.com/triggerrestart": variables.secretResourceVersion}}]
