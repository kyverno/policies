apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: busybox
  name: deployment01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  strategy: {}
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: bb
        image: ghcr.io/kyverno/test-busybox:1.35
        imagePullPolicy: Always
      - name: bb2
        image: ghcr.io/kyverno/test-busybox:1.35
        imagePullPolicy: Always
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob01
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: bb
            image: ghcr.io/kyverno/test-busybox:1.35
            imagePullPolicy: Always
          - name: bb2
            image: ghcr.io/kyverno/test-busybox:1.35
            imagePullPolicy: Always
          restartPolicy: OnFailure
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset01
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: bb
        image: ghcr.io/kyverno/test-busybox:1.35
        imagePullPolicy: Always
---
apiVersion: apps/v1
kind: StatefulSet
