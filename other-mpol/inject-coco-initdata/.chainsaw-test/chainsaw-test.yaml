# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-inject-coco-initdata
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ../inject-coco-initdata.yaml
        template: false
    - assert:
        file: policy-ready.yaml
        timeout: 10s

  - name: step-02
    try:
    - apply:
        resource:
          apiVersion: v1
          data:
            data: confidential-data-payload
          kind: ConfigMap
          metadata:
            name: coco-initdata
            namespace: default
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              coco.io/initdata-configmap: coco-initdata
            labels:
              coco: enabled
            name: good-pod-coco-enabled
            namespace: default
          spec:
            containers:
            - image: nginx:1.21.0
              name: nginx
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              io.katacontainers.config.runtime.cc_init_data: confidential-data-payload
            name: good-pod-coco-enabled
            namespace: default
        timeout: 60s

  - name: step-03
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              coco.io/initdata-configmap: coco-initdata
            name: pod-no-coco-label
            namespace: default
          spec:
            containers:
            - image: nginx:1.21.0
              name: nginx
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              io.katacontainers.config.runtime.cc_init_data: confidential-data-payload
            name: pod-no-coco-label
            namespace: default
        timeout: 10s
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              coco.io/initdata-configmap: coco-initdata
            labels:
              coco: enabled
            name: sibling-pod-coco
            namespace: default
          spec:
            containers:
            - image: nginx:1.21.0
              name: nginx
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              io.katacontainers.config.runtime.cc_init_data: confidential-data-payload
            name: sibling-pod-coco
            namespace: default
  - name: step-04
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            labels:
              coco: enabled
            name: pod-no-configmap-annotation
            namespace: default
          spec:
            containers:
            - image: nginx:1.21.0
              name: nginx
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              io.katacontainers.config.runtime.cc_init_data: confidential-data-payload
            name: pod-no-configmap-annotation
            namespace: default
        timeout: 10s
  - name: step-05
    try:
    - apply:
        resource:
          apiVersion: v1
          data: {}
          kind: ConfigMap
          metadata:
            name: empty-initdata
            namespace: default
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              coco.io/initdata-configmap: empty-initdata
            labels:
              coco: enabled
            name: pod-empty-configmap
            namespace: default
          spec:
            containers:
            - image: nginx:1.21.0
              name: nginx
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              io.katacontainers.config.runtime.cc_init_data: confidential-data-payload
            name: pod-empty-configmap
            namespace: default
        timeout: 10s
  - name: step-06-exception
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
    - apply:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: PolicyException
          metadata:
            name: inject-coco-initdata-exception
            namespace: policy-exceptions
          spec:
            policyRefs:
            - name: inject-coco-initdata
              kind: MutatingPolicy
            matchConditions:
            - name: exact-workload
              expression: object.metadata.namespace == 'default' && object.metadata.name == 'exception-pod-coco'
    - sleep: {duration: 15s}
    - apply:
        file: exception-pod.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            annotations:
              coco.io/initdata-configmap: coco-initdata
            name: exception-pod-coco
            namespace: default
        timeout: 20s
