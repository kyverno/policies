name: add-default-resources
version: 1.0.0
displayName: Add Default Resources
createdAt: "2025-09-20T20:30:02.000Z"
description: >-
  Pods which don't specify at least resource requests are assigned a QoS class of BestEffort which can hog resources for other Pods on Nodes. At a minimum, all Pods should specify resource requests in order to be labeled as the QoS class Burstable. This sample mutates any container in a Pod which doesn't specify memory or cpu requests to apply some sane defaults.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/add-default-resources/add-default-resources.yaml
  ```
keywords:
  - kyverno
  - Other
readme: |
  Pods which don't specify at least resource requests are assigned a QoS class of BestEffort which can hog resources for other Pods on Nodes. At a minimum, all Pods should specify resource requests in order to be labeled as the QoS class Burstable. This sample mutates any container in a Pod which doesn't specify memory or cpu requests to apply some sane defaults.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-default-resources` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Kyverno exposes matching exceptions' `spec.images` as `exceptions.allowedImages`.
  Exact image matches preserve that regular container's resource configuration;
  non-exempt containers still receive the policy's normal resource defaults.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/add-default-resources/.chainsaw-test/partial-exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.26"
  kyverno/subject: "Pod"
