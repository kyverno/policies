apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: add-default-resources-exception
  namespace: policy-exceptions
spec:
  policyRefs: [{kind: MutatingPolicy, name: add-default-resources}]
  matchConditions:
  - name: exact-resource
    expression: object.metadata.?namespace.orValue('') == '' && object.metadata.name == 'nginx-demo1'
