apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo1
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo2
spec:
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        memory: "200Mi" 
        cpu: "200m"
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo3
spec:
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        memory: "200Mi" 
  - name: busybox
    image: busybox:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo4
spec:
  initContainers:
  - name: init-default
    image: busybox:latest
  - name: init-partial
    image: busybox:latest
    resources:
      requests:
        cpu: "200m"
  containers:
  - name: nginx
    image: nginx:1.14.2
