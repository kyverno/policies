keywords:
  - kyverno
  - KubeVirt
readme: |
  Add an SSH Service to every VirtualMachineInstance which is getting created. This Service will use a ClusterIP, thus the admin has to ensure that the IP space is large enough and ClusterIP type can be met.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `GeneratingPolicy` named
  `k6t-add-services` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/kubevirt-gpol/add-services/.chainsaw-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal generation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
