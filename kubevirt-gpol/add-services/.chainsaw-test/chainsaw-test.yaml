# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: add-services
spec:
  steps:
  - name: step-00
    try:
    - apply:
        file: ../../../.chainsaw/crds/kubevirt-vm.yaml
    - assert:
        file: chainsaw-step-00-assert-1.yaml
  - name: step-01
    try:
    - apply:
        file: permissions.yaml
    - apply:
        file: chainsaw-step-01-apply-1.yaml
  - name: step-02
    try:
    - apply:
        file: ../add-services.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-03
    try:
    - apply:
        file: vmi.yaml
  - name: step-04
    try:
    - assert:
        file: generated-svc.yaml
  - name: exception-isolation
    try:
    - apply:
        file: exception-namespace.yaml
    - apply:
        file: exception.yaml
    - apply:
        file: exception-vmi.yaml
    - sleep:
        duration: 15s
    - error:
        file: exception-service.yaml
    - apply:
        file: exception-vmi-sibling.yaml
    - sleep:
        duration: 15s
    - assert:
        file: exception-service-sibling.yaml
    - apply:
        file: exception-wrong-namespace.yaml
    - apply:
        file: exception-wrong-namespace-vmi.yaml
    - sleep:
        duration: 15s
    - assert:
        file: exception-wrong-namespace-service.yaml
    - delete:
        file: exception.yaml
    - delete:
        file: exception-vmi.yaml
    - sleep:
        duration: 5s
    - apply:
        file: exception-vmi.yaml
    - sleep:
        duration: 15s
    - assert:
        file: exception-service.yaml
