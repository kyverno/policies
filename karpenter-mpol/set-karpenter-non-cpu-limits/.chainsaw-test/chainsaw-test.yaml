# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: set-karpenter-non-cpu-limits
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ../set-karpenter-non-cpu-limits.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: ns.yaml
    - apply:
        file: ../.kyverno-test/resources.yaml
    - apply:
        file: podcontroller-resources.yaml
    - apply:
        file: pod-others.yaml
  - name: step-03
    try:
    - assert:
        file: ../.kyverno-test/pod-memory-patched1.yaml
    - assert:
        file: ../.kyverno-test/pod-memory-patched2.yaml
    - assert:
        file: ../.kyverno-test/pod-memory-patched3.yaml
    - assert:
        file: ../.kyverno-test/pod-memory-patched4.yaml
    - assert:
        file: ../.kyverno-test/pod-ephemeral-storage-patched1.yaml
    - assert:
        file: ../.kyverno-test/pod-ephemeral-storage-patched2.yaml
    - assert:
        file: ../.kyverno-test/pod-ephemeral-storage-patched3.yaml
    - assert:
        file: ../.kyverno-test/pod-ephemeral-storage-patched4.yaml
    - assert:
        file: podcontroller-patched.yaml
    - assert:
        file: pod-others-patched.yaml
  - name: exception-isolation
    try:
    - apply:
        file: exception-namespace.yaml
    - apply:
        file: exception.yaml
    - sleep:
        duration: 15s
    - apply:
        file: exception-pod.yaml
    - assert:
        file: exception-assert.yaml
    - apply:
        file: exception-sibling.yaml
    - assert:
        file: exception-sibling-patched.yaml
    - apply:
        file: exception-wrong-namespace.yaml
    - apply:
        file: exception-wrong-namespace-pod.yaml
    - assert:
        file: exception-wrong-namespace-patched.yaml
  - name: revoked-exception-restores-mutation
    try:
    - delete:
        ref:
          apiVersion: policies.kyverno.io/v1
          kind: PolicyException
          name: karpenter-limits-exception
          namespace: policy-exceptions
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: exception-limits-pod
          namespace: test
    - sleep:
        duration: 15s
    - apply:
        file: exception-pod.yaml
    - assert:
        file: revoked-exception-patched.yaml
