apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: test-rs
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-rs
  template:
    metadata:
      labels:
        app: test-rs
    spec:
      containers:
        - name: test-rs
          image: test/test:latest
          resources:
            limits:
              memory: "1Gi"
            requests:
              memory: "1Gi"
