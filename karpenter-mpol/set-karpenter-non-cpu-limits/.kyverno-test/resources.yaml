---
apiVersion: v1
kind: Pod
metadata:
  name: test1
  namespace: test
spec:
  containers:
    - name: test1
      image: test/test:latest
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
---
apiVersion: v1
kind: Pod
metadata:
  name: test2
  namespace: test
spec:
  containers:
    - name: test2
      image: test/test:latest
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
---
apiVersion: v1
kind: Pod
metadata:
  name: test3
  namespace: test
spec:
  containers:
    - name: test3
      image: test/test:latest
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "1Gi"
        requests:
          cpu: "1"
          memory: "500Mi"
          ephemeral-storage: "500Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: test4
  namespace: test
spec:
  containers:
    - name: test4
      image: test/test:latest
      resources: {}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: test-rs
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-rs
  template:
    metadata:
      labels:
        app: test-rs
    spec:
      containers:
        - name: test-rs
          image: test/test:latest
          resources:
            requests:
              memory: "1Gi"
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: test-rc
  namespace: test
spec:
  replicas: 1
  selector:
    app: test-rc
  template:
    metadata:
      labels:
        app: test-rc
    spec:
      containers:
        - name: test-rc
          image: test/test:latest
          resources:
            requests:
              memory: "1Gi"
