      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: spot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kp-small-ns
  name: deploy-sm01
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
