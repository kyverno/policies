# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: restrict-image-registries
spec:
  # disable templating because it can cause issues with VPOL
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: rbac-ephemeralcontainers.yaml
    - apply:
        file: rbac-ephemeralcontainers-reports.yaml
    - script:
        content: |
          set -eu
          for attempt in $(seq 1 30); do
            ready=true
            if ! kubectl auth can-i update pods --subresource=ephemeralcontainers --as=system:serviceaccount:kyverno:kyverno-admission-controller | grep -qx yes; then
              ready=false
            fi
            for verb in get list watch; do
              if ! kubectl auth can-i "$verb" pods --subresource=ephemeralcontainers --as=system:serviceaccount:kyverno:kyverno-reports-controller | grep -qx yes; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then exit 0; fi
            sleep 1
          done
          echo 'ephemeral-container RBAC aggregation did not become observable for admission update and reports read permissions'
          exit 1
    - apply:
        file: ../restrict-image-registries.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: restrict-image-registries
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
    - sleep:
        duration: 7s
  - name: step-02
    try:
    - apply:
        file: good-pods.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-image-registries failed')): true
        file: bad-pod-noregistry.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-image-registries failed')): true
        file: bad-pod-notall.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-image-registries failed')): true
        file: bad-pod-false.yaml
  - name: step-03
    try:
    - script:
        content: | 
                if kubectl debug goodpod02-registry \
                --profile=general \
                --image=busybox:1.35 \
                --target=k8s-nginx \
                -n ir-pods-namespace; then
                exit 1
                else
                exit 0
                fi

  - name: step-98
    try:
    - delete:
        file: rbac-ephemeralcontainers.yaml
    - delete:
        file: rbac-ephemeralcontainers-reports.yaml
    - script:
        content: kubectl delete pods --all --force --grace-period=0 -n ir-pods-namespace
