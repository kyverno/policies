apiVersion: batch/v1
kind: CronJob
metadata:
  name: reqprobes-goodcronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: app
            image: ghcr.io/kyverno/test-busybox:1.35
            readinessProbe:
              exec:
                command: ["true"]
