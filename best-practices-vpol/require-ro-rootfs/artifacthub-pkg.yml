name: require-ro-rootfs-VPOL
version: 1.0.0
displayName: Require Read-Only Root Filesystem in VPOL
description: >-
  A read-only root file system helps to [Deny] an immutable infrastructure strategy; the container only needs to write on the mounted volume that persists the state. An immutable root filesystem can also prevent malicious binaries from writing to the host system. This policy validates that containers define a securityContext with `readOnlyRootFilesystem: true`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-ro-rootfs/require-ro-rootfs.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - EKS Best Practices
  - VPOL
readme: |
  A read-only root file system helps to [Deny] an immutable infrastructure strategy; the container only needs to write on the mounted volume that persists the state. An immutable root filesystem can also prevent malicious binaries from writing to the host system. This policy validates that containers define a securityContext with `readOnlyRootFilesystem: true`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-ro-rootfs` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  includes only regular containers (`spec.containers`).
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/require-ro-rootfs/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices, EKS Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
