name: check-deprecated-apis-vpol
version: 1.0.0
displayName: Check deprecated APIs in VPOL
description: >-
  Kubernetes APIs are sometimes deprecated and removed after a few releases. As a best practice, older API versions should be replaced with newer versions. This policy validates for APIs that are deprecated or scheduled for removal. Note that checking for some of these resources may require modifying the Kyverno ConfigMap to remove filters. PodSecurityPolicy is removed in v1.25 so therefore the validate-v1-25-removals rule may not completely work on 1.25+. 
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/check-deprecated-apis/check-deprecated-apis.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - VPOL
readme: |
  Kubernetes APIs are sometimes deprecated and removed after a few releases. As a best practice, older API versions should be replaced with newer versions. This policy validates for APIs that are deprecated or scheduled for removal. Note that checking for some of these resources may require modifying the Kyverno ConfigMap to remove filters. PodSecurityPolicy is removed in v1.25 so therefore the validate-v1-25-removals rule may not completely work on 1.25+. 
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-deprecated-apis` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Put `deprecated-api` in `spec.allowedValues` to waive deprecated-API
  validation for the matched request. Kyverno exposes this control token through
  `exceptions.allowedValues`; it is not an API version or resource name.
  Use `spec.matchConditions` to restrict the approved API version, kind, namespace,
  and name; without that token, matched deprecated APIs still fail validation.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/check-deprecated-apis/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Kubernetes APIs"
