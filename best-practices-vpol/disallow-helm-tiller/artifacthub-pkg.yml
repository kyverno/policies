name: disallow-helm-tiller-VPOL
version: 1.0.0
displayName: Disallow Helm Tiller in VPOL
description: >-
  Tiller, found in Helm v2, has known security challenges. It requires administrative privileges and acts as a shared resource accessible to any authenticated user. Tiller can lead to privilege escalation as restricted users can impact other users. It is recommend to use Helm v3+ which does not contain Tiller for these reasons. This policy validates that there is not an image containing the name `tiller`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-helm-tiller/disallow-helm-tiller.yaml
  ```
keywords:
  - kyverno
  - Sample
  - VPOL
readme: |
  Tiller, found in Helm v2, has known security challenges. It requires administrative privileges and acts as a shared resource accessible to any authenticated user. Tiller can lead to privilege escalation as restricted users can impact other users. It is recommend to use Helm v3+ which does not contain Tiller for these reasons. This policy validates that there is not an image containing the name `tiller`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-helm-tiller` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  includes regular, init, and ephemeral containers.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/disallow-helm-tiller/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample in VPOL"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
