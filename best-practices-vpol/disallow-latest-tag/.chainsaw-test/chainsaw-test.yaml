# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: disallow-latest-tag
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: rbac-ephemeralcontainers.yaml
    - apply:
        file: rbac-ephemeralcontainers-reports.yaml
    - sleep:
        duration: 5s
    - script:
        content: |
          set -eu
          for attempt in $(seq 1 30); do
            ready=true
            if ! kubectl auth can-i update pods --subresource=ephemeralcontainers --as=system:serviceaccount:kyverno:kyverno-admission-controller | grep -qx yes; then
              ready=false
            fi
            for verb in get list watch; do
              if ! kubectl auth can-i "$verb" pods --subresource=ephemeralcontainers --as=system:serviceaccount:kyverno:kyverno-reports-controller | grep -qx yes; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then exit 0; fi
            sleep 1
          done
          echo 'ephemeral-container RBAC aggregation did not become observable for admission update and reports read permissions'
          exit 1
    - apply:
        file: ../disallow-latest-tag.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-latest-tag
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: good-pod.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-latest-tag failed')): true
        file: bad-pod-latest-fail-first.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-latest-tag failed')): true
        file: bad-pod-latest-success-first.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-latest-tag failed')): true
        file: bad-pod-no-tag.yaml
    - apply:
        file: registry-port-pod.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-latest-tag failed')): true
        file: init-latest-pod.yaml
  - name: step-98
    try:
    - delete:
        file: rbac-ephemeralcontainers.yaml
    - delete:
        file: rbac-ephemeralcontainers-reports.yaml
