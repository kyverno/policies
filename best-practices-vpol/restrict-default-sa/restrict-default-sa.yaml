apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-default-sa
  annotations:
    policies.kyverno.io/title: Restrict Use of Default Service Accounts
    policies.kyverno.io/category: Best Practices in VPOL
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, ServiceAccount
    policies.kyverno.io/minversion: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      Kubernetes provides a default service account in every namespace. When no
      explicit service account is assigned to a pod, this default account is used
      automatically. To improve auditability and enforce least-privilege access,
      workloads should use dedicated service accounts with only the permissions
      they require. This policy prevents pods from using the default service
      account.
spec:
  validationActions: [Audit]

  evaluation:
    background:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]

  validations:
    - expression: >-
        object.kind != 'Pod' || (
          has(object.spec.serviceAccountName) &&
          object.spec.serviceAccountName != '' &&
          object.spec.serviceAccountName != 'default'
        )
      message: >-
        Pods must not use the default ServiceAccount. Set spec.serviceAccountName
        to a dedicated ServiceAccount for this workload.