name: restrict-default-sa
version: 1.0.0
displayName: Restrict Use of Default Service Accounts
description: >-
  Kubernetes provides a default service account in every namespace. When no
  explicit service account is assigned to a pod, this default account is used
  automatically. To improve auditability and enforce least-privilege access,
  workloads should use dedicated service accounts with only the permissions
  they require. This policy prevents pods from using the default service
  account in all namespaces.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/restrict-default-sa/restrict-default-sa.yaml
  ```
keywords:
  - kyverno
  - best-practices
  - vpol
  - Security
  - ValidatingPolicy
readme: |
  Kubernetes provides a default service account in every namespace. When no
  explicit service account is assigned to a pod, this default account is used
  automatically. To improve auditability and enforce least-privilege access,
  workloads should use dedicated service accounts with only the permissions
  they require. This policy prevents pods from using the default service
  account in all namespaces.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod, ServiceAccount"
