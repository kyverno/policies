name: disallow-cri-sock-mount-VPOL
version: 1.0.0
displayName: Disallow CRI socket mounts in VPOL
description: >-
  Container daemon socket bind mounts allows access to the container engine on the node. This access can be used for privilege escalation and to manage containers outside of Kubernetes, and hence should not be allowed. This policy validates that the sockets used for CRI engines Docker, Containerd, and CRI-O are not used, whether they are referenced under /var/run or under /run (/var/run is normally a symlink to /run). It also blocks mounting the parent directories (/, /var, /var/run and /run), which would expose the same sockets.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-cri-sock-mount/disallow-cri-sock-mount.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - EKS Best Practices
  - VPOL
readme: |
  Container daemon socket bind mounts allows access to the container engine on the node. This access can be used for privilege escalation and to manage containers outside of Kubernetes, and hence should not be allowed. This policy validates that the sockets used for CRI engines Docker, Containerd, and CRI-O are not used, whether they are referenced under /var/run or under /run (/var/run is normally a symlink to /run). It also blocks mounting the parent directories (/, /var, /var/run and /run), which would expose the same sockets.
  
  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
