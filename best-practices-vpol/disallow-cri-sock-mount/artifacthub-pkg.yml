name: disallow-cri-sock-mount-VPOL
version: 1.0.0
displayName: Disallow CRI socket mounts in VPOL
description: >-
  Container daemon socket bind mounts allows access to the container engine on the node. This access can be used for privilege escalation and to manage containers outside of Kubernetes, and hence should not be allowed. This policy validates that the sockets used for CRI engines Docker, Containerd, and CRI-O are not used. In addition to or replacement of this policy, preventing users from mounting the parent directories (/var/run and /var) may be necessary to completely prevent socket bind mounts.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/disallow-cri-sock-mount/disallow-cri-sock-mount.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - EKS Best Practices
  - VPOL
readme: |
  Container daemon socket bind mounts allows access to the container engine on the node. This access can be used for privilege escalation and to manage containers outside of Kubernetes, and hence should not be allowed. This policy validates that the sockets used for CRI engines Docker, Containerd, and CRI-O are not used. In addition to or replacement of this policy, preventing users from mounting the parent directories (/var/run and /var) may be necessary to completely prevent socket bind mounts.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-container-sock-mounts` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Put exact hostPath socket paths in `spec.allowedValues`, which Kyverno exposes
  as `exceptions.allowedValues`. Only those paths are exempted on the matched Pod.
  `variables.forbiddenSockets` lists the four paths checked for exact equality:
  `/var/run/docker.sock`, `/var/run/containerd/containerd.sock`,
  `/var/run/crio/crio.sock`, and `/var/run/cri-dockerd.sock`.
  hostPath paths are normalized first, so aliases such as `/var/run/./docker.sock`
  or `//var/run/docker.sock/` are rejected too, and `spec.allowedValues` entries
  are compared against the normalized path.
  Other forbidden socket paths remain rejected; entries are not patterns.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/disallow-cri-sock-mount/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices, EKS Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30"
