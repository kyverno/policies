apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-container-sock-mounts
  annotations:
    policies.kyverno.io/title: Disallow CRI socket mounts in VPOL
    policies.kyverno.io/category: Best Practices, EKS Best Practices in VPOl
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      Container daemon socket bind mounts allows access to the container engine on the
      node. This access can be used for privilege escalation and to manage containers
      outside of Kubernetes, and hence should not be allowed. This policy validates that
      the sockets used for CRI engines Docker, Containerd, and CRI-O are not used. In addition
      to or replacement of this policy, preventing users from mounting the parent directories
      (/var/run and /var) may be necessary to completely prevent socket bind mounts.
spec:
  validationActions: [Audit]
  evaluation:
   background:
        enabled: true   
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [pods]
  variables:
          - name: hasVolumes
            expression: "!has(object.spec.volumes)"
          - name: volumes
            expression: "object.spec.volumes"
          - name: volumesWithHostPath
            expression: "variables.volumes.filter(volume, has(volume.hostPath))"
          - name: forbiddenSockets
            expression: "['/var/run/docker.sock', '/var/run/containerd/containerd.sock', '/var/run/crio/crio.sock', '/var/run/cri-dockerd.sock']"
  validations:
          - expression: >-
              variables.hasVolumes || variables.volumesWithHostPath.all(volume,
              volume.hostPath.path in exceptions.allowedValues ||
              !(volume.hostPath.path in variables.forbiddenSockets))
            message: "Container runtime Unix socket mounts are not allowed."
