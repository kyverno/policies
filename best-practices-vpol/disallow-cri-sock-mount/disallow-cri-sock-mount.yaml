apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-container-sock-mounts
  annotations:
    policies.kyverno.io/title: Disallow CRI socket mounts in VPOL
    policies.kyverno.io/category: Best Practices, EKS Best Practices in VPOl
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      Container daemon socket bind mounts allows access to the container engine on the
      node. This access can be used for privilege escalation and to manage containers
      outside of Kubernetes, and hence should not be allowed. This policy validates that
      the sockets used for CRI engines Docker, Containerd, and CRI-O are not used, whether they
      are referenced under /var/run or under /run (/var/run is normally a symlink to /run). It
      also blocks mounting the parent directories (/, /var, /var/run and /run) and the
      containerd and CRI-O socket directories, which would expose the same sockets.
spec:
  validationActions: [Audit]
  evaluation:
   background:
        enabled: true   
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [pods]
  variables:
          - name: hasVolumes
            expression: "!has(object.spec.volumes)"
          - name: volumes
            expression: "object.spec.volumes"
          - name: volumesWithHostPath
            expression: "variables.volumes.filter(volume, has(volume.hostPath))"
          # Normalize away empty and '.' segments so aliases such as /var/run/./docker.sock
          # or //var/run/docker.sock/ match. The API server already rejects '..' segments.
          - name: hostPaths
            expression: "variables.volumesWithHostPath.map(volume, '/' + volume.hostPath.path.split('/').filter(s, s != '' && s != '.').join('/'))"
          - name: forbiddenSockets
            expression: "['/var/run/docker.sock', '/var/run/containerd/containerd.sock', '/var/run/crio/crio.sock', '/var/run/cri-dockerd.sock', '/run/docker.sock', '/run/containerd/containerd.sock', '/run/crio/crio.sock', '/run/cri-dockerd.sock']"
          # Mounting these directories exposes the sockets above as much as mounting the sockets does.
          - name: forbiddenDirectories
            expression: "['/', '/var', '/var/run', '/var/run/containerd', '/var/run/crio', '/run', '/run/containerd', '/run/crio']"
  validations:
          - expression: >-
              variables.hasVolumes || variables.hostPaths.all(path,
              path in exceptions.allowedValues ||
              !(path in variables.forbiddenSockets || path in variables.forbiddenDirectories))
            message: "Container runtime Unix socket mounts, and mounts of the directories that contain them, are not allowed."
