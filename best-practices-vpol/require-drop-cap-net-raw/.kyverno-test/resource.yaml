apiVersion: v1
kind: Pod
metadata:
  name: drop-good
spec:
  initContainers:
  - name: init
    image: gcr.io/google-samples/node-hello:1.0
    securityContext:
      capabilities:
        drop: ["CAP_NET_RAW"]
  containers:
  - name: add-capabilities
    image: gcr.io/google-samples/node-hello:1.0
    securityContext:
      capabilities:
        drop: ["CAP_NET_RAW"]
  - name: drop-net-raw-add-all
    image: gcr.io/google-samples/node-hello:1.0
    securityContext:
      capabilities:
        drop: ["NET_RAW"]
        add: ["ALL"]
