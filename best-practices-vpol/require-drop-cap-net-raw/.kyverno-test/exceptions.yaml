apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: net-raw-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: drop-cap-net-raw
  images: [gcr.io/google-samples/node-hello:1.0]
  matchConditions:
  - name: exact-resource
    expression: object.kind == 'Pod' && object.metadata.namespace == 'default' && (object.metadata.name in ['exception-net-raw', 'exception-net-raw-positive'])
