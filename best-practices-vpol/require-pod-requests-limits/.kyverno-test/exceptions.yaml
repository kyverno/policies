apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: requests-limits-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: require-requests-limits
  images: [nginx]
  matchConditions:
  - name: exact-resource
    expression: object.kind == 'Pod' && object.metadata.namespace == 'default' && (object.metadata.name == 'exception-requests-limits')
