apiVersion: v1
kind: Pod
metadata:
  name: exception-requests-limits
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod01
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod02
  labels:
    app: myapp
spec:
  containers:
  - name: busybox
    image: busybox
    resources:
      requests:
        memory: "50Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod01
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod02
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod03
  labels:
    app: myapp
spec:
  containers:
  - name: busybox
    image: busybox
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-without-resources
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {memory: "128Mi"}
  initContainers:
  - name: init
    image: busybox:1.36
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {memory: "128Mi"}
  ephemeralContainers:
  - name: debugger
    image: busybox:1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: init-missing-requests
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {memory: "128Mi"}
  initContainers:
  - name: init
    image: busybox:1.36
    resources:
      limits: {memory: "128Mi"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autogen-missing-limit
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: nginx:1.27
        resources:
          requests: {cpu: "100m", memory: "64Mi"}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: autogen-init-missing-requests
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: app
            image: nginx:1.27
            resources:
              requests: {cpu: "100m", memory: "64Mi"}
              limits: {memory: "128Mi"}
          initContainers:
          - name: init
            image: busybox:1.36
            resources:
              limits: {memory: "128Mi"}
          restartPolicy: OnFailure
