apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bad-vm-secondary
spec:
  runStrategy: Halted
  template:
    spec:
      domain:
        devices:
          interfaces:
          - name: default
            masquerade: {}
          - name: finance-net
            bridge: {}
        resources:
          requests:
            memory: 128Mi
      networks:
      - name: default
        pod: {}
      - name: finance-net
        multus:
          networkName: finance/finance-vlan
