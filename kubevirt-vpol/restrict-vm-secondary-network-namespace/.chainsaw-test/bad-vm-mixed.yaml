apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bad-vm-mixed
spec:
  runStrategy: Halted
  template:
    spec:
      domain:
        devices:
          interfaces:
          - name: default
            masquerade: {}
          - name: tenant-net
            bridge: {}
          - name: finance-net
            bridge: {}
          - name: sriov-net
            sriov: {}
        resources:
          requests:
            memory: 128Mi
      networks:
      - name: default
        pod: {}
      - name: tenant-net
        multus:
          networkName: tenant-bridge
      - name: finance-net
        multus:
          networkName: finance/finance-vlan
      - name: sriov-net
        multus:
          networkName: infra/sriov-net
