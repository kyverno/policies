apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:aggregate-to-admission-controller:kubevirt-vm-networks
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances, virtualmachineinstancereplicasets]
    verbs: [get, list, watch]
  - apiGroups: [pool.kubevirt.io]
    resources: [virtualmachinepools]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:aggregate-to-reports-controller:kubevirt-vm-networks
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines, virtualmachineinstances, virtualmachineinstancereplicasets]
    verbs: [get, list, watch]
  - apiGroups: [pool.kubevirt.io]
    resources: [virtualmachinepools]
    verbs: [get, list, watch]
