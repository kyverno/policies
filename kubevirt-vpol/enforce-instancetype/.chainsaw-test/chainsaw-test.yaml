# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: enforce-instancetype
spec:
  template: false
  steps:
    - name: prerequisites
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: policy-ready
      try:
        - apply:
            file: ../enforce-instancetype.yaml
        - assert:
            file: policy-ready.yaml
    - name: validate-create
      try:
        - apply:
            file: vm-good.yaml
        - apply:
            file: vm-bad.yaml
            expect:
              - check:
                  ($error != null): true
    - name: validate-update
      try:
        - patch:
            resource:
              apiVersion: kubevirt.io/v1
              kind: VirtualMachine
              metadata:
                name: vm-valid
              spec:
                preference:
                  name: ""
            expect:
              - check:
                  ($error != null): true
