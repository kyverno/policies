apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bad-vm
spec:
  runStrategy: Halted
  dataVolumeTemplates:
  - metadata:
      name: bad-vm-root
    spec:
      source:
        http:
          url: https://images.example.com/fedora.qcow2
      storage:
        resources:
          requests:
            storage: 1Gi
  - metadata:
      name: bad-vm-data
      annotations:
        cdi.kubevirt.io/storage.import.insecureSkipVerify: "true"
    spec:
      source:
        http:
          url: http://images.example.com/data.raw
      storage:
        resources:
          requests:
            storage: 1Gi
  template:
    spec:
      domain:
        devices:
          disks:
          - name: root
            disk:
              bus: virtio
          - name: data
            disk:
              bus: virtio
        resources:
          requests:
            memory: 1Gi
      volumes:
      - name: root
        dataVolume:
          name: bad-vm-root
      - name: data
        dataVolume:
          name: bad-vm-data
