apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: good-pvc
  annotations:
    cdi.kubevirt.io/storage.import.endpoint: https://images.example.com/fedora.qcow2
    cdi.kubevirt.io/storage.import.source: http
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
