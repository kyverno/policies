# Lets the test act as the CDI and KubeVirt controllers, and as a service
# account with the same name in another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: import-sources-writer
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes, volumeimportsources]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: import-sources-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: import-sources-writer
subjects:
  - kind: ServiceAccount
    name: cdi-sa
    namespace: cdi
  - kind: ServiceAccount
    name: kubevirt-controller
    namespace: kubevirt
  - kind: ServiceAccount
    name: cdi-sa
    namespace: tenant
