apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-secure-datavolume-source
  annotations:
    policies.kyverno.io/title: Require Secure DataVolume Source in CEL expressions
    policies.kyverno.io/category: KubeVirt in CEL
    policies.kyverno.io/severity: high
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/subject: DataVolume, VirtualMachine, VolumeImportSource, PersistentVolumeClaim
    policies.kyverno.io/description: >-
      KubeVirt's Containerized Data Importer (CDI) downloads virtual machine
      disk images from HTTP sources. It accepts plain http:// URLs, and since
      CDI v1.66.0 an HTTP source can set insecureSkipVerify to turn off TLS
      certificate verification, without any approval from the cluster
      administrator. In both cases, an attacker on the network path can
      replace the disk image, and the virtual machine boots the attacker's
      code. This policy requires every HTTP import source in DataVolumes,
      VirtualMachine dataVolumeTemplates, VolumeImportSources, and import
      PersistentVolumeClaims to use an https:// URL with certificate
      verification turned on.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [cdi.kubevirt.io]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [datavolumes, volumeimportsources]
      - apiGroups: [kubevirt.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [virtualmachines]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [persistentvolumeclaims]
  matchConditions:
    # CDI imports into a PVC only when it has an endpoint or source annotation.
    - name: import-pvcs-only
      expression: >-
        object.kind != 'PersistentVolumeClaim' ||
        cel.bind(a, object.?metadata.?annotations.orValue({}),
          type(a) == map &&
          ('cdi.kubevirt.io/storage.import.endpoint' in a ||
           'cdi.kubevirt.io/storage.import.source' in a))
    # CDI's controller copies PVCs and VolumeImportSources from objects that
    # this policy already checked. Edit the namespace if CDI runs elsewhere.
    - name: skip-cdi-controller
      expression: >-
        !(object.kind in ['PersistentVolumeClaim', 'VolumeImportSource'] &&
          request.?userInfo.?username.orValue('') in [
            'system:serviceaccount:cdi:cdi-sa'])
    # KubeVirt's controller creates DataVolumes from VirtualMachine templates
    # that this policy already checked. Edit the namespace if KubeVirt runs
    # elsewhere.
    - name: skip-kubevirt-controller
      expression: >-
        !(object.kind == 'DataVolume' &&
          request.?userInfo.?username.orValue('') in [
            'system:serviceaccount:kubevirt:kubevirt-controller'])
    # Background scans have no user. Report only the objects that people
    # create, not the copies that a controller owns.
    - name: skip-owned-copies-in-background
      expression: >-
        request.?userInfo.?username.orValue('') != '' ||
        !(object.kind in ['DataVolume', 'PersistentVolumeClaim', 'VolumeImportSource']) ||
        cel.bind(refs, object.?metadata.?ownerReferences.orValue([]),
          type(refs) != list ||
          !refs.exists(r, type(r) == map && r[?'controller'].orValue(false) == true))
  variables:
    - name: kind
      expression: object.?kind.orValue('')
    # The object, then the old object on UPDATE.
    - name: objects
      expression: >-
        oldObject != null && type(oldObject) == map && size(oldObject) > 0 ?
          [object, oldObject] : [object]
    - name: annInsecure
      expression: "'cdi.kubevirt.io/storage.import.insecureSkipVerify'"
    # For each object, a list of [http source path, http source,
    # annotations path, annotations]. CDI copies DataVolume annotations to
    # the PVC it imports into, so they count too.
    - name: httpSources
      expression: >-
        variables.objects.map(o,
          variables.kind == 'VirtualMachine' ?
            cel.bind(ts, o.?spec.?dataVolumeTemplates.orValue([]),
              type(ts) != list ? [] : lists.range(size(ts))
                .filter(i, type(ts[i]) == map)
                .map(i, cel.bind(spec, ts[i][?'spec'].orValue(null),
                  cel.bind(src, type(spec) == map ? spec[?'source'].orValue(null) : null,
                    cel.bind(meta, ts[i][?'metadata'].orValue(null), [
                      dyn('spec.dataVolumeTemplates[' + string(i) + '].spec.source.http'),
                      type(src) == map ? src[?'http'].orValue(null) : null,
                      dyn('spec.dataVolumeTemplates[' + string(i) + '].metadata.annotations'),
                      type(meta) == map ? meta[?'annotations'].orValue(null) : null])))))
          : variables.kind in ['DataVolume', 'VolumeImportSource'] ?
            cel.bind(spec, o[?'spec'].orValue(null),
              cel.bind(src, type(spec) == map ? spec[?'source'].orValue(null) : null, [[
                dyn('spec.source.http'),
                type(src) == map ? src[?'http'].orValue(null) : null,
                dyn('metadata.annotations'),
                variables.kind == 'DataVolume' ? o.?metadata.?annotations.orValue(null) : null]]))
          : [])
    # For each object, a list of [path, value] pairs that fail.
    - name: httpFindings
      expression: >-
        variables.httpSources.map(list, list.filter(e, type(e[1]) == map).map(e,
          (type(e[1][?'url'].orValue(null)) == string &&
            !e[1].url.lowerAscii().startsWith('https://') ?
            [[dyn(string(e[0]) + '.url'), dyn(e[1].url)]] : []) +
          (e[1][?'insecureSkipVerify'].orValue(false) == true ?
            [[dyn(string(e[0]) + '.insecureSkipVerify'), dyn('true')]] : []) +
          (type(e[3]) == map && e[3][?(variables.annInsecure)].orValue('') == 'true' ?
            [[dyn(string(e[2]) + '[' + variables.annInsecure + ']'), dyn('true')]] : [])
        ).flatten())
    # CDI reads these annotations on any PVC. A missing or unknown source
    # means http.
    - name: pvcFindings
      expression: >-
        variables.objects.map(o, variables.kind != 'PersistentVolumeClaim' ? [] :
          cel.bind(a, o.?metadata.?annotations.orValue({}), type(a) != map ? [] :
            cel.bind(src, a[?'cdi.kubevirt.io/storage.import.source'].orValue(''),
              cel.bind(ep, a[?'cdi.kubevirt.io/storage.import.endpoint'].orValue(''),
                (!(src in ['s3', 'gcs', 'glance', 'none', 'registry', 'imageio', 'vddk']) &&
                  type(ep) == string && ep != '' && !ep.lowerAscii().startsWith('https://') ?
                  [[dyn('metadata.annotations[cdi.kubevirt.io/storage.import.endpoint]'), dyn(ep)]] : []) +
                (src == 'http' && a[?(variables.annInsecure)].orValue('') == 'true' ?
                  [[dyn('metadata.annotations[' + variables.annInsecure + ']'), dyn('true')]] : [])))))
    - name: findings
      expression: >-
        lists.range(size(variables.objects)).map(k,
          variables.httpFindings[k] + variables.pvcFindings[k])
    # An UPDATE fails only on findings that the old object didn't have, so
    # controllers can still update objects that existed before the policy.
    - name: newFindings
      expression: >-
        variables.findings[0].filter(f,
          size(variables.findings) < 2 || !(f in variables.findings[1]))
  validations:
    - expression: size(variables.newFindings) == 0
      messageExpression: >-
        'Disk image imports must use an https:// URL and must not skip TLS
        certificate verification. Fix: ' +
        variables.newFindings.map(f, string(f[0])).join(', ')
