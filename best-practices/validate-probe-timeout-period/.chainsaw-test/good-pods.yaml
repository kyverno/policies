apiVersion: v1
kind: Pod
metadata:
  name: good-pod-defaults
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      # Using defaults: timeoutSeconds=1, periodSeconds=10 (valid)
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-explicit
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      timeoutSeconds: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      timeoutSeconds: 3
      periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-startup
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      timeoutSeconds: 2
      periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod-all-probes
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      timeoutSeconds: 1
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      timeoutSeconds: 2
      periodSeconds: 10
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      timeoutSeconds: 5
      periodSeconds: 10
