apiVersion: v1
kind: Pod
metadata:
  name: inject-custom-endpoint-pod
  namespace: default
  annotations:
    otel.corp.org/otlp-endpoint: http://http-collector:4318
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
    env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://http-collector:4318
