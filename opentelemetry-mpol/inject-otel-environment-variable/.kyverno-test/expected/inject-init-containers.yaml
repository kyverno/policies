apiVersion: v1
kind: Pod
metadata:
  name: inject-init-containers
  namespace: default
spec:
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
    env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://opentelemetry-collector.opentelemetry-collector:4317
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
    env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://opentelemetry-collector.opentelemetry-collector:4317
