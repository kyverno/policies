apiVersion: v1
kind: Pod
metadata:
  name: no-inject-pod
  namespace: default
  annotations:
    otel.corp.org/inject-env-var: "false"
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: no-inject-ns
  namespace: ns-w-inject-false
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-ns
  namespace: ns-w-inject-true
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-pod-over-ns
  namespace: ns-w-inject-false
  annotations:
    otel.corp.org/inject-env-var: "true"
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-default
  namespace: default
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-custom-endpoint-pod
  namespace: default
  annotations:
    otel.corp.org/otlp-endpoint: http://http-collector:4318
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-custom-endpoint-ns
  namespace: ns-w-custom-endpoint
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-custom-endpoint-pod-over-ns
  namespace: ns-w-custom-endpoint
  annotations:
    otel.corp.org/otlp-endpoint: http://custom-endpoint:4318
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-before-preexisting-env
  namespace: default
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
    env:
    - name: TEST_ENV
      value: test
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-init-containers
  namespace: default
spec:
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: keep-declared-endpoint
  namespace: default
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
    env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://declared:4317
  - name: second
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: inject-empty-env
  namespace: default
spec:
  containers:
  - name: busybox
    image: ghcr.io/kyverno/test-busybox:1.35
    env: []
