apiVersion: batch/v1
kind: Job
metadata:
  name: otel-job
  namespace: otel-inject-default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: busybox:1.36
        command: ["true"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otel-cronjob
  namespace: otel-inject-default
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: main
            image: busybox:1.36
            command: ["true"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-deployment
  namespace: otel-inject-default
spec:
  replicas: 0
  selector:
    matchLabels:
      app: otel-deployment
  template:
    metadata:
      labels:
        app: otel-deployment
    spec:
      containers:
      - name: main
        image: busybox:1.36
        command: ["sleep", "3600"]
