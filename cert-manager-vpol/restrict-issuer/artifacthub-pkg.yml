name: cert-manager-restrict-issuer-vpol
version: 1.0.0
displayName: Restrict Certificate issuer for corporate domains
description: >-
  Requires Certificates for *.corp.com to use the designated corporate ClusterIssuer.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cert-manager-vpol/restrict-issuer/restrict-issuer.yaml
  ```
keywords:
  - kyverno
  - cert-manager
  - ValidatingPolicy
readme: |
  Certificates with a DNS name ending in `.corp.com` must use issuer `our-corp-issuer`, kind `ClusterIssuer`, and API group `cert-manager.io`. Other Certificates are not restricted by this policy.

  By default, violations are reported in Audit mode and are not blocked. Set `spec.validationActions` to `[Deny]` to enforce the policy.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `cert-manager-restrict-issuer` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact Certificate namespace and name.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed. See the tested example in
  [`.kyverno-test-exceptions`](https://github.com/kyverno/policies/blob/main/cert-manager-vpol/restrict-issuer/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the policy
  retains its normal validation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Cert-Manager in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.25+"
  kyverno/subject: "Certificate"
