apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exact-certificate
  namespace: policy-exceptions
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: cert-manager-limit-dnsnames
  matchConditions:
    - name: exact-certificate
      expression: "object.metadata.namespace == 'default' && object.metadata.name == 'dns-exception-target'"
