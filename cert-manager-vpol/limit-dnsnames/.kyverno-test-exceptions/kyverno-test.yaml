apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-limit-dnsnames-exceptions
policies:
  - ../limit-dnsnames.yaml
resources:
  - exception-resources.yaml
exceptions:
  - exceptions.yaml
results:
  - isValidatingPolicy: true
    policy: cert-manager-limit-dnsnames
    kind: Certificate
    resources: [exception-target]
    result: skip
  - isValidatingPolicy: true
    policy: cert-manager-limit-dnsnames
    kind: Certificate
    resources: [exception-sibling, exception-wrong-namespace]
    result: fail
