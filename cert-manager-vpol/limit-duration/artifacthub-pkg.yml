name: cert-manager-limit-duration-vpol
version: 1.0.0
displayName: Limit Certificate duration
description: >-
  Limits non-Let's Encrypt Certificate duration to 2400 hours.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cert-manager-vpol/limit-duration/limit-duration.yaml
  ```
keywords:
  - kyverno
  - cert-manager
  - ValidatingPolicy
readme: |
  This policy limits non-Let's Encrypt cert-manager Certificates to 2400 hours (100 days). Durations are parsed with CEL `duration()`, including Go duration strings such as `2160h`. If `spec.duration` is absent or null, cert-manager's 90-day default (`2160h`) is evaluated. Empty duration strings and issuer names containing `letsencrypt` retain the legacy policy's exemption.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `cert-manager-limit-duration` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact Certificate namespace and name.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed. See the tested example in
  [`.kyverno-test-exceptions`](https://github.com/kyverno/policies/blob/main/cert-manager-vpol/limit-duration/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the policy
  retains its normal validation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Cert-Manager in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.25+"
  kyverno/subject: "Certificate"
