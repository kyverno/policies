# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cert-manager-limit-duration
spec:
  template: false
  steps:
    - name: shared-exception-namespace
      skipDelete: true
      try:
        - apply:
            file: exception-namespace.yaml
    - name: custom-resource-permissions
      try:
        - apply:
            file: rbac.yaml
    - name: policy
      try:
        - apply:
            file: ../limit-duration.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: cert-manager-limit-duration
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: certificate-validation
      try:
        - apply:
            file: good-certificate.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy cert-manager-limit-duration failed') && contains($error, 'Certificate duration must not exceed 2400h (100 days).')): true
            file: bad-certificate.yaml
    - name: update-validation
      try:
        - apply:
            file: update-good-certificate.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy cert-manager-limit-duration failed') && contains($error, 'Certificate duration must not exceed 2400h (100 days).')): true
            file: update-bad-certificate.yaml
    - name: exact-exception
      try:
        - apply:
            file: exception.yaml
        - script:
            content: |
              set -eu
              for attempt in $(seq 1 30); do
                if kubectl create --dry-run=server -f exception-certificate.yaml -o name >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 1
              done
              echo 'cert-manager-limit-duration PolicyException did not become active' >&2
              exit 1
        - apply:
            file: exception-certificate.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy cert-manager-limit-duration failed') && contains($error, 'Certificate duration must not exceed 2400h (100 days).')): true
            file: exception-sibling-certificate.yaml
