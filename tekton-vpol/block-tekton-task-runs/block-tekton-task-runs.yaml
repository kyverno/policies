apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-tekton-task-runs
  annotations:
    policies.kyverno.io/title: Block Tekton TaskRuns
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: TaskRun
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      Restrict creation and update of TaskRun resources to the Tekton pipelines controller.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - taskruns
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:tekton-pipelines:tekton-pipelines-controller'"
      message: "Creating or updating a TaskRun is only allowed for the Tekton pipelines controller."
