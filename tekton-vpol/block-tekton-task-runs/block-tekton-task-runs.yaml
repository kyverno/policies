apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-tekton-task-runs
  annotations:
    policies.kyverno.io/title: Block Tekton TaskRuns
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: TaskRun
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      Standalone TaskRuns are not allowed; Tasks must be executed through a PipelineRun.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
        resources:
          - taskruns
  matchConditions:
    - name: check-not-managed
      expression: "!has(object.metadata.ownerReferences) || !object.metadata.ownerReferences.exists(o, o.kind == 'PipelineRun')"
  validations:
    - expression: "false"
      message: "Standalone TaskRuns are forbidden. Execute Tasks through a PipelineRun."
