apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-tekton-task-runs
  annotations:
    policies.kyverno.io/title: Block Tekton TaskRun
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: TaskRun
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/minversion: 1.14.0
    kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      Restrict creation of TaskRun resources to the Tekton pipelines controller.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - taskruns
  matchConditions:
    - name: exclude-tekton-controller
      expression: >-
        request.?userInfo.?username.orValue('') != 'system:serviceaccount:tekton-pipelines:tekton-pipelines-controller'
  validations:
    - expression: "false"
      message: "Creating a TaskRun is not allowed."
