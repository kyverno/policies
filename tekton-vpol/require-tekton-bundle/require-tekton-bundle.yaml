apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-tekton-bundle
  annotations:
    policies.kyverno.io/title: Require Tekton Bundle
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: TaskRun, PipelineRun
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      PipelineRun and TaskRun resources must be executed from a bundle.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pipelineruns
          - taskruns
  validations:
    - expression: >-
        object.kind == "PipelineRun" ?
          (object.spec.?pipelineRef.?bundle.orValue('') != '' ||
           (object.spec.?pipelineRef.?resolver.orValue('') in ['bundles', 'bundle'] &&
            object.spec.?pipelineRef.?params.orValue([]).exists(p, p.name == 'bundle' && p.value != ''))) :
        object.kind == "TaskRun" ?
          (object.spec.?taskRef.?bundle.orValue('') != '' ||
           (object.spec.?taskRef.?resolver.orValue('') in ['bundles', 'bundle'] &&
            object.spec.?taskRef.?params.orValue([]).exists(p, p.name == 'bundle' && p.value != ''))) :
        false
      message: "A bundle is required."
