apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-tekton-namespace-pipelinerun
  annotations:
    policies.kyverno.io/title: Require Tekton Namespace PipelineRun
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: PipelineRun
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      PipelineRuns must run in an authorized namespace.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
        resources:
          - pipelineruns
  validations:
    - expression: "object.metadata.?namespace.orValue('') != 'default'"
      message: "PipelineRuns must not be run in the default namespace."
