apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-tekton-securitycontext
policies:
  - ../require-tekton-securitycontext.yaml
resources:
  - ../.chainsaw-test/good-taskrun.yaml
  - ../.chainsaw-test/bad-taskrun.yaml
results:
  - policy: require-tekton-securitycontext
    kind: TaskRun
    resources:
      - good-step-secure
      - good-digest-exempt
      - good-no-taskspec
    result: pass
  - policy: require-tekton-securitycontext
    kind: TaskRun
    resources:
      - bad-step-privileged
      - bad-step-no-sec-context
    result: fail
