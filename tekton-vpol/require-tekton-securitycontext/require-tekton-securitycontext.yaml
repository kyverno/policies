apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-tekton-securitycontext
  annotations:
    policies.kyverno.io/title: Require Tekton Security Context
    policies.kyverno.io/category: Tekton
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: TaskRun
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26"
    policies.kyverno.io/description: >-
      Containers in a TaskRun must set a securityContext.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - tekton.dev
        apiVersions:
          - v1beta1
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - taskruns/status
  validations:
    - expression: >-
        object.?status.?taskSpec.?steps.orValue([]).all(step,
          step.?securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
          step.?securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
          step.?securityContext.?runAsNonRoot.orValue(false) == true
        )
      message: "TaskRun containers must configure a secure securityContext (runAsNonRoot=true, readOnlyRootFilesystem=true, allowPrivilegeEscalation=false)."
