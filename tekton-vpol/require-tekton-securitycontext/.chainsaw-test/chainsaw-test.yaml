# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-tekton-securitycontext
spec:
  template: false
  steps:
    - name: step-01
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: step-02
      try:
        - apply:
            file: ../require-tekton-securitycontext.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: require-tekton-securitycontext
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-03
      try:
        - apply:
            file: good-taskrun.yaml
        - script:
            content: |
              set -eu
              kubectl patch taskrun good-taskrun --subresource=status --type=merge --patch-file=good-taskrun.yaml
        - apply:
            file: bad-taskrun.yaml
        - script:
            content: |
              set -eu
              set +e
              output=$(kubectl patch taskrun bad-taskrun --subresource=status --type=merge --patch-file=bad-taskrun.yaml 2>&1)
              code=$?
              set -e
              test "$code" -ne 0
