# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-run-as-nonroot
spec:
  # disable templating because it can cause issues with CEL expressions
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - script:
        content: |
          set -eu
          for attempt in $(seq 1 120); do
            ready=true
            for verb in get list watch update; do
            if ! kubectl auth can-i "$verb" pods --subresource=ephemeralcontainers --as=system:serviceaccount:kyverno:kyverno-admission-controller | grep -qx yes; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
          done
          echo "admission controller lacks pods/ephemeralcontainers permissions" >&2
          exit 1
    - apply:
        file: ../require-run-as-nonroot.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: require-run-as-nonroot
          spec:
            validationActions: 
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep:
        duration: 10s
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-run-as-nonroot failed')): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-run-as-nonroot failed')): true
        file: podcontroller-bad.yaml
  - name: step-03-ephemeralcontainers
    try:
    - script:
        content: ../../../../.chainsaw/scripts/ephemeral-exception.sh require-run-as-nonroot 'Running as root is not allowed' '{"runAsNonRoot":false}' '{"runAsNonRoot":true,"runAsUser":1000}'
