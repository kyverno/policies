apiVersion: v1
kind: Pod
metadata:
  name: goodpod01
spec:
  nodeSelector:
    kyverno.io/chainsaw-never-schedule: "true"
  # The API server normalizes null lists; CLI regressions cover the raw null form.
  initContainers: null
  ephemeralContainers: null
  containers:
  - name: container01
    image: ghcr.io/kyverno/test-busybox:1.35
  securityContext:
    runAsNonRoot: true
---
