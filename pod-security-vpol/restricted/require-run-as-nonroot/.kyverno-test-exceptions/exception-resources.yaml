apiVersion: v1
kind: Pod
metadata: {name: exception-partial, namespace: default}
spec: {containers: [{name: app, image: exempt.example/app:1, securityContext: {runAsNonRoot: false}}]}
---
apiVersion: v1
kind: Pod
metadata: {name: exception-wrong, namespace: default}
spec: {containers: [{name: app, image: nginx:1.27, securityContext: {runAsNonRoot: false}}]}
---
apiVersion: v1
kind: Pod
metadata: {name: exception-sibling, namespace: default}
spec: {containers: [{name: exempt, image: exempt.example/app:1, securityContext: {runAsNonRoot: false}}, {name: app, image: nginx:1.27, securityContext: {runAsNonRoot: false}}]}
---
apiVersion: v1
kind: Pod
metadata: {name: exception-whole, namespace: default}
spec: {containers: [{name: app, image: nginx:1.27, securityContext: {runAsNonRoot: false}}]}
