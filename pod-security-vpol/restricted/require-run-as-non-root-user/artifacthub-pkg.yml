name: require-run-as-non-root-user-vpol
version: 1.0.0
displayName: Require Run As Non-Root User in ValidatingPolicy
description: >-
  Containers must be required to run as non-root users. This policy ensures `runAsUser` is either unset or set to a number greater than zero.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/restricted/require-run-as-non-root-user/require-run-as-non-root-user.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Restricted)
  - ValidatingPolicy
readme: |
  Containers must be required to run as non-root users. This policy ensures `runAsUser` is either unset or set to a number greater than zero.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-run-as-non-root-user` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use exact image references in `spec.images` to allow a root UID only for matching
  containers. The independent Pod-level `runAsUser` check remains enforced.
  `variables.podSpec` selects the Pod spec directly or from the workload template.
  `variables.allContainers` includes regular, init, and ephemeral containers. CEL reads
  images through `exceptions.allowedImages`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/restricted/require-run-as-non-root-user/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Restricted)"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
