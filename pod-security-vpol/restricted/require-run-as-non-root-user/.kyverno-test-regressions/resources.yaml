apiVersion: v1
kind: Pod
metadata:
  name: null-init-pass
spec:
  initContainers: null
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: null-ephemeral-pass
spec:
  ephemeralContainers: null
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 1000
---
apiVersion: v1
kind: Pod
metadata:
  name: null-init-root
spec:
  initContainers: null
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: null-ephemeral-root
spec:
  ephemeralContainers: null
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: default-os-root
spec:
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: linux-root
spec:
  os:
    name: linux
  containers:
  - name: app
    image: alpine:3.20
    securityContext:
      runAsUser: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: windows-root
spec:
  os:
    name: windows
  containers:
  - name: app
    image: mcr.microsoft.com/windows/servercore:ltsc2022
    securityContext:
      runAsUser: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-null-init-root
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      initContainers: null
      containers:
      - name: app
        image: alpine:3.20
        securityContext:
          runAsUser: 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-null-ephemeral-root
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          ephemeralContainers: null
          containers:
          - name: app
            image: alpine:3.20
            securityContext:
              runAsUser: 0
          restartPolicy: Never
