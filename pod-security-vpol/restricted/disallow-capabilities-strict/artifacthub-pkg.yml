name: disallow-capabilities-strict-vpol
version: 1.0.0
displayName: Disallow Capabilities (Strict) in ValidatingPolicy
description: >-
  Adding capabilities other than `NET_BIND_SERVICE` is disallowed. In addition, all containers must explicitly drop `ALL` capabilities.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/restricted/disallow-capabilities-strict/disallow-capabilities-strict.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Restricted)
  - ValidatingPolicy
readme: |
  Adding capabilities other than `NET_BIND_SERVICE` is disallowed. In addition, all containers must explicitly drop `ALL` capabilities.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-capabilities-strict` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use exact capability names in `spec.allowedValues` to permit only those added
  capabilities; the requirement to drop `ALL` remains enforced. Exact `spec.images`
  entries exempt only added-capability checks for matching containers. `variables.podSpec`
  selects the Pod spec directly or from the workload template. `variables.allContainers`
  includes regular, init, and ephemeral containers. CEL reads images through
  `exceptions.allowedImages` and tokens through `exceptions.allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/restricted/disallow-capabilities-strict/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Restricted)"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
