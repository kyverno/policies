name: disallow-privilege-escalation-vpol
version: 1.0.0
displayName: Disallow Privilege Escalation in ValidatingPolicy
description: >-
  Privilege escalation, such as via set-user-ID or set-group-ID file mode, should not be allowed. This policy ensures the `allowPrivilegeEscalation` field is set to `false`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/restricted/disallow-privilege-escalation/disallow-privilege-escalation.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Restricted)
  - ValidatingPolicy
readme: |
  Privilege escalation, such as via set-user-ID or set-group-ID file mode, should not be allowed. This policy ensures the `allowPrivilegeEscalation` field is set to `false`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-privilege-escalation` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use exact image references in `spec.images` to waive the explicit
  `allowPrivilegeEscalation: false` requirement only for matching containers.
  `variables.podSpec` selects the Pod spec directly or from the workload template.
  `variables.allContainers` includes regular, init, and ephemeral containers. CEL reads
  images through `exceptions.allowedImages`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/restricted/disallow-privilege-escalation/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Restricted)"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
