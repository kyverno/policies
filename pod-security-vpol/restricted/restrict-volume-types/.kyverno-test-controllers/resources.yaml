apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-restrict-volume-types-1
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      volumes:
      - name: data
        hostPath:
          path: /var/lib
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
