name: restrict-seccomp-strict-vpol
version: 1.0.0
displayName: Restrict Seccomp (Strict) in ValidatingPolicy
description: >-
  The Restricted profile requires a seccomp profile of `RuntimeDefault` or `Localhost`. The Pod-level seccomp profile must be unset or set to one of these values. Each container must set one of these values or inherit a valid Pod-level profile, so a Pod with no valid profile at either level is denied. Windows Pods are exempt.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/restricted/restrict-seccomp-strict/restrict-seccomp-strict.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Restricted)
  - ValidatingPolicy
readme: |
  The Restricted profile requires a seccomp profile of `RuntimeDefault` or `Localhost`. The Pod-level seccomp profile must be unset or set to one of these values. Each container must set one of these values or inherit a valid Pod-level profile, so a Pod with no valid profile at either level is denied. Windows Pods are exempt.
  
  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Restricted)"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
