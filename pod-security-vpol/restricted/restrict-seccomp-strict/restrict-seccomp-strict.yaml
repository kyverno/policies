apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-seccomp-strict
  annotations:
    policies.kyverno.io/title: Restrict Seccomp (Strict) in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Restricted) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      The Restricted profile requires a seccomp profile of `RuntimeDefault` or `Localhost`.
      The Pod-level seccomp profile must be unset or set to one of these values. Each container
      must set one of these values or inherit a valid Pod-level profile, so a Pod with no valid
      profile at either level is denied. Windows Pods are exempt.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: isWindowsPod
      expression: "variables.podSpec.?os.?name.orValue('') == 'windows'"
  validations:
    - expression: >-
        variables.isWindowsPod ||
        !variables.podSpec.?securityContext.?seccompProfile.?type.hasValue() ||
        variables.podSpec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'] ||
        ('seccomp.type:' + variables.podSpec.securityContext.seccompProfile.type) in exceptions.allowedValues
      message: >-
        Use of custom Seccomp profiles is disallowed. The field
        spec.securityContext.seccompProfile.type must be unset or set to `RuntimeDefault` or `Localhost`.
        Windows Pods are exempt.
    - expression: >-
        variables.isWindowsPod ||
        variables.allContainers.all(container,
          container.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] ||
          (container.?securityContext.?seccompProfile.?type.hasValue() &&
           (container.image in exceptions.allowedImages ||
            ('seccomp.type:' + container.securityContext.seccompProfile.type) in exceptions.allowedValues)) ||
          (!container.?securityContext.?seccompProfile.?type.hasValue() &&
           (variables.podSpec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] ||
            ('seccomp.type:' + variables.podSpec.?securityContext.?seccompProfile.?type.orValue('')) in exceptions.allowedValues)))
      message: >-
        Use of custom Seccomp profiles is disallowed. The fields
        spec.containers[*].securityContext.seccompProfile.type,
        spec.initContainers[*].securityContext.seccompProfile.type, and
        spec.ephemeralContainers[*].securityContext.seccompProfile.type must be set to
        `RuntimeDefault` or `Localhost`, or inherited from spec.securityContext.seccompProfile.type.
        Windows Pods are exempt.
