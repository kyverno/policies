apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: disallow-host-path-exceptions}
policies: [../disallow-host-path.yaml]
resources: [exception-resources.yaml]
exceptions: [exceptions.yaml]
results:
- {isValidatingPolicy: true, kind: Pod, policy: disallow-host-path, resources: [exception-partial], result: pass}
- {isValidatingPolicy: true, kind: Pod, policy: disallow-host-path, resources: [exception-wrong, exception-sibling], result: fail}
- {isValidatingPolicy: true, kind: Pod, policy: disallow-host-path, resources: [exception-whole], result: skip}
