apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-probes
  annotations:
    policies.kyverno.io/title: Disallow Host Probes in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30+"
    policies.kyverno.io/description: >-
      Probes and lifecycle handlers that set a `host` let a Pod direct the kubelet to make requests
      to arbitrary addresses, including link-local metadata endpoints. This policy ensures the
      `httpGet.host` and `tcpSocket.host` fields of every probe and lifecycle handler are unset or
      empty. It implements the `hostProbesAndHostLifecycle` check that Kubernetes added to the
      Baseline profile in v1.34.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.?livenessProbe.?httpGet.?host.orValue('') == '' &&
          container.?livenessProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?readinessProbe.?httpGet.?host.orValue('') == '' &&
          container.?readinessProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?startupProbe.?httpGet.?host.orValue('') == '' &&
          container.?startupProbe.?tcpSocket.?host.orValue('') == '' &&
          container.?lifecycle.?postStart.?httpGet.?host.orValue('') == '' &&
          container.?lifecycle.?postStart.?tcpSocket.?host.orValue('') == '' &&
          container.?lifecycle.?preStop.?httpGet.?host.orValue('') == '' &&
          container.?lifecycle.?preStop.?tcpSocket.?host.orValue('') == '')
      message: >-
        Probes and lifecycle handlers must not set a host. The fields httpGet.host and
        tcpSocket.host of livenessProbe, readinessProbe, startupProbe, lifecycle.postStart, and
        lifecycle.preStop must be unset or empty in spec.containers[*], spec.initContainers[*], and
        spec.ephemeralContainers[*].
