spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: container01
            image: dummyimagename
            livenessProbe:
              httpGet:
                path: /healthz
                port: 8080
                host: ""
            readinessProbe:
              tcpSocket:
                port: 8080
                host: ""
            startupProbe:
              httpGet:
                path: /healthz
                port: 8080
                host: ""
            lifecycle:
              postStart:
                tcpSocket:
                  port: 8080
                  host: ""
              preStop:
                httpGet:
