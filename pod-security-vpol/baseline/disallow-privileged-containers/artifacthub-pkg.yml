name: disallow-privileged-containers-vpol
version: 1.0.0
displayName: Disallow Privileged Containers in ValidatingPolicy
description: >-
  Privileged mode disables most security mechanisms and must not be allowed. This policy ensures Pods do not call for privileged mode.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-privileged-containers/disallow-privileged-containers.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  Privileged mode disables most security mechanisms and must not be allowed. This policy ensures Pods do not call for privileged mode.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-privileged-containers` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use exact image references in `spec.images` to permit privileged mode only for matching
  containers. `variables.podSpec` selects the Pod spec directly or from the workload
  template. `variables.allContainers` includes regular, init, and ephemeral containers.
  CEL reads images through `exceptions.allowedImages`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/baseline/disallow-privileged-containers/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
