name: restrict-seccomp-vpol
version: 1.0.0
displayName: Restrict Seccomp in ValidatingPolicy
description: >-
  The seccomp profile must not be explicitly set to Unconfined. This policy, requiring Kubernetes v1.30 or later, ensures that seccomp is unset or  set to `RuntimeDefault` or `Localhost`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/restrict-seccomp/restrict-seccomp.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  The seccomp profile must not be explicitly set to Unconfined. This policy, requiring Kubernetes v1.30 or later, ensures that seccomp is unset or  set to `RuntimeDefault` or `Localhost`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-seccomp` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `seccomp.type:<value>` in `spec.allowedValues`, such as `seccomp.type:Unconfined`,
  for an exact container profile type, or `spec.images` for matching containers.
  `variables.hasValidSeccompProfile` still enforces the Pod-level profile using
  `allowedProfileTypes`; neither exception waives it. `variables.podSpec` selects the Pod
  spec directly or from the workload template. `variables.allContainers` includes regular,
  init, and ephemeral containers. CEL reads images through `exceptions.allowedImages` and
  tokens through `exceptions.allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/baseline/restrict-seccomp/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
