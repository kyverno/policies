name: disallow-capabilities-vpol
version: 1.0.0
displayName: Disallow Capabilities in ValidatingPolicy
description: >-
  Adding capabilities beyond those listed in the policy must be disallowed.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-capabilities/disallow-capabilities.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  Adding capabilities beyond those listed in the policy must be disallowed.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-capabilities` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use exact capability names such as `SYS_ADMIN` in `spec.allowedValues` to allow only
  those added capabilities. Exact `spec.images` entries exempt only matching containers.
  `variables.podSpec` selects the Pod spec directly or from the workload template.
  `variables.allContainers` includes regular, init, and ephemeral containers. CEL reads
  images through `exceptions.allowedImages` and tokens through `exceptions.allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/baseline/disallow-capabilities/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
