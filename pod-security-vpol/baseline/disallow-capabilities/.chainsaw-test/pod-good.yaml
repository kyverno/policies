apiVersion: v1
kind: Pod
metadata:
  name: goodpod01-new
spec:
  nodeSelector:
    kyverno.io/chainsaw-never-schedule: "true"
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
    securityContext:
      capabilities:
        add:
          - AUDIT_WRITE
          - CHOWN
          - MKNOD
  containers:
  - name: add-capabilities
    image: ghcr.io/kyverno/test-busybox:1.35
    securityContext:
      capabilities:
        add: ["SYS_CHROOT", "SETUID", "KILL", "SETGID"]
  - name: add-capabilities-again
    image: ghcr.io/kyverno/test-busybox:1.35
    securityContext:
      capabilities:
        add: ["NET_BIND_SERVICE", "SETPCAP", "SETFCAP", "FOWNER"]
        drop:
        - "ALL"
---
