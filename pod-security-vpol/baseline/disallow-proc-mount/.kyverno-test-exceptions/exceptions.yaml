apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: partial, namespace: policy-exceptions}
spec:
  policyRefs: [{name: disallow-proc-mount, kind: ValidatingPolicy}]
  allowedValues: ['procMount:Unmasked']
  matchConditions: [{name: target, expression: "object.metadata.namespace == 'default' && object.metadata.name in ['exception-partial', 'exception-wrong', 'exception-sibling']"}]
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: whole, namespace: policy-exceptions}
spec:
  policyRefs: [{name: disallow-proc-mount, kind: ValidatingPolicy}]
  matchConditions: [{name: target, expression: "object.metadata.namespace == 'default' && object.metadata.name == 'exception-whole'"}]
