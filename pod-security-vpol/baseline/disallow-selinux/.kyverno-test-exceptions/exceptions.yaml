apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: partial, namespace: policy-exceptions}
spec:
  policyRefs: [{name: disallow-selinux, kind: ValidatingPolicy}]
  allowedValues: ['type:spc', 'user:approved', 'role:approved']
  matchConditions: [{name: target, expression: "object.metadata.namespace == 'default' && object.metadata.name in ['exception-partial', 'exception-wrong', 'exception-sibling', 'exception-user-badrole', 'exception-baduser-role', 'exception-both']"}]
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata: {name: whole, namespace: policy-exceptions}
spec:
  policyRefs: [{name: disallow-selinux, kind: ValidatingPolicy}]
  matchConditions: [{name: target, expression: "object.metadata.namespace == 'default' && object.metadata.name == 'exception-whole'"}]
