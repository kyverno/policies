apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-disallow-host-process-1
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
        securityContext:
          windowsOptions:
            hostProcess: true
