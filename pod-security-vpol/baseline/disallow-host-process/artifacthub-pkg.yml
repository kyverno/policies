name: disallow-host-process-vpol
version: 1.0.0
displayName: Disallow hostProcess in ValidatingPolicy
description: >-
  Windows Pods can run HostProcess containers, which have privileged access to the Windows node. The Baseline profile disallows this. This policy ensures that the `hostProcess` field is unset or `false` at both the Pod and the container level.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-host-process/disallow-host-process.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  Windows Pods can run HostProcess containers, which have privileged access to the Windows node. The Baseline profile disallows this. This policy ensures that the `hostProcess` field is unset or `false` at both the Pod and the container level.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-host-process` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `control:podHostProcess` in `spec.allowedValues` to waive only the Pod-level value
  read by `variables.podHostProcess`. Container hostProcess settings still require exact
  image references in `spec.images`; an image allowance does not waive the Pod-level
  control. `variables.podSpec` selects the Pod spec directly or from the workload
  template. `variables.allContainers` includes regular, init, and ephemeral containers.
  CEL reads images through `exceptions.allowedImages` and tokens through
  `exceptions.allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/baseline/disallow-host-process/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
