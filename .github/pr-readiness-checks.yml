dco:
  message: '"fix the DCO"'
  test: |
    [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
      | select((.name // .context) == "DCO") | (.conclusion // .state)]
    | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "CANCELLED" or . == "STALE" or . == "STARTUP_FAILURE")

ci:
  message: |
    "fix the failing check(s): " + (
      [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
        | select((.name // .context) != "DCO")
        | select((.conclusion // .state) as $c | ["FAILURE","ERROR","TIMED_OUT","ACTION_REQUIRED","CANCELLED","STALE","STARTUP_FAILURE"] | any(. == $c))
        | (.name // .context)]
      | unique | join(", ")
    )
  test: |
    [.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
      | select((.name // .context) != "DCO") | (.conclusion // .state)]
    | any(. == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "ACTION_REQUIRED" or . == "CANCELLED" or . == "STALE" or . == "STARTUP_FAILURE")

conflicts:
  message: '"fix the merge conflicts"'
  test: |
    [.labels.nodes[].name] | any(. == "merge-conflicts")

threads:
  message: '"resolve review threads, or reply if you need help"'
  test: |
    [.reviewThreads.nodes[]
      | select(.isResolved | not)
      | select(.comments.nodes[0].author.login != $author)]
    | length > 0

# A maintainer's latest comment or review that the author has not answered, by replying or by pushing a newer commit.
# `threads` covers inline review threads; this covers review bodies and plain PR comments. Maintainers are
# GitHub's OWNER, MEMBER and COLLABORATOR associations; bots, approvals and review submissions with no body
# (their comments are inline threads) are ignored.
unanswered:
  message: '"reply to the latest maintainer comment or review, or push a fix"'
  test: |
    def human: (.author.__typename // "") != "Bot" and ((.author.login // "") | endswith("[bot]") | not);
    ([.comments.nodes[]? | select(human)
        | {who: .author.login, at: .createdAt, assoc: .authorAssociation, counts: true}]
     + [.reviews.nodes[]? | select(human) | select(.state != "PENDING")
        | {who: .author.login, at: .submittedAt, assoc: .authorAssociation,
           counts: (.state == "CHANGES_REQUESTED" or (.state == "COMMENTED" and ((.bodyText // "") != "")))}]) as $events
    | ([$events[] | select(.who == $author) | .at] | max // "") as $answered
    | (.commits.nodes[0].commit.committedDate // "") as $pushed
    | ([$events[] | select(.counts and .who != $author
          and (.assoc == "OWNER" or .assoc == "MEMBER" or .assoc == "COLLABORATOR")) | .at] | max // "") as $latest
    | $latest != "" and $latest > $answered and $latest > $pushed
