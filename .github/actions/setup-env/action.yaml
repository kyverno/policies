name: "Setup Environment for E2E Tests"
description: "Sets up the environment for the E2E workflows"
inputs:
  k8s-version:
    description: "Kubernetes version"
    required: true
  kyverno-version:
    description: "Kyverno version to install. Leave empty for the latest kyverno/kyverno release-1.19 branch build, use `release` for the latest v1.19.x release, or set an explicit release tag (e.g. v1.19.1)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version: ~1.26.1
    - name: Install Tools
      shell: bash
      run: |
        set -e
        curl -LO "https://dl.k8s.io/release/${{ inputs.k8s-version }}/bin/linux/amd64/kubectl"
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    - name: Install kind
      shell: bash
      run: |
        set -e
        # For AMD64 / x86_64
        [ $(uname -m) = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        # For ARM64
        [ $(uname -m) = aarch64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-arm64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
    - name: Install latest Kyverno CLI
      uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
    - name: Install ORAS
      uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
    - name: Create kind cluster
      shell: bash
      run: |
        set -e
        kind create cluster --image kindest/node:${{ inputs.k8s-version }} --config ./.github/kind.yml
    - name: Install kyverno
      shell: bash
      run: |
        set -e
        # This branch targets Kyverno 1.19. Installing main's `install-latest-testing.yaml`
        # would pull `:latest` images built from main, which reject legacy kyverno.io/v1
        # ClusterPolicy resources that are still supported on 1.19.
        VERSION="${{ inputs.kyverno-version }}"
        if [ -z "$VERSION" ]; then
          # Default: the latest build of kyverno/kyverno's release-1.19 branch, so merged
          # backports are tested without waiting for a patch release. The floating
          # `release-1.19` image tag records its source commit in an OCI annotation; pin
          # the manifest and all images to that commit so they always match.
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:kyverno/kyverno:pull" | jq -r .token)
          SHA=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            https://ghcr.io/v2/kyverno/kyverno/manifests/release-1.19 \
            | jq -r '.annotations["org.opencontainers.image.source"] // ""' | awk -F/ '{print $NF}')
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Unable to resolve the kyverno/kyverno release-1.19 build commit" >&2
            exit 1
          fi
          echo "Installing Kyverno release-1.19 branch build ${SHA}"
          curl -fsSL "https://raw.githubusercontent.com/kyverno/kyverno/${SHA}/config/install-latest-testing.yaml" \
            | sed -E "s#image: \"?reg\.kyverno\.io/kyverno/([a-z-]+):latest\"?#image: \"ghcr.io/kyverno/\1:${SHA}\"#" \
            > /tmp/kyverno-install.yaml
          if grep -qE 'image: "?reg\.kyverno\.io/kyverno/[a-z-]+:latest' /tmp/kyverno-install.yaml; then
            echo "Failed to pin all Kyverno images to ${SHA}" >&2
            exit 1
          fi
          grep -E '^\s+image: ' /tmp/kyverno-install.yaml
          kubectl create -f /tmp/kyverno-install.yaml
          exit 0
        fi
        if [ "$VERSION" = "release" ]; then
          VERSION=$(git ls-remote --tags --refs https://github.com/kyverno/kyverno.git 'v1.19.*' \
            | awk -F/ '{print $NF}' | grep -vE -- '-rc' | sort -V | tail -1)
        fi
        if [ -z "$VERSION" ]; then
          echo "Unable to resolve a Kyverno v1.19.x release tag" >&2
          exit 1
        fi
        echo "Installing Kyverno ${VERSION}"
        kubectl create -f "https://github.com/kyverno/kyverno/releases/download/${VERSION}/install.yaml"
    - name: Wait for kyverno ready
      shell: bash
      run: |
        set -e
        kubectl wait --namespace kyverno --for=condition=ready pod --selector '!job-name' --timeout=120s
    - name: Install CRDs
      shell: bash
      run: |
        set -e
        kubectl apply -f ./.chainsaw/crds
