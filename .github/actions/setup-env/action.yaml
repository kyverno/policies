name: "Setup Environment for E2E Tests"
description: "Sets up the environment for the E2E workflows"
inputs:
  k8s-version:
    description: "Kubernetes version"
    required: true
  node-image:
    description: "Digest-pinned kind node image"
    required: true
  kind-version:
    description: "kind version compatible with the node image"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version: ~1.26.1
    - name: Install latest Kyverno CLI
      id: install-kyverno-cli
      uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
      continue-on-error: true
    - name: Wait before retrying Kyverno CLI
      if: steps.install-kyverno-cli.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Retry Kyverno CLI installation
      id: retry-kyverno-cli
      if: steps.install-kyverno-cli.outcome == 'failure'
      uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
      continue-on-error: true
    - name: Wait before final Kyverno CLI retry
      if: steps.retry-kyverno-cli.outcome == 'failure'
      shell: bash
      run: sleep 10
    - name: Retry Kyverno CLI installation again
      if: steps.retry-kyverno-cli.outcome == 'failure'
      uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
    - name: Install ORAS
      uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0
    - name: Install kind and kubectl
      id: install-kind-tools
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      continue-on-error: true
      with:
        version: ${{ inputs.kind-version }}
        kubectl_version: ${{ inputs.k8s-version }}
        cluster_name: kind
        install_only: true
        ignore_failed_clean: true
    - name: Wait before retrying kind and kubectl
      if: steps.install-kind-tools.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Retry kind and kubectl installation
      id: retry-kind-tools
      if: steps.install-kind-tools.outcome == 'failure'
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      continue-on-error: true
      with:
        version: ${{ inputs.kind-version }}
        kubectl_version: ${{ inputs.k8s-version }}
        cluster_name: kind
        install_only: true
        ignore_failed_clean: true
    - name: Wait before final kind and kubectl retry
      if: steps.retry-kind-tools.outcome == 'failure'
      shell: bash
      run: sleep 10
    - name: Retry kind and kubectl installation again
      if: steps.retry-kind-tools.outcome == 'failure'
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: ${{ inputs.kind-version }}
        kubectl_version: ${{ inputs.k8s-version }}
        cluster_name: kind
        install_only: true
        ignore_failed_clean: true
    - name: Create kind cluster
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      with:
        version: ${{ inputs.kind-version }}
        kubectl_version: ${{ inputs.k8s-version }}
        node_image: ${{ inputs.node-image }}
        cluster_name: kind
        config: ./.github/kind.yml
    - name: Install latest kyverno
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/kyverno/kyverno/main/config/install-latest-testing.yaml -o install-latest-testing.yaml
        kubectl create --dry-run=client -f install-latest-testing.yaml -o json | jq -s -e '
          def expected:
            {"kyverno-admission-controller": "kyverno",
             "kyverno-background-controller": "controller",
             "kyverno-reports-controller": "controller"};
          {apiVersion: "v1", kind: "List", items: .} |
          if ([.items[] | select(.apiVersion == "apps/v1" and .kind == "Deployment" and .metadata.namespace == "kyverno" and expected[.metadata.name] != null) | .metadata.name] | sort) != (expected | keys)
          then error("expected exactly three supported Kyverno deployments")
          else
            .items |= map(
              if .apiVersion == "apps/v1" and .kind == "Deployment" and .metadata.namespace == "kyverno" and expected[.metadata.name] != null then
                expected[.metadata.name] as $container |
                if ([.spec.template.spec.containers[] | select(.name == $container)] | length) != 1
                then error("expected exactly one controller container in " + .metadata.name)
                else
                  .spec.template.spec.containers |= map(
                    if .name == $container then
                      .args = ((.args // [] | map(select((startswith("--enablePolicyException=") or startswith("--exceptionNamespace=")) | not))) +
                               ["--enablePolicyException=true", "--exceptionNamespace=policy-exceptions"])
                    else . end)
                end
              else . end)
          end' > install-with-policy-exceptions.json
        kubectl create namespace policy-exceptions --dry-run=client -o yaml | kubectl apply -f -
        kubectl create -f install-with-policy-exceptions.json
    - name: Wait for kyverno ready
      shell: bash
      run: |
        set -e
        if ! kubectl wait --namespace kyverno --for=condition=Available deployment --all --timeout=300s; then
          kubectl get pods --namespace kyverno -o wide
          kubectl describe pods --namespace kyverno
          kubectl get events --namespace kyverno --sort-by=.lastTimestamp
          exit 1
        fi
    - name: Install CRDs
      shell: bash
      run: |
        set -e
        kubectl apply -f ./.chainsaw/crds
