    - other-gpol
    - other-ivpol
    - pod-security-vpol
    - psa-mpol
    - psp-migration-mpol
    - velero-mpol
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
    - run: ${{ true }}

  e2e-required-failure:
    name: e2e-required
    needs:
    - argo-vpol
    - karpenter-mpol
    - best-practices-mpol
    - best-practices-gpol
    - best-practices-vpol
