# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: E2E Tests

permissions: {}

on:
  pull_request:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes-matrix:
    uses: kyverno/kyverno/.github/workflows/kubernetes-matrix.yaml@4a55ff8341dbdb7acef70b5b8c25d75e51848cfc # shared Kubernetes matrix

  argo-gpol:
    needs: kubernetes-matrix
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          k8s-version: ${{ matrix.k8s-version }}
          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          path: argo-gpol

  argo-vpol:
    needs: kubernetes-matrix
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(needs.kubernetes-matrix.outputs.versions) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          k8s-version: ${{ matrix.k8s-version }}
          node-image: ${{ fromJSON(needs.kubernetes-matrix.outputs.images)[matrix.k8s-version] }}
          kind-version: ${{ needs.kubernetes-matrix.outputs.kind-version }}
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          path: argo-vpol

  cert-manager-vpol:
