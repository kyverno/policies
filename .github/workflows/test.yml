    - kubevirt-gpol
    - linkerd-mpol
    - other
    - other-vpol
    - other-mpol
    - other-gpol
    - other-ivpol
    - pod-security-vpol
    - psa-mpol
    - psp-migration-mpol
    - velero-mpol
    runs-on: ubuntu-latest
    if: ${{ failure() || cancelled() }}
    steps:
    - run: ${{ false }}
