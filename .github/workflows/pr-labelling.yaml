name: PR Labeler

on:
  push:
    branches: [main]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@f40dcce41ac458528dc8f54fd7c6f6a63c08d9f5
    with:
      mode: labels
      dry-run: 'false'
