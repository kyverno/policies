name: PR Labeler

on:
  push:
    branches: [main]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@56c90f346db39244b2e46022e862c88064195a91
    with:
      mode: labels
      dry-run: 'false'
