name: PR Labeler

on:
  push:
    branches: [main]
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@e2d2f01371144e88e99fdf124e885bf4879c705e
    with:
      mode: labels
      dry-run: 'false'
