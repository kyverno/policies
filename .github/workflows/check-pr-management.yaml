name: Check PR management configuration

on:
  pull_request:
    paths:
      - ".github/labels.yml"
      - ".github/pr-management.json"
      - ".github/pr-readiness-checks.yml"
      - ".github/workflows/pr-labelling.yaml"
      - ".github/workflows/pr-management.yaml"
      - ".github/workflows/check-pr-management.yaml"
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/pr-management.json"
      - ".github/pr-readiness-checks.yml"
      - ".github/workflows/pr-labelling.yaml"
      - ".github/workflows/pr-management.yaml"
      - ".github/workflows/check-pr-management.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout configuration under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate configuration without API access
        uses: kyverno/kyverno/.github/actions/pr-management@35ca49f83d872bd8c0328dc767a4824a13d8fe04
        with:
          mode: validate
