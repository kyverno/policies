name: PR lifecycle

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '19 * * * *'
    - cron: '29 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Lifecycle operation
        type: choice
        options: [readiness, stale]
        default: readiness
      dry_run:
        description: Only preview changes (leave enabled during rollout)
        type: boolean
        default: true

permissions: {}

jobs:
  readiness:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'schedule' && github.event.schedule == '19 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'readiness')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@56c90f346db39244b2e46022e862c88064195a91
    with:
      mode: readiness
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

  stale:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '29 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'stale')
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    uses: kyverno/assistant/.github/workflows/pr-management.yml@56c90f346db39244b2e46022e862c88064195a91
    with:
      mode: stale
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
