apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-external-secret-prefix
  annotations:
    policies.kyverno.io/title: Add prefix to external secret
    policies.kyverno.io/category: ExternalSecretOperator
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ExternalSecret
    kyverno.io/kyverno-version: 1.15.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/description: >- 
      This Policy mutates secretRef key to add a prefix.
      External Secret Operator proposes to use kyverno to force ExternalSecrets
      to have namespace prefix so that kubernetes administrators do not need to
      define permissions and users per namespace.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets"]
  matchConditions:
    - name: has-spec-data
      expression: "has(object.spec.data) && size(object.spec.data) > 0"
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          object.spec.data.map(d, object.spec.data.indexOf(d)).map(idx,
            JSONPatch{
              op: "replace",
              path: "/spec/data/" + string(idx) + "/remoteRef/key",
              value: "prefix-" + object.spec.data[idx].remoteRef.key
            }
          )
