apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-nginx-annotations-exceptions
policies:
  - ../restrict-nginx-annotations.yaml
resources:
  - resources.yaml
exceptions:
  - exception.yaml
results:
  - isValidatingPolicy: true
    kind: Ingress
    policy: restrict-nginx-annotations
    resources:
      - default/annotation-exception
    result: skip
  - isValidatingPolicy: true
    kind: Ingress
    policy: restrict-nginx-annotations
    resources:
      - default/annotation-exception-sibling
    result: fail
