name: restrict-nginx-annotations-vpol
version: 1.0.0
displayName: Restrict NGINX Ingress Annotations
description: >-
  Audit NGINX Ingress snippet annotations and annotation values containing
  alias or root directives, sensitive filesystem paths, or Lua directives.
  Violations are reported without blocking by default.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/nginx-ingress-vpol/restrict-nginx-annotations/restrict-nginx-annotations.yaml
  ```
keywords:
  - kyverno
  - Security
  - Ingress NGINX
  - ValidatingPolicy
readme: |
  Audit all `nginx.ingress.kubernetes.io/*-snippet` annotation keys and annotation values containing `alias` or `root` directives, references to `/etc/passwd`, `/etc/shadow`, `/etc/group`, `/etc/nginx`, `/etc/ingress-controller`, or `/var/run/secrets`, and Lua directives containing `_by_lua`. By default, violations are reported without blocking; set `validationActions` to `Deny` to enforce.

  Matching is case-sensitive, consistent with NGINX directive names and Linux filesystem paths.   Auditing every `*-snippet` annotation is intentionally stricter than the legacy samples, which only inspected annotation values; the current ingress-nginx documentation warns that enabling snippet annotations trusts Ingress authors with restricted NGINX configuration. The CVEs below are context, not a complete remediation: these checks do not address every annotation-injection issue or the controller admission exposure in CVE-2025-1974. Keep ingress-nginx updated and protect its admission webhook.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-nginx-annotations` in `spec.policyRefs`, and use `spec.matchConditions` to match
  the exact Ingress namespace and name. This is a whole-resource exception, so all
  annotation checks are skipped for that Ingress; its siblings remain evaluated and
  reported under the default Audit action. The Chainsaw test patches the action to
  Deny to verify enforcement.
  See the [tested example](https://github.com/kyverno/policies/blob/main/nginx-ingress-vpol/restrict-nginx-annotations/.kyverno-test-exceptions/exception.yaml).
  With PolicyException support disabled, or when no exception matches, Audit behavior
  applies and violations are reported without blocking.

  References:
  - [ingress-nginx annotations](https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md)
  - [CVE-2021-25742](https://www.cve.org/CVERecord?id=CVE-2021-25742)
  - [CVE-2023-5043](https://www.cve.org/CVERecord?id=CVE-2023-5043)
  - [CVE-2023-5044](https://www.cve.org/CVERecord?id=CVE-2023-5044)
  - [CVE-2025-1974](https://www.cve.org/CVERecord?id=CVE-2025-1974)

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security, Ingress NGINX in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Ingress"
