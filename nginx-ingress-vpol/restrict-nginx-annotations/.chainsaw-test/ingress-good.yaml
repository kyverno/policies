apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restrict-annotations-good
  annotations:
    nginx.org/alias-test: "aliasfoo /srv/site;"
    nginx.org/root-test: "rooted /srv/site;"
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
