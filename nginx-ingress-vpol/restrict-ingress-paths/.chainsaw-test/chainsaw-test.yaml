# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: restrict-ingress-paths
spec:
  steps:
    - name: step-01
      try:
        - apply:
            file: ../restrict-ingress-paths.yaml
        - assert:
            file: policy-ready.yaml
    - name: step-02
      try:
        - apply:
            file: ingress-good.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: ingress-update-bad.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: ingress-bad.yaml
    - name: shared-exception-namespace
      skipDelete: true
      try:
        - apply:
            file: exception-namespace.yaml
    - name: exact-resource-exception
      try:
        - apply:
            file: exception.yaml
        - apply:
            file: ingress-exception.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: ingress-exception-sibling.yaml
        - delete:
            file: ingress-exception.yaml
        - delete:
            file: exception.yaml
