apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-exception
  namespace: default
spec:
  rules:
    - http:
        paths:
          - path: /etc/kubernetes/admin.conf
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-exception-sibling
  namespace: default
spec:
  rules:
    - http:
        paths:
          - path: /etc/kubernetes/admin.conf
            pathType: Prefix
