name: restrict-weak-crypto-keys
version: 1.0.0
displayName: Restrict Weak Crypto Keys
createdAt: "2026-06-20T00:00:00.000Z"
description: >-
  RSA keys smaller than 3072 bits are considered weak by NIST SP 800-131A and provide insufficient security margins against both classical and quantum computing attacks. CNSA 2.0 guidance recommends RSA-3072 as the minimum for near-term use while transitioning to post-quantum cryptography (PQC) algorithms. This policy blocks the creation of TLS Secrets containing RSA keys with fewer than 3072 bits, enforcing a minimum key strength for quantum-preparedness.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other/restrict-weak-crypto-keys/restrict-weak-crypto-keys.yaml
  ```
keywords:
  - kyverno
  - Security
  - PQC
  - Post-Quantum Cryptography
readme: |
  RSA keys smaller than 3072 bits are considered weak by NIST SP 800-131A
  and provide insufficient security margins against both classical and
  quantum computing attacks. CNSA 2.0 guidance recommends RSA-3072 as
  the minimum for near-term use while transitioning to post-quantum
  cryptography (PQC) algorithms. This policy blocks the creation of
  TLS Secrets containing RSA keys with fewer than 3072 bits, enforcing
  a minimum key strength for quantum-preparedness.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security"
  kyverno/kubernetesVersion: "1.27"
  kyverno/subject: "Secret"
