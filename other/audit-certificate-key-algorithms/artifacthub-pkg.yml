name: audit-certificate-key-algorithms
version: 1.0.0
displayName: Audit Certificate Key Algorithms
createdAt: "2026-06-20T00:00:00.000Z"
description: >-
  Classical cryptographic key algorithms such as RSA, ECDSA, and DSA are vulnerable to quantum computing attacks. Organizations preparing for post-quantum cryptography (PQC) migration need visibility into which TLS certificates use quantum-vulnerable key algorithms. This policy audits Secrets of type kubernetes.io/tls and reports findings via PolicyReport when certificates use RSA, ECDSA, or DSA key algorithms. Certificates should be planned for migration to PQC-safe algorithms such as ML-DSA (Dilithium) or hybrid schemes when available.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other/audit-certificate-key-algorithms/audit-certificate-key-algorithms.yaml
  ```
keywords:
  - kyverno
  - Security
  - PQC
  - Post-Quantum Cryptography
readme: |
  Classical cryptographic key algorithms such as RSA, ECDSA, and DSA are
  vulnerable to quantum computing attacks. Organizations preparing for
  post-quantum cryptography (PQC) migration need visibility into which TLS
  certificates use quantum-vulnerable key algorithms. This policy audits
  Secrets of type `kubernetes.io/tls` and reports findings via PolicyReport
  when certificates use RSA, ECDSA, or DSA key algorithms. The `x509_decode`
  function is used to parse the certificate and inspect the
  `PublicKeyAlgorithm` field. Certificates should be planned for migration
  to PQC-safe algorithms such as ML-DSA (Dilithium) or hybrid schemes when
  available.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security"
  kyverno/kubernetesVersion: "1.27"
  kyverno/subject: "Secret"
