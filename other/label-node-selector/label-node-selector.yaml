apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: label-node-selector
  annotations:
    policies.kyverno.io/title: Label Nodes with Node Selector
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Node, Label
    kyverno.io/kyverno-version: 1.7.2
    policies.kyverno.io/minversion: 1.7.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/description: >-
      Label Nodes with Node Selector so the NodeType label is copied to the
      eks.amazonaws.com/nodegroup label. The Node resource filter should be
      removed and users may need to grant the Kyverno ServiceAccount permission to update Nodes.
spec:
  mutateExistingOnPolicyUpdate: true
  rules:
    - name: label-node-selector
      match:
        any:
          - resources:
              kinds:
                - Node
      preconditions:
        all:
          - key: "{{ request.object.metadata.labels.NodeType || '' }}"
            operator: NotEquals
            value: ""
      mutate:
        targets:
          - apiVersion: v1
            kind: Node
            name: "{{ request.object.metadata.name }}"
        patchStrategicMerge:
          metadata:
            labels:
              "eks.amazonaws.com/nodegroup": "{{ request.object.metadata.labels.NodeType }}"
