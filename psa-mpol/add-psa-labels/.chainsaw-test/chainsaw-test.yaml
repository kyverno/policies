# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: add-psa-labels
spec:
  # Restore namespace labels when any step fails; the final step's cleanup covers success.
  catch:
  - script:
      content: |
        set -eu
        kubectl delete mutatingpolicy add-psa-labels --ignore-not-found --wait=true
        ../../../.chainsaw/scripts/namespace-labels.sh restore pod-security.kubernetes.io/enforce pod-security.kubernetes.io/warn
  steps:
  - name: step-01
    try:
    - script:
        content: ../../../.chainsaw/scripts/namespace-labels.sh save pod-security.kubernetes.io/enforce pod-security.kubernetes.io/warn
    - apply:
        file: ../add-psa-labels.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: ns.yaml
  - name: step-03
    try:
    - assert:
        file: patched-ns01.yaml
    - assert:
        file: patched-ns02.yaml
    - assert:
        file: patched-ns03.yaml
  - name: exception-isolation
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
    - apply:
        file: policy-exception.yaml
    - apply:
        file: exception-assert.yaml
    - apply:
        file: exception-sibling.yaml
    - assert:
        file: exception-expected.yaml
    - assert:
        file: exception-sibling-expected.yaml
    cleanup:
    - script:
        content: |
          set -eu
          kubectl delete mutatingpolicy add-psa-labels --ignore-not-found --wait=true
          ../../../.chainsaw/scripts/namespace-labels.sh restore pod-security.kubernetes.io/enforce pod-security.kubernetes.io/warn
