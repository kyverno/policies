name: enforce-sidecar-injection-namespace-vpol
version: 1.0.0
displayName: Enforce Istio Sidecar Injection in ValidatingPolicy
description: >-
  Checks that Namespaces have the label `istio-injection` set to `enabled`.
  Missing labels and other values fail validation. Violations are reported in Audit mode.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/istio-vpol/enforce-sidecar-injection-namespace/enforce-sidecar-injection-namespace.yaml
  ```
keywords:
  - kyverno
  - Istio
  - ValidatingPolicy
readme: |
  In order for Istio to inject sidecars into workloads deployed in a Namespace,
  the label `istio-injection` must be set to `enabled`. This policy checks the label
  on Namespace creation and updates, and evaluates existing Namespaces in the background.
  Additional labels are allowed, but a missing required label or a value other than
  `enabled` fails validation.

  Apply this policy where Namespace-level sidecar injection is required. Scope it
  appropriately or use a PolicyException, with PolicyException support enabled in
  Kyverno, for namespaces that use ambient mode, revision-based injection, or no mesh.

  The policy uses `validationActions: [Audit]` by default, so violations are reported
  without blocking requests. It does not add or modify Namespace labels or verify
  that individual Pods received a sidecar.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Istio in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Namespace"
