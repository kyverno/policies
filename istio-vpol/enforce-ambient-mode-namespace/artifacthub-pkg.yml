name: enforce-ambient-mode-namespace-vpol
version: 1.0.0
displayName: Enforce Istio Ambient Mode in ValidatingPolicy
description: >-
  Checks that Namespaces have the label `istio.io/dataplane-mode` set to `ambient`.
  Missing labels and other values fail validation. Violations are reported in Audit mode.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/istio-vpol/enforce-ambient-mode-namespace/enforce-ambient-mode-namespace.yaml
  ```
keywords:
  - kyverno
  - Istio
  - ValidatingPolicy
readme: |
  In order for Istio to include namespaces in ambient mode, the label
  `istio.io/dataplane-mode` must be set to `ambient`. This policy checks the label
  on Namespace creation and updates, and evaluates existing Namespaces in the background.
  Additional labels are allowed, but a missing required label or a value other than
  `ambient` fails validation.

  This policy is intended for ambient-only clusters. Istio also supports mixing
  ambient and sidecar namespaces. Use a PolicyException, with PolicyException
  support enabled in Kyverno, to exclude namespaces that should not use ambient mode,
  such as `default`, `istio-system`, gateway, or sidecar namespaces.

  The policy uses `validationActions: [Audit]` by default, so violations are reported
  without blocking requests. It does not add or modify Namespace labels.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Istio in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Namespace"
