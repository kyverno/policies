apiVersion: wgpolicyk8s.io/v1alpha2
kind: ClusterPolicyReport
scope:
  apiVersion: v1
  kind: Namespace
  name: audit-istio-amb01
(results[?policy == 'enforce-ambient-mode-namespace']):
  - result: fail
    source: KyvernoValidatingPolicy
    message: "The Namespace must have label istio.io/dataplane-mode set to ambient."
