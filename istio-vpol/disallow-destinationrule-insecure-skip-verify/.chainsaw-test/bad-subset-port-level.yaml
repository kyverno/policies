apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: bad-subset-port-level
spec:
  host: api.example.com
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      portLevelSettings:
      - port:
          number: 8443
        tls:
          mode: MUTUAL
          clientCertificate: /etc/certs/cert.pem
          privateKey: /etc/certs/key.pem
          insecureSkipVerify: true
