apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: bad-mixed
spec:
  host: api.example.com
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
    portLevelSettings:
    - port:
        number: 8443
      tls:
        mode: SIMPLE
        insecureSkipVerify: false
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      tls:
        mode: SIMPLE
        insecureSkipVerify: true
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      portLevelSettings:
      - port:
          number: 9443
        tls:
          mode: SIMPLE
          insecureSkipVerify: true
