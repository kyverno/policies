apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: good-no-tls
spec:
  host: ratings.example.com
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      tls:
        mode: SIMPLE
        insecureSkipVerify: true
