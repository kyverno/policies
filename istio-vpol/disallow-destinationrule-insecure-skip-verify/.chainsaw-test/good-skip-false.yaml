apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: good-skip-false
spec:
  host: reviews.example.com
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: false
    portLevelSettings:
    - port:
        number: 8443
      tls:
        mode: SIMPLE
        insecureSkipVerify: false
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      tls:
        mode: SIMPLE
        insecureSkipVerify: false
      portLevelSettings:
      - port:
          number: 9443
        tls:
          mode: SIMPLE
          insecureSkipVerify: false
