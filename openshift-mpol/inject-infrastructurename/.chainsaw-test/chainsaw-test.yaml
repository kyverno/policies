# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: inject-infrastructurename
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ../../../.chainsaw/crds/infrastructure.yaml
    - apply:
        file: ../../../.chainsaw/crds/machineset.yaml
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-machine-api
    - apply:
        resource:
          apiVersion: config.openshift.io/v1
          kind: Infrastructure
          metadata:
            name: cluster
          status:
            infrastructureName: my-infra-xyz
  - name: step-02
    try:
    - apply:
        file: ../inject-infrastructurename.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-03
    try:
    - apply:
        file: ../.kyverno-test/resource.yaml
    - assert:
        file: ../.kyverno-test/patchedResource.yaml
