apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: argo-cluster-generation-from-rancher-capi
  annotations:
    policies.kyverno.io/title: Argo Cluster Secret Generation From Rancher CAPI Secret
    policies.kyverno.io/category: Argo
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/description: >-
      This policy generates and synchronizes Argo CD cluster secrets from Rancher
      managed cluster.provisioning.cattle.io/v1 resources and their corresponding CAPI secrets.
      In this solution, Argo CD integrates with Rancher managed clusters via the central
      Rancher authentication proxy which shares the network endpoint of the Rancher API/GUI.
      The policy implements work-arounds for Argo CD issue https://github.com/argoproj/argo-cd/issues/9033
      "Cluster-API cluster auto-registration" and Rancher issue https://github.com/rancher/rancher/issues/38053
      "Fix type and labels Rancher v2 provisioner specifies when creating CAPI Cluster Secret".
spec:
  evaluation:
    admission:
      enabled: true
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["provisioning.cattle.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters"]
  matchConditions:
    - name: exclude-fleet-local
      expression: "object.metadata.namespace != 'fleet-local'"
  variables:
    - name: clusterName
      expression: "object.metadata.name"
    - name: clusterPrefixedName
      expression: "'cluster-' + variables.clusterName"
    # Merge the Cluster labels with the Argo CD labels. The merge goes through JSON
    # because generator.Apply does not accept a CEL map that listObjToMap returns.
    - name: labelEntries
      expression: >-
        object.metadata.?labels.orValue({}).map(k, '"' + k + '":"' + object.metadata.labels[k] + '"') +
        [
          '"argocd.argoproj.io/secret-type":"cluster"',
          '"clusterId":"' + variables.clusterName + '"'
        ]
    - name: metadataLabels
      expression: "json.unmarshal('{' + variables.labelEntries.join(',') + '}')"
    - name: kubeconfigData
      expression: "resource.Get('v1', 'secrets', object.metadata.namespace, variables.clusterName + '-kubeconfig').data"
    - name: kubeconfig
      expression: "yaml.parse(string(base64.decode(variables.kubeconfigData.value)))"
    - name: serverName
      expression: "string(variables.kubeconfig.clusters[0].cluster.server)"
    - name: caData
      expression: "string(variables.kubeconfig.clusters[0].cluster['certificate-authority-data'])"
    - name: bearerToken
      expression: "string(base64.decode(variables.kubeconfigData.token))"
    - name: dataConfig
      expression: >-
        '{\n  "bearerToken": "' + variables.bearerToken +
        '",\n  "tlsClientConfig": {\n    "insecure": false,\n    "caData": "' + variables.caData +
        '"\n  }\n}\n'
  generate:
    - expression: >-
        generator.Apply("argocd", [
          dyn({
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": dyn(variables.clusterPrefixedName),
              "namespace": dyn("argocd"),
              "labels": dyn(variables.metadataLabels)
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "name": dyn(base64.encode(bytes(variables.clusterPrefixedName))),
              "server": dyn(base64.encode(bytes(variables.serverName))),
              "config": dyn(base64.encode(bytes(variables.dataConfig)))
            })
          })
        ])
