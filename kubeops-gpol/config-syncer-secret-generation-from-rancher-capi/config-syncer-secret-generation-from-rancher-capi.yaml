apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: config-syncer-secret-generation-from-rancher-capi
  annotations:
    policies.kyverno.io/title: Kubeops Config Syncer Secret Generation From Rancher CAPI Secret
    policies.kyverno.io/category: Kubeops
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Secret
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/description: >-
      This policy generates and synchronizes a Kubeops Config Syncer merged kubeconfig
      Secret from Rancher managed cluster CAPI secrets. This kubeconfig Secret is
      required by the Kubeops Config Syncer for it to sync ConfigMaps/Secrets from
      the Rancher management cluster to downstream clusters.
spec:
  evaluation:
    admission:
      enabled: true
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["provisioning.cattle.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusters"]
  matchConditions:
    - name: exclude-fleet-local
      expression: "object.metadata.namespace != 'fleet-local'"
  variables:
    - name: secretList
      expression: >-
        dyn(resource.List('v1', 'secrets', object.metadata.namespace).items).filter(s, s.metadata.name.endsWith('-kubeconfig'))
    - name: existingSecrets
      expression: >-
        dyn(resource.List('v1', 'secrets', 'kubed').items).filter(s, s.metadata.name == 'kubed')
    - name: currentKubeconfig
      expression: >-
        variables.existingSecrets.size() == 0 ? '' : variables.existingSecrets[0].?data.?kubeconfig.orValue('')
    - name: clustersData
      expression: >-
        variables.secretList.map(s,
          '{"cluster":{"certificate-authority-data":"' + string(yaml.parse(string(base64.decode(s.data.value))).clusters[0].cluster['certificate-authority-data']) + '","server":"' + string(yaml.parse(string(base64.decode(s.data.value))).clusters[0].cluster.server) + '"},"name":"' + s.metadata.name.replace('-kubeconfig', '') + '"}'
        ).join(',')
    - name: contextsData
      expression: >-
        variables.secretList.map(s,
          '{"context":{"cluster":"' + s.metadata.name.replace('-kubeconfig', '') + '","user":"' + s.metadata.name.replace('-kubeconfig', '') + '"},"name":"' + s.metadata.name.replace('-kubeconfig', '') + '"}'
        ).join(',')
    - name: usersData
      expression: >-
        variables.secretList.map(s,
          '{"name":"' + s.metadata.name.replace('-kubeconfig', '') + '","user":{"client-certificate-data":"' + string(yaml.parse(string(base64.decode(s.data.value))).users[0].user['client-certificate-data']) + '"}}'
        ).join(',')
    - name: kubeconfigData
      expression: >-
        '{\n  "apiVersion": "v1",\n  "kind": "Config",\n  "clusters": [' + variables.clustersData +
        '],\n  "contexts": [' + variables.contextsData +
        '],\n  "users": [' + variables.usersData +
        ']\n}\n'
    - name: encodedKubeconfig
      expression: "base64.encode(bytes(variables.kubeconfigData))"
    - name: downstream
      expression: >-
        variables.secretList.size() == 0 ? [] : [
          dyn({
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": dyn("kubed"),
              "namespace": dyn("kubed")
            }),
            "type": dyn("Opaque"),
            "data": dyn({
              "kubeconfig": dyn(variables.encodedKubeconfig)
            })
          })
        ]
  generate:
    - expression: >-
        variables.secretList.size() > 0 && variables.encodedKubeconfig != variables.currentKubeconfig
          ? generator.Apply("kubed", variables.downstream)
          : true
