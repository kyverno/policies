apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-safe-to-evict
  annotations:
    policies.kyverno.io/title: Add Safe To Evict
    policies.kyverno.io/category: Other
    policies.kyverno.io/subject: Pod,Annotation
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      The Kubernetes cluster autoscaler does not evict pods that 
      use hostPath or emptyDir volumes. To allow eviction of these pods, the annotation 
      cluster-autoscaler.kubernetes.io/safe-to-evict=true must be added to the pods.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == "Pod" ? object.spec :
        object.kind in ["Deployment", "DaemonSet", "StatefulSet", "Job", "ReplicaSet", "ReplicationController"] ?
          (has(object.spec.template) && has(object.spec.template.spec) ? object.spec.template.spec : null) :
        object.kind == "CronJob" ?
          (has(object.spec.jobTemplate) && has(object.spec.jobTemplate.spec) && has(object.spec.jobTemplate.spec.template) && has(object.spec.jobTemplate.spec.template.spec) ? object.spec.jobTemplate.spec.template.spec : null) :
        null
  matchConditions:
    - name: has-emptydir-or-hostpath
      expression: |
        variables.podSpec != null &&
        has(variables.podSpec.volumes) && 
        variables.podSpec.volumes.exists(v, has(v.emptyDir) || has(v.hostPath))
    - name: annotation-not-present
      expression: |
        object.kind == "Pod" ?
          (!has(object.metadata.annotations) || 
           !object.metadata.annotations.exists(k, k == 'cluster-autoscaler.kubernetes.io/safe-to-evict')) :
        object.kind in ["Deployment", "DaemonSet", "StatefulSet", "Job", "ReplicaSet", "ReplicationController"] ?
          (!has(object.spec.template) ||
           !has(object.spec.template.metadata) ||
           !has(object.spec.template.metadata.annotations) || 
           !object.spec.template.metadata.annotations.exists(k, k == 'cluster-autoscaler.kubernetes.io/safe-to-evict')) :
        object.kind == "CronJob" ?
          (!has(object.spec.jobTemplate) ||
           !has(object.spec.jobTemplate.spec) ||
           !has(object.spec.jobTemplate.spec.template) ||
           !has(object.spec.jobTemplate.spec.template.metadata) ||
           !has(object.spec.jobTemplate.spec.template.metadata.annotations) || 
           !object.spec.jobTemplate.spec.template.metadata.annotations.exists(k, k == 'cluster-autoscaler.kubernetes.io/safe-to-evict')) :
        false
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          object.kind == "Pod" ?
          Object{
            metadata: Object.metadata{
              annotations: {
                "cluster-autoscaler.kubernetes.io/safe-to-evict": "true"
              }
            }
          } :
          object.kind in ["Deployment", "DaemonSet", "StatefulSet", "Job", "ReplicaSet", "ReplicationController"] ?
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {
                    "cluster-autoscaler.kubernetes.io/safe-to-evict": "true"
                  }
                }
              }
            }
          } :
          object.kind == "CronJob" ?
          Object{
            spec: Object.spec{
              jobTemplate: Object.spec.jobTemplate{
                spec: Object.spec.jobTemplate.spec{
                  template: Object.spec.jobTemplate.spec.template{
                    metadata: Object.spec.jobTemplate.spec.template.metadata{
                      annotations: {
                        "cluster-autoscaler.kubernetes.io/safe-to-evict": "true"
                      }
                    }
                  }
                }
              }
            }
          } : Object{}
