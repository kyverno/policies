apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: audit-event-on-exec
  annotations:
    policies.kyverno.io/title: Audit Event on Pod Exec
    policies.kyverno.io/category: Other
    kyverno.io/kyverno-version: 1.15.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Kubernetes Events are limited in that the circumstances under which they are created
      cannot be changed and with what they are associated is fixed. It may be advantageous
      in many cases to augment these out-of-the-box Events with custom Events which can be
      custom designed to your needs. This policy generates an Event on a Pod when an exec
      has been made to it. It lists the userInfo of the actor performing the exec along
      with the command used in the exec.
spec:
  evaluation:
    synchronize:
      enabled: false
    generateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec"]
  variables:
    - name: targetNs
      expression: "request.namespace"
    - name: podName
      expression: "request.name"
    - name: parentPod
      expression: "resource.Get('v1', 'pods', variables.targetNs, variables.podName)"
    - name: podUid
      expression: "variables.parentPod.metadata.uid"
    - name: eventName
      expression: "'exec.' + random('[a-z0-9]{6}')"
    - name: now
      expression: "string(time.now())"
    - name: user
      expression: "request.userInfo.username"
    - name: commands
      expression: "object.command.join(' ')"
    - name: message
      expression: "'An exec was performed by ' + variables.user + ' running commands ' + variables.commands"
  generate:
    - expression: >-
        generator.Apply(variables.targetNs, [
          dyn({
            "apiVersion": dyn("v1"),
            "kind": dyn("Event"),
            "metadata": dyn({
              "name": dyn(variables.eventName),
              "namespace": dyn(variables.targetNs)
            }),
            "involvedObject": dyn({
              "apiVersion": dyn("v1"),
              "kind": dyn("Pod"),
              "name": dyn(variables.podName),
              "namespace": dyn(variables.targetNs),
              "uid": dyn(variables.podUid)
            }),
            "reason": dyn("Exec"),
            "type": dyn("Warning"),
            "source": dyn({
              "component": dyn("kyverno")
            }),
            "firstTimestamp": dyn(variables.now),
            "lastTimestamp": dyn(variables.now),
            "message": dyn(variables.message)
          })
        ])
