apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  name: kyverno:background-controller-generate-debug-job
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# Note: To enable debug data collection in target namespaces where pods run,
# provision a ServiceAccount named `get-debug-data-sa` and bind it to the `pod-reader`
# ClusterRole via a namespace-scoped RoleBinding:
#
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: get-debug-data-sa
#   namespace: <target-namespace>
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: read-pods-rolebinding
#   namespace: <target-namespace>
# subjects:
# - kind: ServiceAccount
#   name: get-debug-data-sa
#   namespace: <target-namespace>
# roleRef:
#   kind: ClusterRole
#   name: pod-reader
#   apiGroup: rbac.authorization.k8s.io
