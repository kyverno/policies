apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sync-namespace-config
spec:
  steps:
  - name: create-source-and-policy
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: platform-system
    - apply:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: platform-system
          data:
            log-level: info
    - apply:
        file: ../sync-namespace-config.yaml
    - assert:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: GeneratingPolicy
          metadata:
            name: sync-namespace-config
          status:
            conditionStatus:
              ready: true
  - name: clone-only-to-matching-namespace
    try:
    - apply:
        file: ../.kyverno-test/resources.yaml
    - assert:
        file: ../.kyverno-test/generated.yaml
    - error:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: unmanaged-config
  - name: propagate-source-update
    try:
    - patch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: platform-system
          data:
            log-level: debug
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: tenant-config
          data:
            log-level: debug
  - name: repair-downstream-drift
    try:
    - patch:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: tenant-config
          data:
            log-level: tampered
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: tenant-config
          data:
            log-level: debug
  - name: recreate-deleted-clone
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: ConfigMap
          name: namespace-defaults
          namespace: tenant-config
    - assert:
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: namespace-defaults
            namespace: tenant-config
          data:
            log-level: debug
