name: sync-namespace-config
version: 1.0.0
displayName: Synchronize Namespace Configuration
createdAt: "2026-11-03T00:00:00Z"
description: >-
  Clone the namespace-defaults ConfigMap from the platform-system namespace
  into namespaces labeled platform.example.com/managed=true. Keep clones
  synchronized with the source, including repairing downstream changes.
  Create the source namespace and ConfigMap before installing this policy.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-gpol/sync-namespace-config/sync-namespace-config.yaml
  ```
keywords:
- kyverno
- Other
readme: |
  Clone the namespace-defaults ConfigMap from the platform-system namespace
  into namespaces labeled platform.example.com/managed=true. Keep clones
  synchronized with the source, including repairing downstream changes.
  Create the source namespace and ConfigMap before installing this policy.

  Requires Kyverno 1.20 (main). CLI tests mock the source ConfigMap.
  Chainsaw tests verify source updates, drift repair, and clone recreation.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: Other
  kyverno/subject: Namespace, ConfigMap
