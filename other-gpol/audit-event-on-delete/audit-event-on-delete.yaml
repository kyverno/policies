apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: audit-event-on-delete
  annotations:
    policies.kyverno.io/title: Audit Event on Delete
    policies.kyverno.io/category: Other
    kyverno.io/kyverno-version: 1.15.0
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Kubernetes Events are limited in that the circumstances under which they are created
      cannot be changed and with what they are associated is fixed. It may be advantageous
      in many cases to augment these out-of-the-box Events with custom Events which can be
      custom designed to your needs. This policy generates an Event when a Secret has been
      deleted. It lists the userInfo of the actor performing the deletion.
spec:
  evaluation:
    synchronize:
      enabled: false
    generateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["secrets"]
  variables:
    - name: targetNs
      expression: "request.namespace"
    - name: secretName
      expression: "request.name"
    - name: secretUid
      expression: "oldObject.metadata.uid"
    - name: eventName
      expression: "'delete.' + random('[a-z0-9]{12}')"
    - name: now
      expression: "string(time.now())"
    - name: user
      expression: "request.userInfo.username"
    - name: message
      expression: "'The ' + variables.secretName + ' Secret was deleted by ' + variables.user + '.'"
  generate:
    - expression: >-
        generator.Apply(variables.targetNs, [
          dyn({
            "apiVersion": dyn("v1"),
            "kind": dyn("Event"),
            "metadata": dyn({
              "name": dyn(variables.eventName),
              "namespace": dyn(variables.targetNs)
            }),
            "involvedObject": dyn({
              "apiVersion": dyn("v1"),
              "kind": dyn("Secret"),
              "name": dyn(variables.secretName),
              "namespace": dyn(variables.targetNs),
              "uid": dyn(variables.secretUid)
            }),
            "reason": dyn("Delete"),
            "type": dyn("Warning"),
            "source": dyn({
              "component": dyn("kyverno")
            }),
            "firstTimestamp": dyn(variables.now),
            "lastTimestamp": dyn(variables.now),
            "message": dyn(variables.message)
          })
        ])
