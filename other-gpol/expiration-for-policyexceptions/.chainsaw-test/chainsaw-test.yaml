# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: expiration-for-policyexceptions
spec:
  steps:
  - name: step-00
    try:
    - apply:
        file: ../rbac.yaml
    - apply:
        file: ../expiration-for-policyexceptions.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-01
    try:
    - apply:
        file: ns.yaml
    - apply:
        file: exception.yaml
  - name: step-02
    try:
    - assert:
        file: cleanup-policy-assert.yaml
  - name: step-03
    try:
    - script:
        content: |
          set -eu
          DP_NAME=$(kubectl get deletingpolicy -l kyverno.io/automated=true -o jsonpath='{.items[0].metadata.name}')
          kubectl patch deletingpolicy "$DP_NAME" --type=merge -p '{"spec":{"schedule":"*/1 * * * *"}}'
    - error:
        timeout: 2m
        file: exception.yaml
    - error:
        timeout: 30s
        file: cleanup-policy-assert.yaml
