name: generate-networkpolicy-existing
version: 1.0.0
displayName: Generate NetworkPolicy to Existing Namespaces
createdAt: "2026-11-21T00:00:00Z"
description: >-
  A NetworkPolicy is often a critical piece when provisioning new Namespaces, but there may be existing Namespaces which also need the same resource. Creating each one individually or manipulating each Namespace in order to trigger creation is additional overhead. This policy creates a new NetworkPolicy for existing Namespaces which results in a default deny behavior and labels it with created-by=kyverno.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-gpol/generate-networkpolicy-existing/generate-networkpolicy-existing.yaml
  ```
keywords:
  - kyverno
  - Other
readme: |
  A NetworkPolicy is often a critical piece when provisioning new Namespaces, but there may be existing Namespaces which also need the same resource. Creating each one individually or manipulating each Namespace in order to trigger creation is additional overhead. This policy creates a new NetworkPolicy for existing Namespaces which results in a default deny behavior and labels it with created-by=kyverno.

  The policy generates the NetworkPolicy `default-deny` in every Namespace that exists when you create the policy, and in each Namespace that is created or updated later. The NetworkPolicy selects all Pods and denies their egress traffic. Kyverno keeps it synchronized, so it recreates the NetworkPolicy if someone deletes or changes it.

  A NetworkPolicy-capable CNI is needed to enforce the generated rules.

  Don't install this policy together with `add-networkpolicy` from `best-practices-gpol`. Both generate and synchronize a NetworkPolicy named `default-deny` in each Namespace, with different `policyTypes`.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "Namespace, NetworkPolicy"
