# This example assumes that Kasten policy presets named "gold", "silver", and "bronze" have been pre-created and Kasten was deployed into the `kasten-io` namespace.
#
# NOTE: Use of this policy will require granting the Kyverno background-controller additional privileges required to generate Kasten resources. An example ClusterRole to provide required privileges is provided within the comments of the policy manifest.
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: kyverno:kasten:manage
#   labels:
#     rbac.kyverno.io/aggregate-to-background-controller: "true"
#     rbac.kyverno.io/aggregate-to-admission-controller: "true"
#     rbac.kyverno.io/aggregate-to-reports-controller: "true"
# rules:
# - apiGroups:
#   - config.kio.kasten.io
#   resources:
#   - policies
#   verbs:
#   - create
#   - update
#   - delete
#   - get
#   - list
#   - watch
#
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: kasten-generate-policy-by-preset-label
  annotations:
    policies.kyverno.io/title: Generate Kasten Policy from Preset
    policies.kyverno.io/category: Veeam Kasten
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Policy
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.24-1.30"
    policies.kyverno.io/description: >-
      Generates a Kasten policy for a new namespace that includes a valid "dataprotection" label, if the policy does not already exist.
      Use with "kasten-validate-ns-by-preset-label" policy to require "dataprotection" labeling on new namespaces.
spec:
  evaluation:
    admission:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: has-valid-dataprotection-label
      expression: >-
        'dataprotection' in object.metadata.?labels.orValue({}) &&
        object.metadata.labels['dataprotection'] in ['gold', 'silver', 'bronze']
  variables:
    - name: existingPolicies
      expression: >-
        dyn(resource.List('config.kio.kasten.io/v1alpha1', 'policies', 'kasten-io').items)
    - name: policyAlreadyExists
      expression: >-
        variables.existingPolicies.exists(p,
          (('generate.kyverno.io/policy-name' in p.metadata.?labels.orValue({}) && p.metadata.labels['generate.kyverno.io/policy-name'] == 'kasten-generate-policy-by-preset-label') ||
           p.metadata.?name.orValue('') == object.metadata.name + '-' + object.metadata.labels['dataprotection'] + '-backup') &&
          p.spec.?presetRef.?name.orValue('') == object.metadata.labels['dataprotection'] &&
          p.spec.?selector.?matchExpressions.orValue([]).exists(me,
            me.key == 'k10.kasten.io/appNamespace' && object.metadata.name in me.values
          )
        )
    - name: downstream
      expression: >-
        variables.policyAlreadyExists ? [] : [
          {
            "apiVersion": dyn("config.kio.kasten.io/v1alpha1"),
            "kind": dyn("Policy"),
            "metadata": dyn({
              "name": dyn(object.metadata.name + "-" + object.metadata.labels['dataprotection'] + "-backup"),
              "namespace": dyn("kasten-io")
            }),
            "spec": dyn({
              "comment": dyn("Auto-generated by Kyverno"),
              "paused": dyn(false),
              "actions": dyn([
                dyn({
                  "action": dyn("backup")
                })
              ]),
              "presetRef": dyn({
                "name": dyn(object.metadata.labels['dataprotection']),
                "namespace": dyn("kasten-io")
              }),
              "selector": dyn({
                "matchExpressions": dyn([
                  dyn({
                    "key": dyn("k10.kasten.io/appNamespace"),
                    "operator": dyn("In"),
                    "values": dyn([dyn(object.metadata.name)])
                  })
                ])
              })
            })
          }
        ]
  generate:
    - expression: generator.Apply("kasten-io", variables.downstream)
