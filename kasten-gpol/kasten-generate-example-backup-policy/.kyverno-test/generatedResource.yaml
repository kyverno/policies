apiVersion: config.kio.kasten.io/v1alpha1
kind: Policy
metadata:
  labels:
    app.kubernetes.io/managed-by: kyverno
  name: test-namespace-kasten-example-policy
  namespace: kasten-io
spec:
  actions:
  - action: backup
  - action: export
    exportParameters:
      exportData: true
      frequency: '@daily'
      profile:
        name: test
        namespace: kasten-io
  comment: Auto-generated by Kyverno
  frequency: '@daily'
  retention:
    daily: 7
    monthly: 12
    weekly: 4
    yearly: 7
  selector:
    matchExpressions:
    - key: k10.kasten.io/appNamespace
      operator: In
      values:
      - test-namespace
