apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: clusterresources
spec:
  crds:
  - crds/kasten-policy.yaml
  resources:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: test-namespace
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: kasten-io
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: skip-namespace
  - apiVersion: config.kio.kasten.io/v1alpha1
    kind: Policy
    metadata:
      name: skip-namespace-kasten-example-policy
      namespace: kasten-io
      labels:
        generate.kyverno.io/policy-name: kasten-generate-example-backup-policy
    spec:
      comment: Pre-existing
      selector:
        matchExpressions:
        - key: k10.kasten.io/appNamespace
          operator: In
          values:
          - skip-namespace
