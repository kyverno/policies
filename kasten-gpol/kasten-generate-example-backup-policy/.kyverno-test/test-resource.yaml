apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: test-namespace
  labels:
    dataprotection: kasten-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: test
        image: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skip-deployment
  namespace: skip-namespace
  labels:
    dataprotection: kasten-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skip
  template:
    metadata:
      labels:
        app: skip
    spec:
      containers:
      - name: skip
        image: nginx
