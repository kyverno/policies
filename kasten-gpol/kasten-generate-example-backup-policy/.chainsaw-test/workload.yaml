apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deploy
  namespace: test-kasten-example-backup-policy-ns
  labels:
    dataprotection: kasten-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: nginx
        image: nginx
