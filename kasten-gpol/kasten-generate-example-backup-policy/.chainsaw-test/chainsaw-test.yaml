# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: kasten-generate-example-backup-policy
spec:
  steps:
  - name: step-00
    try:
    - assert:
        file: crd-assert.yaml
  - name: step-01
    try:
    - apply:
        file: permissions.yaml
    - apply:
        file: namespaces.yaml
  - name: step-02
    try:
    - apply:
        file: ../kasten-generate-example-backup-policy.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-03
    try:
    - apply:
        file: workload.yaml
    - assert:
        file: generated-policy.yaml
  - name: step-04
    try:
    - delete:
        ref:
          apiVersion: apps/v1
          kind: Deployment
          name: test-deploy
          namespace: test-kasten-example-backup-policy-ns
    - error:
        file: generated-policy.yaml
