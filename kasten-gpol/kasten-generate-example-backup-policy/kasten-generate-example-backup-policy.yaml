# This example assumes that Kasten was deployed into the `kasten-io` namespace.
#
# NOTE: Use of this policy will require granting the Kyverno background-controller,
# admission-controller, and reports-controller privileges required to inspect and generate
# Kasten resources. Read-only access is granted to admission, reports, and background
# controllers, while create/update/delete management access is restricted to the
# background-controller. Example ClusterRoles to provide required privileges are provided below:
#
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: kyverno:kasten:view
#   labels:
#     rbac.kyverno.io/aggregate-to-background-controller: "true"
#     rbac.kyverno.io/aggregate-to-admission-controller: "true"
#     rbac.kyverno.io/aggregate-to-reports-controller: "true"
# rules:
# - apiGroups:
#   - config.kio.kasten.io
#   resources:
#   - policies
#   verbs:
#   - get
#   - list
#   - watch
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: kyverno:kasten:manage
#   labels:
#     rbac.kyverno.io/aggregate-to-background-controller: "true"
# rules:
# - apiGroups:
#   - config.kio.kasten.io
#   resources:
#   - policies
#   verbs:
#   - create
#   - update
#   - delete
#
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: kasten-generate-example-backup-policy
  annotations:
    policies.kyverno.io/title: Generate Kasten Backup Policy Based on Resource Label
    policies.kyverno.io/category: Veeam Kasten
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Policy
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.24-1.30"
    policies.kyverno.io/description: >-
      Generates a Kasten policy for a namespace that includes any Deployment or StatefulSet with a "dataprotection=kasten-example" label, if the policy does not already exist. This Kyverno policy can be used in combination with the "kasten-data-protection-by-label" policy to require "dataprotection" labeling on workloads.
spec:
  evaluation:
    admission:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
    objectSelector:
      matchLabels:
        dataprotection: kasten-example
  variables:
    - name: existingPolicies
      expression: >-
        dyn(resource.List('config.kio.kasten.io/v1alpha1', 'policies', 'kasten-io').items)
    - name: policyAlreadyExists
      expression: >-
        variables.existingPolicies.exists(p,
          (('generate.kyverno.io/policy-name' in p.metadata.?labels.orValue({}) && p.metadata.labels['generate.kyverno.io/policy-name'] == 'kasten-generate-example-backup-policy') ||
           p.metadata.?name.orValue('') == object.metadata.namespace + '-kasten-example-policy') &&
          p.spec.?selector.?matchExpressions.orValue([]).exists(me,
            me.key == 'k10.kasten.io/appNamespace' && object.metadata.namespace in me.values
          )
        )
    - name: downstream
      expression: >-
        variables.policyAlreadyExists ? [] : [
          {
            "apiVersion": dyn("config.kio.kasten.io/v1alpha1"),
            "kind": dyn("Policy"),
            "metadata": dyn({
              "name": dyn(object.metadata.namespace + "-kasten-example-policy"),
              "namespace": dyn("kasten-io")
            }),
            "spec": dyn({
              "comment": dyn("Auto-generated by Kyverno"),
              "frequency": dyn("@daily"),
              "retention": dyn({
                "daily": dyn(7),
                "weekly": dyn(4),
                "monthly": dyn(12),
                "yearly": dyn(7)
              }),
              "actions": dyn([
                dyn({
                  "action": dyn("backup")
                }),
                dyn({
                  "action": dyn("export"),
                  "exportParameters": dyn({
                    "frequency": dyn("@daily"),
                    "profile": dyn({
                      "name": dyn("test"),
                      "namespace": dyn("kasten-io")
                    }),
                    "exportData": dyn({
                      "enabled": dyn(true)
                    })
                  })
                })
              ]),
              "selector": dyn({
                "matchExpressions": dyn([
                  dyn({
                    "key": dyn("k10.kasten.io/appNamespace"),
                    "operator": dyn("In"),
                    "values": dyn([dyn(object.metadata.namespace)])
                  })
                ])
              })
            })
          }
        ]
  generate:
    - expression: generator.Apply("kasten-io", variables.downstream)
