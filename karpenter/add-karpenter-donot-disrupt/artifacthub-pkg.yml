readme: |
  # Add Karpenter Do Not Disrupt

  This policy facilitates the migration from Karpenter 0.x to 1.x by automatically
  adding the new karpenter.sh/do-not-disrupt annotation to pods that use the deprecated
  karpenter.sh/do-not-evict annotation set to true.

  When a pod is created with the old karpenter.sh/do-not-evict annotation set to true, this policy
  automatically adds the new karpenter.sh/do-not-disrupt annotation to ensure the pod
  remains protected during node termination operations in Karpenter 1.x.

  Reference for this change: https://karpenter.sh/v1.0/upgrading/v1-migration/
