apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-sbom-cyclonedx
  annotations:
    policies.kyverno.io/title: Verify CycloneDX SBOM (Keyless)
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      Software Bill of Materials (SBOM) provide details on the composition of a given
      container image and may be represented in a couple different standards.
      Having an SBOM can be important to ensuring images are built using verified
      processes. This policy verifies that an image has an SBOM in CycloneDX format
      and was signed by the expected subject and issuer when produced through GitHub Actions
      and using Cosign's keyless signing. It requires configuration based upon your own values.
spec:
  validationActions: [Audit]
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  matchImageReferences:
  - glob: "myreg.org/path/repo:*"
  attestors:
  - name: cosign
    cosign:
      keyless:
        identities:
        - subject: "mysubject"
          issuer: "https://token.actions.githubusercontent.com"
      ctlog:
        url: https://rekor.sigstore.dev
  attestations:
  - name: sbom
    intoto:
      type: https://cyclonedx.org/schema
  variables:
  - name: allImages
    expression: >-
      images.?containers.orValue([]) + images.?initContainers.orValue([]) +
      images.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.allImages.map(image,
        verifyAttestationSignatures(image, attestations.sbom, [attestors.cosign])
      ).all(count, count > 0)
    message: A CycloneDX SBOM attestation signed by the expected subject and issuer is required.
  - expression: >-
      variables.allImages.map(image,
        extractPayload(image, attestations.sbom).predicate.Data.bomFormat == 'CycloneDX'
      ).all(valid, valid)
    message: The attested SBOM must be in CycloneDX format.
