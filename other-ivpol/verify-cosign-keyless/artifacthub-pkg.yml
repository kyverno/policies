name: verify-cosign-keyless
version: 1.0.0
displayName: Verify Cosign Keyless Signatures
createdAt: "2026-11-03T00:00:00Z"
description: >-
  Verify Cosign keyless signatures against an exact GitHub Actions identity
  and OIDC issuer, including transparency log verification. Matching container
  images are pinned to digests. This sample trusts the Kyverno test-images
  workflow; replace the image glob and identity with your own before use.
  Audit mode reports failures without blocking workloads.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-ivpol/verify-cosign-keyless/verify-cosign-keyless.yaml
  ```
keywords:
- kyverno
- Software Supply Chain Security
readme: |
  Verify Cosign keyless signatures against an exact GitHub Actions identity
  and OIDC issuer, including transparency log verification. Matching container
  images are pinned to digests. This sample trusts the Kyverno test-images
  workflow; replace the image glob and identity with your own before use.
  Audit mode reports failures without blocking workloads.

  Requires Kyverno 1.20 (main). Tests access GHCR and Sigstore over the network.
  Normal and init-container signatures, digest mutation, Audit versus Deny,
  autogenerated Deployment rules, and a mismatched signer are tested.
  Verification applies only to images selected by the glob, not every registry.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: Software Supply Chain Security
  kyverno/subject: Pod
