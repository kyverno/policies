apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-cosign-keyless
spec:
  steps:
  - name: install-audit-policy
    try:
    - apply:
        file: ../verify-cosign-keyless.yaml
    - assert:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ImageValidatingPolicy
          metadata:
            name: verify-cosign-keyless
          status:
            conditionStatus:
              ready: true
    - create:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: audit-unsigned
          spec:
            containers:
            - name: app
              image: ghcr.io/kyverno/test-images/cosign:unsigned
    - create:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: audit-missing-image
          spec:
            containers:
            - name: app
              image: ghcr.io/kyverno/test-images/cosign:missing-audit-test
  - name: enforce-signatures
    try:
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ImageValidatingPolicy
          metadata:
            name: verify-cosign-keyless
          spec:
            validationActions: [Deny]
            failurePolicy: Fail
    - create:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: signed
          spec:
            initContainers:
            - name: init
              image: ghcr.io/kyverno/test-images/cosign:v2-keyless
            containers:
            - name: app
              image: ghcr.io/kyverno/test-images/cosign:v2-keyless
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: signed
          spec:
            (starts_with(containers[0].image, 'ghcr.io/kyverno/test-images/cosign:v2-keyless@sha256:')): true
            (starts_with(initContainers[0].image, 'ghcr.io/kyverno/test-images/cosign:v2-keyless@sha256:')): true
    - create:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: unsigned-init
          spec:
            initContainers:
            - name: init
              image: ghcr.io/kyverno/test-images/cosign:unsigned
            containers:
            - name: app
              image: ghcr.io/kyverno/test-images/cosign:v2-keyless
        expect:
        - check:
            (contains($error, 'Images must be signed by the trusted GitHub Actions workflow.')): true
  - name: enforce-autogenerated-deployment-rule
    try:
    - create:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: unsigned-deployment
          spec:
            replicas: 0
            selector:
              matchLabels:
                app: unsigned
            template:
              metadata:
                labels:
                  app: unsigned
              spec:
                containers:
                - name: app
                  image: ghcr.io/kyverno/test-images/cosign:unsigned
        expect:
        - check:
            (contains($error, 'Images must be signed by the trusted GitHub Actions workflow.')): true
  - name: reject-untrusted-signer
    try:
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ImageValidatingPolicy
          metadata:
            name: verify-cosign-keyless
          spec:
            attestors:
            - name: github
              cosign:
                keyless:
                  identities:
                  - issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/example/untrusted/.github/workflows/build.yml@refs/heads/main
                ctlog:
                  url: https://rekor.sigstore.dev
    - create:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: wrong-signer
          spec:
            containers:
            - name: app
              image: ghcr.io/kyverno/test-images/cosign:v2-keyless
        expect:
        - check:
            (contains($error, 'Images must be signed by the trusted GitHub Actions workflow.')): true
