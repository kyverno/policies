name: application-prevent-updates-project-vpol
version: 1.0.0
displayName: Prevent Updates to Project in CEL expressions
description: >-
  This policy prevents updates to the project field after an Application is created.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/application-prevent-updates-project/application-prevent-updates-project.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  This policy prevents updates to the project field after an Application is created.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Argo in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "Application"
