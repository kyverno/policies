name: appproject-clusterresourceblacklist-vpol
version: 1.0.0
displayName: Enforce AppProject with clusterResourceBlacklist in CEL expressions
description: >-
  An AppProject may optionally specify clusterResourceBlacklist which is a blacklisted group of cluster resources. This is often a good practice to ensure AppProjects do not allow more access than needed. This policy enforces that all AppProjects specify clusterResourceBlacklist and that their group and kind have wildcards as values.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/appproject-clusterresourceblacklist/appproject-clusterresourceblacklist.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  An AppProject may optionally specify clusterResourceBlacklist which is a blacklisted group of cluster resources. This is often a good practice to ensure AppProjects do not allow more access than needed. This policy enforces that all AppProjects specify clusterResourceBlacklist and that their group and kind have wildcards as values.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Argo in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "AppProject"
