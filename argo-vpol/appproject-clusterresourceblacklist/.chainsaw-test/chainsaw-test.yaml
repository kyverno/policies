# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: appproject-clusterresourceblacklist
spec:
  template: false
  steps:
    - name: step-01
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: step-02
      try:
        - apply:
            file: ../appproject-clusterresourceblacklist.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: appproject-clusterresourceblacklist
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-03
      try:
        - apply:
            file: good.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-both-wildcard.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-group-wildcard.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-kind-wildcard.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-no-blacklist.yaml
