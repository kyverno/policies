# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: appproject-restrict-source-namespaces
spec:
  template: false
  steps:
    - name: step-01
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: step-02
      try:
        - apply:
            file: ../appproject-restrict-source-namespaces.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: appproject-restrict-source-namespaces
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-03
      try:
        - apply:
            file: good.yaml
        - apply:
            file: good-no-source-namespaces.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: argocd, *'))": true
            file: bad-exact.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: *'))": true
            file: bad-wildcard.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: argo*'))": true
            file: bad-glob-prefix.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: argo?d'))": true
            file: bad-glob-single-char.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: [a-c]rgocd'))": true
            file: bad-glob-class.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: {team-one,argocd}'))": true
            file: bad-glob-alternatives.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: /^argo/'))": true
            file: bad-regex.yaml
    - name: step-04
      try:
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'Remove or narrow these entries: argocd'))": true
            file: bad-update.yaml
    - name: step-05
      try:
        - apply:
            file: good-default-project.yaml
        - apply:
            expect:
              - check:
                  "(contains($error, 'Policy appproject-restrict-source-namespaces failed') && contains($error, 'The default AppProject must not set spec.sourceNamespaces'))": true
            file: bad-default-project.yaml
