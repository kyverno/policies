name: appproject-restrict-source-namespaces-vpol
version: 1.0.0
displayName: Restrict AppProject Source Namespaces in CEL expressions
description: >-
  Argo CD's documentation says an AppProject must never grant access to the control-plane namespace (argocd) through spec.sourceNamespaces, and that privileged projects such as default must not list user-controlled namespaces. This policy rejects any entry that Argo CD would match against argocd, including * and patterns such as argo* or /^argo/, and any spec.sourceNamespaces on the default AppProject. The field matters only when Applications in any namespace is enabled. See https://argo-cd.readthedocs.io/en/stable/operator-manual/app-any-namespace/. If Argo CD runs in another namespace, change the controlPlaneNamespace variable.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/appproject-restrict-source-namespaces/appproject-restrict-source-namespaces.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  Argo CD's documentation says an AppProject must never grant access to the control-plane namespace (argocd) through spec.sourceNamespaces, and that privileged projects such as default must not list user-controlled namespaces. This policy rejects any entry that Argo CD would match against argocd, including * and patterns such as argo* or /^argo/, and any spec.sourceNamespaces on the default AppProject. The field matters only when Applications in any namespace is enabled. See https://argo-cd.readthedocs.io/en/stable/operator-manual/app-any-namespace/. If Argo CD runs in another namespace, change the controlPlaneNamespace variable.

  ### Matching behavior

  - Patterns such as `team-*` and names such as `argocd-tenants` are allowed,
    because they never match `argocd`.
  - Backslashes in glob entries are ignored, so an escaped glob character
    such as `argo\*` counts as a wildcard and is rejected.
  - Commas are literal in entries without braces, as in Argo CD. In entries
    with braces, every comma counts as an alternative, so an entry such as
    `{team-one,team-two},argocd` is rejected even though Argo CD doesn't
    match it against `argocd`.
  - Kyverno evaluates regular expressions with RE2, and Argo CD uses a
    different regular expression engine. An entry that RE2 can't compile,
    such as one with a lookahead, makes the policy return an error instead of
    a pass. In `Audit` mode, the error is only reported. In `Deny` mode, the
    default `failurePolicy: Fail` rejects the AppProject, even when the entry
    doesn't match the control-plane namespace.

  ### What the policy doesn't cover

  - Applications in the control-plane namespace can use any AppProject,
    whatever spec.sourceNamespaces says, so the main risk is a broad entry
    that lets tenant namespaces use a privileged AppProject. This policy
    blocks entries that match the control-plane namespace, such as `*`, but
    not every broad pattern. For example, `*-*` doesn't match `argocd`, so
    the policy allows it.
  - spec.sourceNamespaces has an effect only when Argo CD is configured to
    accept Applications or ApplicationSets from other namespaces.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Argo in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "AppProject"
