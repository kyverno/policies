apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: good-list
spec:
  generators:
  - list:
      elements:
      - name: one
  template:
    metadata:
      name: '{{name}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/apps.git
        targetRevision: HEAD
        path: guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: guestbook
