apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: good-git-matrix
spec:
  generators:
  - matrix:
      generators:
      - git:
          repoURL: https://github.com/example/apps.git
          revision: HEAD
          directories:
          - path: apps/*
      - list:
          elements:
          - name: one
  template:
    metadata:
      name: '{{name}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/apps.git
        targetRevision: HEAD
        path: guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: guestbook
