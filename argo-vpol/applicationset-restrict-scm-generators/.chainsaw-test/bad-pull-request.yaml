apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bad-pull-request
spec:
  generators:
  - pullRequest:
      github:
        owner: example
        repo: apps
  template:
    metadata:
      name: '{{name}}-app'
    spec:
      project: default
      source:
        repoURL: https://github.com/example/apps.git
        targetRevision: HEAD
        path: guestbook
      destination:
        server: https://kubernetes.default.svc
        namespace: guestbook
