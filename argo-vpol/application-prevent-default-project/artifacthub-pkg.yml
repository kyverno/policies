name: application-prevent-default-project-vpol
version: 1.0.0
displayName: Prevent Use of Default Project in CEL expressions
description: >-
  This policy prevents the use of the default project in an Application.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/application-prevent-default-project/application-prevent-default-project.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  This policy prevents the use of the default project in an Application.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `application-prevent-default-project` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts project names in `spec.allowedValues`. Use `default` to
  exempt the default-project restriction for the matched Application; missing
  or empty project names are also treated as `default`. Other Applications
  remain checked normally. Applications must still satisfy their CRD schema.
  `variables.canonicalProject` supplies that normalized project name, while
  `variables.allowedProjects` reads `exceptions.allowedValues` from matching
  exceptions. The validation allows `default` only when that normalized value
  is in the allowed project list; unrelated allowed values do not exempt it.
  See the [tested example](https://github.com/kyverno/policies/blob/main/argo-vpol/application-prevent-default-project/.chainsaw-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Argo in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "Application"
