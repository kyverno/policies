apiVersion: batch/v1
kind: CronJob
metadata:
  name: addcronjob01
spec:
  schedule: "*/1 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            autoscaling.cast.ai/removal-disabled: "true"
        spec:
          nodeSelector:
            kyverno.io/chainsaw-never-schedule: "true"
          containers:
          - name: hello
            image: busybox
            args:
            - /bin/sh
            - -c
            - date; echo Hello from the Kubernetes cluster
          restartPolicy: OnFailure