apiVersion: batch/v1
kind: Job
metadata:
  name: addjob01
spec:
  template:
    metadata:
      labels:
        autoscaling.cast.ai/removal-disabled: "true"
    spec:
      nodeSelector:
        kyverno.io/chainsaw-never-schedule: "true"
      containers:
      - name: pi
        image: perl
        command: ["perl",  "-Mbignum=bpi", "-wle", "print bpi(2000)"]
      restartPolicy: Never
  backoffLimit: 4