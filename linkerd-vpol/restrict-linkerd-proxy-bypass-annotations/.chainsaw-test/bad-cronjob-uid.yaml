apiVersion: batch/v1
kind: CronJob
metadata:
  name: bad-cronjob-uid
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 2102
          containers:
          - name: app
            image: busybox:1.37
            imagePullPolicy: IfNotPresent
            command: ["true"]
