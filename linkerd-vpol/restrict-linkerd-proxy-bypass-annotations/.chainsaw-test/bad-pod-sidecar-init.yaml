# A sidecar init container keeps running next to the app.
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-sidecar-init
spec:
  initContainers:
  - name: log-shipper
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    restartPolicy: Always
    command: [sleep, "3600"]
    securityContext:
      runAsUser: 2102
  containers:
  - name: app
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: [sleep, "3600"]
