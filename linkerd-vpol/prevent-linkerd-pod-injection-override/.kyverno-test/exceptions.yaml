apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: prevent-linkerd-pod-injection-override-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: prevent-linkerd-pod-injection-override
  matchConditions:
  - name: exact-resource
    expression: request.namespace == 'default' && request.name == 'badpod01'
