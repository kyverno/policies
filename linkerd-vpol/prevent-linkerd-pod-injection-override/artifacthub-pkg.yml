name: prevent-linkerd-pod-injection-override-vpol
version: 1.0.0
displayName: Prevent Linkerd Pod Injection Override in CEL expressions
description: >-
  Setting the annotation on a Pod (or its controller) `linkerd.io/inject` to `disabled` may effectively disable mesh participation for that workload reducing security and visibility. This policy prevents setting the annotation `linkerd.io/inject` to `disabled` for Pods.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/linkerd-vpol/prevent-linkerd-pod-injection-override/prevent-linkerd-pod-injection-override.yaml
  ```
keywords:
  - kyverno
  - Linkerd
  - CEL Expressions
readme: |
  Setting the annotation on a Pod (or its controller) `linkerd.io/inject` to `disabled` may effectively disable mesh participation for that workload reducing security and visibility. This policy prevents setting the annotation `linkerd.io/inject` to `disabled` for Pods.

  The policy checks Pods and the Pod templates of Deployments, DaemonSets, StatefulSets, ReplicaSets, ReplicationControllers, Jobs, and CronJobs.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `prevent-linkerd-pod-injection-override` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/linkerd-vpol/prevent-linkerd-pod-injection-override/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Linkerd in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "Pod"
