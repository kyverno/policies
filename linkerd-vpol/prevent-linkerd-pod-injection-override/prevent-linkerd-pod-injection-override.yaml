apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prevent-linkerd-pod-injection-override
  annotations:
    policies.kyverno.io/title: Prevent Linkerd Pod Injection Override in CEL expressions
    policies.kyverno.io/category: Linkerd in CEL
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Setting the annotation on a Pod (or its controller) `linkerd.io/inject` to
      `disabled` may effectively disable mesh participation for that workload reducing
      security and visibility. This policy prevents setting the annotation `linkerd.io/inject`
      to `disabled` for Pods.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, daemonsets, statefulsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    # Annotations of the Pod, or of the Pod template for Pod controllers.
    - name: annotations
      expression: >-
        object.kind == 'Pod' ? object.metadata.?annotations.orValue({}) :
        object.kind == 'CronJob' ? object.spec.?jobTemplate.?spec.?template.?metadata.?annotations.orValue({}) :
        object.spec.?template.?metadata.?annotations.orValue({})
    # Path to the Pod template, or '' for Pods.
    - name: prefix
      expression: >-
        object.kind == 'Pod' ? '' :
        object.kind == 'CronJob' ? 'spec.jobTemplate.spec.template.' : 'spec.template.'
  validations:
    - expression: "variables.annotations[?'linkerd.io/inject'].orValue('') != 'disabled'"
      messageExpression: >-
        'Pods may not disable sidecar injection. Remove linkerd.io/inject: disabled
        from ' + variables.prefix + 'metadata.annotations.'
