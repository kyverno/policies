name: check-linkerd-authorizationpolicy-vpol
version: 1.0.0
displayName: Check Linkerd AuthorizationPolicy in CEL expressions
description: >-
  As of Linkerd 2.12, an AuthorizationPolicy is a resource used to selectively allow traffic to either a Server or HTTPRoute resource. Creating AuthorizationPolicies is needed when a Server exists in order to control what traffic is permitted within the mesh to the Pods selected by the Server or HTTPRoute. This policy, requiring Linkerd 2.12+, checks incoming AuthorizationPolicy resources to ensure that either a matching Server or HTTPRoute exists first.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/linkerd-vpol/check-linkerd-authorizationpolicy/check-linkerd-authorizationpolicy.yaml
  ```
keywords:
  - kyverno
  - Linkerd
  - CEL Expressions
readme: |
  As of Linkerd 2.12, an AuthorizationPolicy is a resource used to selectively allow traffic to either a Server or HTTPRoute resource. Creating AuthorizationPolicies is needed when a Server exists in order to control what traffic is permitted within the mesh to the Pods selected by the Server or HTTPRoute. This policy, requiring Linkerd 2.12+, checks incoming AuthorizationPolicy resources to ensure that either a matching Server or HTTPRoute exists first.

  ### Required permissions

  The policy lists `servers` and `httproutes` in the `policy.linkerd.io/v1beta1` API. Grant `get`, `list`, and `watch` on `authorizationpolicies`, `servers`, and `httproutes` in `policy.linkerd.io` to the Kyverno admission and reports controllers, with ClusterRoles labeled `rbac.kyverno.io/aggregate-to-admission-controller: "true"` and `rbac.kyverno.io/aggregate-to-reports-controller: "true"`. See the [tested example](https://github.com/kyverno/policies/blob/main/linkerd-vpol/check-linkerd-authorizationpolicy/.chainsaw-test/rbac.yaml).

  ### Clusters without Linkerd

  The policy lists `servers` and `httproutes` in `policy.linkerd.io/v1beta1` through the Kubernetes API. If the Linkerd CRDs aren't installed, these lists fail, and the policy reports an error for every AuthorizationPolicy instead of a pass or a fail. Install it only on clusters that run Linkerd.

  ### Limitations

  The policy compares only `spec.targetRef.name` with the names of the Servers and HTTPRoutes in the Namespace, like the original policy. It doesn't check `spec.targetRef.kind`, and it rejects an AuthorizationPolicy that targets a Namespace or a Gateway API HTTPRoute.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-linkerd-authorizationpolicy` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/linkerd-vpol/check-linkerd-authorizationpolicy/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
