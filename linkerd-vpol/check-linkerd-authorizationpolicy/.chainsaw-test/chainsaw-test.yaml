# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: check-linkerd-authorizationpolicy
spec:
  template: false
  steps:
    - name: step-00
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: step-01
      try:
        - apply:
            file: ../check-linkerd-authorizationpolicy.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: check-linkerd-authorizationpolicy
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-02
      try:
        - apply:
            file: server.yaml
        - apply:
            file: http-route.yaml
    - name: step-03
      try:
        - apply:
            file: good-authz.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy check-linkerd-authorizationpolicy failed')): true
            file: bad-authz.yaml
