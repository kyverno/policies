apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-linkerd-mesh-injection
  annotations:
    policies.kyverno.io/title: Require Linkerd Mesh Injection in CEL expressions
    policies.kyverno.io/category: Linkerd in CEL
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/subject: Namespace, Annotation
    policies.kyverno.io/description: >-
      Sidecar proxy injection in Linkerd may be handled at the Namespace level by
      setting the annotation `linkerd.io/inject` to `enabled`. This policy enforces that
      all Namespaces contain the annotation `linkerd.io/inject` set to `enabled`.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  variables:
    - name: inject
      expression: "object.metadata.?annotations[?'linkerd.io/inject'].orValue('')"
  validations:
    - expression: variables.inject == 'enabled'
      messageExpression: >-
        'All Namespaces must set the annotation `linkerd.io/inject` to `enabled`. ' +
        (variables.inject == '' ? 'The annotation is not set.' :
        'It is set to `' + variables.inject + '`.')
