name: cleanup-disabled-configmaps
version: 1.0.0
displayName: Cleanup ConfigMaps with a Namespace Switch
createdAt: "2026-11-03T00:00:00Z"
description: >-
  Demonstrate a resource lookup during scheduled cleanup. Delete ConfigMaps
  labeled cleanup.example.com/temporary=true only if a cleanup-settings
  ConfigMap in the same namespace has data.enabled set to "true".
  The settings ConfigMap itself is always retained. A missing settings
  ConfigMap produces an evaluation error and does not authorize deletion.
  Grant the cleanup controller ConfigMap permissions using the accompanying RBAC.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-disabled-configmaps/cleanup-disabled-configmaps.yaml
  ```
keywords:
- kyverno
- Cleanup
readme: |
  Demonstrate a resource lookup during scheduled cleanup. Delete ConfigMaps
  labeled cleanup.example.com/temporary=true only if a cleanup-settings
  ConfigMap in the same namespace has data.enabled set to "true".
  The settings ConfigMap itself is always retained. A missing settings
  ConfigMap produces an evaluation error and does not authorize deletion.
  Grant the cleanup controller ConfigMap permissions using the accompanying RBAC.

  Requires Kyverno 1.20 (main). Before installing, apply
  https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-disabled-configmaps/rbac.yaml
  to grant the cleanup controller the required permissions.
  Only trusted administrators should be able to enable the namespace switch.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: Cleanup
  kyverno/subject: ConfigMap
