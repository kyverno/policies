name: clean-bare-pods
version: 1.0.0
displayName: Cleanup Bare Pods
createdAt: "2023-12-14T13:35:28.000Z"
description: >-
  A bare Pod is any Pod created directly and not owned by a controller such as a Deployment or Job. Bare Pods are often create manually by users in an attempt to troubleshoot an issue. If left in the cluster, they create clutter, increase cost, and can be a security risk. Bare Pods can be cleaned up periodically through use of a policy. This policy finds and removes all bare Pods across the cluster.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-bare-pods/cleanup-bare-pods.yaml
  ```
keywords:
  - kyverno
  - cleanup
  - pod
readme: |
  A bare Pod is any Pod created directly and not owned by a controller such as a Deployment or Job. Bare Pods are often create manually by users in an attempt to troubleshoot an issue. If left in the cluster, they create clutter, increase cost, and can be a security risk. Bare Pods can be cleaned up periodically through use of a policy. This policy finds and removes all bare Pods across the cluster.
  
  ### PolicyException availability

  The released cleanup controller does not currently consume
  `PolicyException` resources for the `DeletingPolicy` named `clean-bare-pods`. Do not rely
  on an exception to suppress its deletions; this policy behaves the same when
  PolicyException support is disabled or enabled for the other controllers.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.27"
  kyverno/subject: "Pod"
