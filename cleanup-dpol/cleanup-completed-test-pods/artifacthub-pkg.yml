name: cleanup-completed-test-pods
version: 1.0.0
displayName: Cleanup Completed Test Pods
createdAt: "2026-11-03T00:00:00Z"
description: >-
  Delete terminal, controllerless Pods every minute, but only when both the
  Pod and its namespace opt in with cleanup.example.com/enabled=true.
  Running Pods and Pods managed by a Job or another owner are preserved.
  Grant the cleanup controller Pod list, watch, get, and delete permissions
  using the accompanying RBAC.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-completed-test-pods/cleanup-completed-test-pods.yaml
  ```
keywords:
- kyverno
- Cleanup
readme: |
  Delete terminal, controllerless Pods every minute, but only when both the
  Pod and its namespace opt in with cleanup.example.com/enabled=true.
  Running Pods and Pods managed by a Job or another owner are preserved.
  Grant the cleanup controller Pod list, watch, get, and delete permissions
  using the accompanying RBAC.

  Requires Kyverno 1.20 (main). Before installing, apply
  https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-completed-test-pods/rbac.yaml
  to grant the cleanup controller the required permissions.
  CLI tests supply namespace labels through a Value fixture.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: Cleanup
  kyverno/subject: Pod
