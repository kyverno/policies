apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cleanup-completed-test-pods
spec:
  steps:
  - name: create-opted-in-and-protected-pods
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cleanup-test
            labels:
              cleanup.example.com/enabled: "true"
    - apply:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: production
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: cleanup-test
            labels:
              cleanup.example.com/enabled: "true"
          spec:
            restartPolicy: Never
            containers:
            - name: task
              image: public.ecr.aws/docker/library/busybox:1.36
              command: [sh, -c, "exit 0"]
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: running
            namespace: cleanup-test
            labels:
              cleanup.example.com/enabled: "true"
          spec:
            containers:
            - name: task
              image: public.ecr.aws/docker/library/busybox:1.36
              command: [sleep, "3600"]
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: production
            labels:
              cleanup.example.com/enabled: "true"
          spec:
            restartPolicy: Never
            containers:
            - name: task
              image: public.ecr.aws/docker/library/busybox:1.36
              command: [sh, -c, "exit 0"]
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: cleanup-test
          status:
            phase: Succeeded
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: production
          status:
            phase: Succeeded
    - apply:
        file: ../rbac.yaml
    - apply:
        file: ../cleanup-completed-test-pods.yaml
  - name: delete-only-opted-in-terminal-pods
    try:
    - error:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: cleanup-test
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: running
            namespace: cleanup-test
          status:
            phase: Running
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: completed
            namespace: production
          status:
            phase: Succeeded
