name: cleanup-expired-configmaps
version: 1.0.0
displayName: Cleanup Expired ConfigMaps
createdAt: "2026-11-03T00:00:00Z"
description: >-
  Every minute, delete ConfigMaps explicitly labeled
  cleanup.example.com/enabled=true whose cleanup.example.com/expires-at
  annotation is an RFC3339 timestamp in the past. Unlabeled ConfigMaps and
  ConfigMaps without an expiration are retained. Invalid timestamps cause
  evaluation errors, not deletion. Grant the cleanup controller ConfigMap
  list, watch, get, and delete permissions using the accompanying RBAC.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-expired-configmaps/rbac.yaml
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-expired-configmaps/cleanup-expired-configmaps.yaml
  ```
keywords:
- kyverno
- Cleanup
readme: |
  Every minute, delete ConfigMaps explicitly labeled
  cleanup.example.com/enabled=true whose cleanup.example.com/expires-at
  annotation is an RFC3339 timestamp in the past. Unlabeled ConfigMaps and
  ConfigMaps without an expiration are retained. Invalid timestamps cause
  evaluation errors, not deletion. Grant the cleanup controller ConfigMap
  list, watch, get, and delete permissions using the accompanying RBAC.

  Requires Kyverno 1.20 (main). Before installing, apply
  https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-expired-configmaps/rbac.yaml
  to grant the cleanup controller the required permissions.
  DeletingPolicy test results use pass for deletion candidates and fail for retained resources.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: Cleanup
  kyverno/subject: ConfigMap
