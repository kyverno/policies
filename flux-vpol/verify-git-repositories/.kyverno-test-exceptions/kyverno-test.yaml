apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-git-repositories-exceptions
policies:
- ../verify-git-repositories.yaml
resources:
- ../.chainsaw-test/resources-exceptions.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-git-repositories
  resources:
  - git-exception-good
  result: pass
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-git-repositories
  resources:
  - git-exception-sibling
  - git-exception-prefix-bypass
  result: fail
