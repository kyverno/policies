apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-git-repositories
policies:
- ../verify-git-repositories.yaml
resources:
- ../.chainsaw-test/resources.yaml
results:
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-git-repositories
  resources:
  - git-good-https
  - git-good-ssh
  - git-good-case
  - git-good-v1beta2
  - git-good-wildcard
  result: pass
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-git-repositories
  resources:
  - git-bad
  - git-host-bypass
  - git-path-bypass
  - git-wildcard-apex
  - git-dot-segment
  - git-repeated-slash
  - git-userinfo
  - git-scp-style
  - git-query
  - git-wrong-scheme
  - git-empty
  - git-exception-good
  - git-exception-sibling
  - git-exception-prefix-bypass
  result: fail
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-git-repositories
  resources:
  - git-system-excluded
  result: skip
