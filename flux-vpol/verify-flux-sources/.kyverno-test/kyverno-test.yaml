apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-flux-sources
policies:
- ../verify-flux-sources.yaml
resources:
- ../.chainsaw-test/resources.yaml
results:
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-flux-sources
  resources:
  - git-good-https
  - git-good-ssh
  - git-good-case
  - git-good-v1beta2
  result: pass
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-flux-sources
  resources:
  - git-bad
  - git-host-bypass
  - git-path-bypass
  - git-dot-segment
  - git-scp-style
  - git-query
  - git-wrong-scheme
  - git-empty
  - git-exception-good
  - git-exception-sibling
  - git-exception-prefix-bypass
  result: fail
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-flux-sources
  resources:
  - git-system-excluded
  result: skip
- isValidatingPolicy: true
  kind: Bucket
  policy: verify-flux-sources
  resources:
  - bucket-good
  result: pass
- isValidatingPolicy: true
  kind: Bucket
  policy: verify-flux-sources
  resources:
  - bucket-bad
  - bucket-path-bypass
  result: fail
- isValidatingPolicy: true
  kind: HelmRepository
  policy: verify-flux-sources
  resources:
  - helm-good
  result: pass
- isValidatingPolicy: true
  kind: HelmRepository
  policy: verify-flux-sources
  resources:
  - helm-bad
  result: fail
- isValidatingPolicy: true
  kind: OCIRepository
  policy: verify-flux-sources
  resources:
  - oci-good
  result: pass
- isValidatingPolicy: true
  kind: OCIRepository
  policy: verify-flux-sources
  resources:
  - oci-bad
  - oci-wrong-scheme
  result: fail
- isValidatingPolicy: true
  kind: ImageRepository
  policy: verify-flux-sources
  resources:
  - image-good
  result: pass
- isValidatingPolicy: true
  kind: ImageRepository
  policy: verify-flux-sources
  resources:
  - image-path-bypass
  - image-host-bypass
  - image-dot-segment
  - image-dotdot-segment
  - image-encoded-dot-segment
  - image-empty-segment
  result: fail
