# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-flux-sources
spec:
  template: false
  steps:
    - name: shared-test-namespaces
      skipDelete: true
      try:
        - apply:
            file: policy-exceptions-namespace.yaml
        - apply:
            file: flux-system-namespace.yaml
    - name: install-missing-oci-repository-crd
      try:
        - apply:
            file: oci-repository-crd.yaml
        - assert:
            file: oci-crd-ready.yaml
    - name: install-policy
      try:
        - apply:
            file: rbac.yaml
        - apply:
            file: ../verify-flux-sources.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: verify-flux-sources
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: allow-trusted-sources-and-flux-system-exclusion
      try:
        - apply:
            file: good-resources.yaml
    - name: reject-untrusted-prefixes
      try:
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: bad-git.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: bad-bucket.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: bad-helm.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: bad-oci.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: bad-image.yaml
    - name: exact-exception-token
      try:
        - apply:
            file: policy-exception.yaml
        - script:
            content: |
              set -eu
              for attempt in $(seq 1 30); do
                if kubectl create --dry-run=server -f git-exception-good.yaml -o name >/dev/null 2>&1 \
                  && kubectl create --dry-run=server -f image-exception-good.yaml -o name >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 1
              done
              echo 'verify-flux-sources PolicyException did not become active' >&2
              exit 1
        - apply:
            file: git-exception-good.yaml
        - apply:
            file: image-exception-good.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: git-exception-prefix-bypass.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: git-exception-sibling.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy verify-flux-sources failed') && contains($error, 'must use an allowed host and path prefix')): true
            file: image-exception-dot-segment.yaml
