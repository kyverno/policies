apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:aggregate-to-admission-controller:flux-verify-flux-sources
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, buckets, helmrepositories, ocirepositories]
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:aggregate-to-reports-controller:flux-verify-flux-sources
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, buckets, helmrepositories, ocirepositories]
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagerepositories]
    verbs: [get, list, watch]
