apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-flux-sources-exceptions
policies:
- ../verify-flux-sources.yaml
resources:
- ../.chainsaw-test/exceptions.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-flux-sources
  resources:
  - git-exception-good
  result: pass
- isValidatingPolicy: true
  kind: GitRepository
  policy: verify-flux-sources
  resources:
  - git-exception-sibling
  - git-exception-prefix-bypass
  result: fail
- isValidatingPolicy: true
  kind: ImageRepository
  policy: verify-flux-sources
  resources:
  - image-exception-good
  result: pass
- isValidatingPolicy: true
  kind: ImageRepository
  policy: verify-flux-sources
  resources:
  - image-exception-dot-segment
  result: fail
