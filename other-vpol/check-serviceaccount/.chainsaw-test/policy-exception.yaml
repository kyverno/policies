apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: serviceaccount-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: check-sa
  matchConditions:
  - name: target-namespace
    expression: request.namespace == 'check-sa-ns'
  - name: target-name
    expression: request.name == 'badpod01'
  allowedValues:
  - serviceAccount:check-sa-ns/safe
