name: check-serviceaccount
version: 1.0.0
displayName: Check ServiceAccount
description: >-
  ServiceAccounts with privileges to create Pods may be able to do so and name a ServiceAccount other than the one used to create it. This policy checks the Pod, if created by a ServiceAccount, and ensures the `serviceAccountName` field matches the actual ServiceAccount.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/check-serviceaccount/check-serviceaccount.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  ServiceAccounts with privileges to create Pods may be able to do so and name a ServiceAccount other than the one used to create it. This policy checks the Pod, if created by a ServiceAccount, and ensures the `serviceAccountName` field matches the actual ServiceAccount.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-sa` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `serviceAccount:<namespace>/<name>` in `spec.allowedValues` for the requesting
  ServiceAccount, not the Pod's target ServiceAccount, to allow an identity mismatch for
  the matched request. CEL consumes `spec.allowedValues` as `exceptions.allowedValues`;
  unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/check-serviceaccount/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod,ServiceAccount"
