apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: check-sa-exceptions
policies:
- ../check-serviceaccount.yaml
resources:
- resource.yaml
- sibling-resource.yaml
userinfo: ../.kyverno-test/userinfo.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: check-sa
  resources:
  - exception-pod
  result: pass
- isValidatingPolicy: true
  kind: Pod
  policy: check-sa
  resources:
  - exception-sibling-ns/exception-pod-sibling
  result: fail
