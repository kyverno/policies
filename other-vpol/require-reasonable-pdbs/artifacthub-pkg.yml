name: require-reasonable-pdbs-vpol
version: 1.0.0
displayName: Require Reasonable PodDisruptionBudgets in ValidatingPolicy
description: >-
  PodDisruptionBudgets that use percentage values must keep the cluster reasonably available. minAvailable as a percentage must be 1%–50% and maxUnavailable as a percentage must be 50%–100%. A missing field defaults to 50%. Integer-only PDBs are skipped.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-reasonable-pdbs/require-reasonable-pdbs.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  PodDisruptionBudgets that use percentage values must keep the cluster reasonably available. minAvailable as a percentage must be 1%–50% and maxUnavailable as a percentage must be 50%–100%. A missing field defaults to 50%. Integer-only PDBs are skipped.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "PodDisruptionBudget"
