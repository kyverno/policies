apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: prevent-duplicate-vpa
  annotations:
    policies.kyverno.io/title: Prevent Duplicate VerticalPodAutoscalers in ValidatingPolicy
    policies.kyverno.io/category: Other in Vpol
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.37"
    policies.kyverno.io/subject: VerticalPodAutoscaler
    policies.kyverno.io/description: >-
      VerticalPodAutoscaler (VPA) is useful to automatically adjust the resources assigned to Pods.
      It requires defining a specific target resource by kind and name. There are no built-in
      validation checks by the VPA controller to prevent the creation of multiple VPAs which target
      the same resource. This policy has two checks, the first of which ensures that the only targetRef
      kinds accepted are one of either Deployment, StatefulSet, ReplicaSet, or DaemonSet. The second
      prevents the creation of duplicate VPAs by validating that any new VPA targets a resource
      which no other VPA in the same Namespace already targets.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      # The legacy policy matched the kind in every version, so every served version
      # (v1 and the deprecated v1beta2) is matched here.
      - apiGroups: ["autoscaling.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["verticalpodautoscalers"]
  variables:
    - name: allowedKinds
      expression: "['Deployment', 'StatefulSet', 'ReplicaSet', 'DaemonSet']"
    - name: targetKind
      expression: "object.?spec.?targetRef.?kind.orValue('')"
    - name: targetName
      expression: "object.?spec.?targetRef.?name.orValue('')"
    # There is no orValue on this list on purpose. If the list call fails or is forbidden,
    # the policy reports an error, which blocks the request in Deny mode, instead of reading
    # an empty list and letting a duplicate through.
    - name: existingVPAs
      expression: >-
        dyn(resource.List('autoscaling.k8s.io/v1', 'verticalpodautoscalers', request.namespace).items)
  validations:
    - message: >-
        The target kind must be specified exactly as Deployment, StatefulSet, ReplicaSet, or DaemonSet.
      expression: "variables.targetKind in variables.allowedKinds"
    # A VPA is never a duplicate of itself. The offline CLI lists the VPA under test along with
    # the cluster resources, and on a cluster a VPA with the same name cannot already exist.
    - messageExpression: >-
        'The target ' + variables.targetKind + ' named ' + variables.targetName +
        ' already has an existing VPA configured for it. Duplicate VPAs are not allowed.'
      expression: >-
        !(variables.targetKind in variables.allowedKinds) ||
        !variables.existingVPAs.exists(vpa,
          vpa.metadata.name != object.metadata.name &&
          vpa.?spec.?targetRef.?kind.orValue('') == variables.targetKind &&
          vpa.?spec.?targetRef.?name.orValue('') == variables.targetName)
