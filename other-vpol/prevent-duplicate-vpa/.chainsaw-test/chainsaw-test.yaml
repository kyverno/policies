# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: prevent-duplicate-vpa
spec:
  template: false
  steps:
    - name: step-01
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
        - assert:
            file: rbac-assert.yaml
    - name: step-02
      try:
        - apply:
            file: ../prevent-duplicate-vpa.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: prevent-duplicate-vpa
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-03
      try:
        - apply:
            file: existing-vpas.yaml
    - name: step-04
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
                  (contains($error || '', 'Policy prevent-duplicate-vpa failed')): true
                  (contains($error || '', 'already has an existing VPA configured for it')): true
            file: bad-duplicate-vpas.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
                  (contains($error || '', 'Policy prevent-duplicate-vpa failed')): true
                  (contains($error || '', 'must be specified exactly as Deployment, StatefulSet, ReplicaSet, or DaemonSet')): true
            file: bad-kind-vpas.yaml
    - name: step-05
      try:
        - apply:
            file: good-vpas.yaml
