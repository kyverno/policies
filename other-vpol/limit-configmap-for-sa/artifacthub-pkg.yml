name: limit-configmap-for-sa
version: 1.0.0
displayName: Limit ConfigMap for ServiceAccount
description: >-
  Restricts operations on selected ConfigMaps based on the requesting ServiceAccount and request attributes.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/limit-configmap-for-sa/limit-configmap-for-sa.yaml
  ```
keywords:
  - kyverno
  - Security
  - ValidatingPolicy
readme: |
  Restricts operations on selected ConfigMaps based on the requesting ServiceAccount and request attributes.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `limit-configmap-for-sa` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `serviceAccount:<request-username>` in `spec.allowedValues`, for example
  `serviceAccount:system:serviceaccount:default:builder`, to permit that ServiceAccount's
  matched ConfigMap request. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/limit-configmap-for-sa/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "ConfigMap"
