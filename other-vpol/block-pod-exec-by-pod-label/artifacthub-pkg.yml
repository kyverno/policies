name: block-pod-exec-by-pod-label
version: 1.0.0
displayName: Block Pod Exec by Pod Label in ValidatingPolicy
description: >-
  The `exec` command may be used to gain shell access, or run other commands, in a Pod's container. While this can be useful for troubleshooting purposes, it could represent an attack vector and is discouraged. This policy blocks Pod exec commands to Pods having the label `exec=false`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-pod-exec-by-pod-label/block-pod-exec-by-pod-label.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  The `exec` command may be used to gain shell access, or run other commands, in a Pod's container. While this can be useful for troubleshooting purposes, it could represent an attack vector and is discouraged. This policy blocks Pod exec commands to Pods having the label `exec=false`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `deny-exec-by-pod-label` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `pod.exec:<namespace>:<pod-name>` in `spec.allowedValues` to allow exec only for
  that Pod despite its exec label. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-pod-exec-by-pod-label/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample"
  kyverno/subject: "Pod"
