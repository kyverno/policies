apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-imagepullsecrets
  annotations:
    policies.kyverno.io/title: Require Image Pull Secrets in ValidatingPolicy
    policies.kyverno.io/category: Other in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container images pulled from private registries require credentials.
      This policy audits Pods whose containers use images not from ghcr.io or
      quay.io but do not define at least one imagePullSecret with a non-empty name.
      Only spec.containers is checked; init and ephemeral containers are exempt.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods"]
  validations:
  - expression: >-
      object.spec.containers.all(container,
        container.image.startsWith('ghcr.io/') ||
        container.image.startsWith('quay.io/') ||
        object.spec.?imagePullSecrets.orValue([]).exists(s, s.name != ''))
    message: >-
      Pods using images from registries other than ghcr.io or quay.io must
      specify imagePullSecrets with a non-empty name.

