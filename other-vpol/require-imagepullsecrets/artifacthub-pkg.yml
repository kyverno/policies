name: require-imagepullsecrets-vpol
version: 1.0.0
displayName: Require Image Pull Secrets in ValidatingPolicy
description: >-
  Container images pulled from private registries require credentials. This policy audits Pods whose containers use images not from ghcr.io or quay.io but do not define at least one imagePullSecret with a non-empty name. Only spec.containers is checked; init and ephemeral containers are exempt.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-imagepullsecrets/require-imagepullsecrets.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Container images pulled from private registries require credentials. This policy audits Pods whose containers use images not from ghcr.io or quay.io but do not define at least one imagePullSecret with a non-empty name. Only spec.containers is checked; init and ephemeral containers are exempt.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
