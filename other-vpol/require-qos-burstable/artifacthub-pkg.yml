name: require-qos-burstable-vpol
version: 1.0.0
displayName: Require QoS Burstable in ValidatingPolicy
description: >-
  Pod Quality of Service (QoS) is a mechanism to ensure Pods receive certain priority guarantees based upon the resources they define. When a Pod has at least one container which defines either requests or limits for either memory or CPU, Kubernetes grants the QoS class as burstable if it does not otherwise qualify for a QoS class of guaranteed. This policy requires that a Pod meet the criteria qualify for a QoS of burstable. This policy is provided with the intention that users will need to control its scope by using exclusions, preconditions, and other policy language mechanisms.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-qos-burstable/require-qos-burstable.yaml
  ```
keywords:
  - kyverno
  - Other
  - Multi-Tenancy
  - ValidatingPolicy
readme: |
  Pod Quality of Service (QoS) is a mechanism to ensure Pods receive certain priority guarantees based upon the resources they define. When a Pod has at least one container which defines either requests or limits for either memory or CPU, Kubernetes grants the QoS class as burstable if it does not otherwise qualify for a QoS class of guaranteed. This policy requires that a Pod meet the criteria qualify for a QoS of burstable. This policy is provided with the intention that users will need to control its scope by using exclusions, preconditions, and other policy language mechanisms.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-qos-burstable` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `qos.class:Guaranteed` or `qos.class:BestEffort` in `spec.allowedValues` to allow
  that computed alternative class. `variables.qosContainers` covers regular and init
  containers; `hasPositiveCPUOrMemory` and `isGuaranteed` determine `qosClass` from
  CPU/memory quantities, excluding ephemeral containers. CEL consumes `spec.allowedValues`
  as `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/require-qos-burstable/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other, Multi-Tenancy in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
