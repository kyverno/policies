name: check-nvidia-gpu
version: 1.0.0
displayName: Check NVIDIA GPUs
description: >-
  Containers which request use of an NVIDIA GPU often need to be authored to consume them via a CUDA environment variable called NVIDIA_VISIBLE_DEVICES. This policy checks the containers which request a GPU to ensure they have been authored with this environment variable.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/check-nvidia-gpu/check-nvidia-gpu.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Containers which request use of an NVIDIA GPU often need to be authored to consume them via a CUDA environment variable called NVIDIA_VISIBLE_DEVICES. This policy checks the containers which request a GPU to ensure they have been authored with this environment variable.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-nvidia-gpus` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact container image references in `spec.images` to bypass the NVIDIA GPU
  image check for those images. CEL consumes `spec.images` as
  `exceptions.allowedImages`; unlisted images remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/check-nvidia-gpu/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.23"
  kyverno/subject: "Pod"
