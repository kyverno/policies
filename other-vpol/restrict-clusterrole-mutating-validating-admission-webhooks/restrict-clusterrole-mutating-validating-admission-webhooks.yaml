apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-clusterrole-mutating-validating-admission-webhooks
  annotations:
    policies.kyverno.io/title: Restrict ClusterRole Admission Webhook Grants in ValidatingPolicy
    policies.kyverno.io/category: Sample in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ClusterRole, RBAC
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      ClusterRoles with create, update, or patch permissions over mutating or validating
      admission webhook configurations can change cluster-wide admission enforcement.
      This policy blocks those grants, including through RBAC wildcards. Aggregated
      ClusterRoles are rejected because their effective rules are controller-generated.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["clusterroles"]
  variables:
    - name: rules
      expression: "object.?rules.orValue(null)"
    - name: webhookResources
      expression: "['mutatingwebhookconfigurations', 'validatingwebhookconfigurations']"
  validations:
    - expression: >-
        variables.rules == null || !variables.rules.exists(rule,
          rule.?apiGroups.orValue([]) != null && rule.?apiGroups.orValue([]).exists(apiGroup, apiGroup in ['*', 'admissionregistration.k8s.io']) &&
          rule.?resources.orValue([]) != null && rule.?resources.orValue([]).exists(resource,
            (resource == '*' || resource in variables.webhookResources) &&
            variables.webhookResources.exists(webhookResource,
              (resource == '*' || resource == webhookResource) &&
              rule.?verbs.orValue([]) != null && rule.?verbs.orValue([]).exists(verb,
                verb in ['*', 'create', 'update', 'patch'] &&
                !('webhook:' + webhookResource + ':' + verb in exceptions.allowedValues)))))
      message: "ClusterRoles must not grant create, update, or patch access to admission webhook configurations."
    - expression: "!has(object.aggregationRule) || object.aggregationRule == null"
      message: "Aggregated ClusterRoles are not allowed because their effective rules are controller-generated."
