name: require-minimum-tls-version-vpol
version: 1.0.0
displayName: Require Minimum TLS Version
description: >-
  TLS 1.0 and 1.1 are deprecated and contain known vulnerabilities. TLS 1.3 is required as a prerequisite for post-quantum cryptography (PQC) key exchange as mandated by NIST IR 8547 and NSA CNSA 2.0. This policy ensures that Ingress resources with TLS configured do not permit deprecated TLS protocol versions via the nginx ingress ssl-protocols annotation.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-minimum-tls-version/require-minimum-tls-version.yaml
  ```
keywords:
  - kyverno
  - Security
  - ValidatingPolicy
  - TLS
readme: |
  TLS 1.0 and 1.1 are deprecated and contain known vulnerabilities. TLS 1.3 is required as a prerequisite for post-quantum cryptography (PQC) key exchange as mandated by NIST IR 8547 and NSA CNSA 2.0. This policy ensures that Ingress resources with TLS configured do not permit deprecated TLS protocol versions via the nginx ingress ssl-protocols annotation.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Ingress"
