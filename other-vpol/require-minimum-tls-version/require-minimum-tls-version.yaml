apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-minimum-tls-version
  annotations:
    policies.kyverno.io/title: Require Minimum TLS Version
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      TLS 1.0 and 1.1 are deprecated and contain known vulnerabilities, and TLS 1.3
      is a prerequisite for post-quantum cryptography (PQC) hybrid key exchange as
      called for by NIST IR 8547 and NSA CNSA 2.0. ingress-nginx sets the TLS
      protocol versions for all Ingresses it serves through the `ssl-protocols` key
      of its controller ConfigMap; there is no per-Ingress annotation for it. This
      policy checks any ConfigMap that sets `ssl-protocols` and requires that TLSv1.3
      is enabled and that SSLv2, SSLv3, TLSv1 and TLSv1.1 are not. When the key is
      absent, ingress-nginx defaults to `TLSv1.2 TLSv1.3`, which is compliant.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["configmaps"]
  matchConditions:
    - name: sets-ssl-protocols
      expression: "has(object.data) && 'ssl-protocols' in object.data"
  variables:
    - name: protocols
      expression: "object.data['ssl-protocols'].split(' ').filter(p, p != '')"
  validations:
    - expression: >-
        !variables.protocols.exists(p, p in ['SSLv2', 'SSLv3', 'TLSv1', 'TLSv1.1'])
      message: >-
        ssl-protocols must not enable SSLv2, SSLv3, TLSv1 or TLSv1.1.
        Use "TLSv1.2 TLSv1.3" or "TLSv1.3".
    - expression: "'TLSv1.3' in variables.protocols"
      message: >-
        ssl-protocols must enable TLSv1.3, which is required for post-quantum
        (PQC) hybrid key exchange.
