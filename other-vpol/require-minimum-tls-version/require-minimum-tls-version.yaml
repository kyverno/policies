apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-minimum-tls-version
  annotations:
    policies.kyverno.io/title: Require Minimum TLS Version
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      TLS 1.0 and 1.1 are deprecated and contain known vulnerabilities. TLS 1.3
      is required as a prerequisite for post-quantum cryptography (PQC) key
      exchange as mandated by NIST IR 8547 and NSA CNSA 2.0. This policy ensures
      that Ingress resources with TLS configured do not permit deprecated TLS
      protocol versions via the nginx ingress ssl-protocols annotation.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:   ["networking.k8s.io"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["ingresses"]
  matchConditions:
    - name: has-tls
      expression: "object.spec.?tls.orValue([]).size() > 0"
  variables:
    - name: protocols
      expression: >-
        object.metadata.?annotations[?'nginx.ingress.kubernetes.io/ssl-protocols'].orValue('').split(' ')
  validations:
    - expression: >-
        !variables.protocols.exists(p, p in ['SSLv2', 'SSLv3', 'TLSv1', 'TLSv1.1'])
      message: >-
        Ingress resources must not permit TLS 1.0 or 1.1. Set the annotation
        nginx.ingress.kubernetes.io/ssl-protocols to include only TLSv1.2 or
        TLSv1.3 to comply with NIST IR 8547 and NSA CNSA 2.0.
