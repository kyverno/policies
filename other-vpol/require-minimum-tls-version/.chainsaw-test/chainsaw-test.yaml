# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-minimum-tls-version
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ../require-minimum-tls-version.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: require-minimum-tls-version
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep:
       duration: 10s
  - name: step-02
    try:
    - apply:
        file: configmap-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: configmap-bad-tls11.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: configmap-bad-tls10.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: configmap-bad-no-tls13.yaml
