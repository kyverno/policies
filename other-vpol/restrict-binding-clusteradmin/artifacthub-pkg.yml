name: restrict-binding-clusteradmin-vpol
version: 1.0.0
displayName: Restrict Binding to Cluster-Admin in ValidatingPolicy
description: >-
  The cluster-admin ClusterRole allows any action to be performed on any resource in the cluster and its granting should be heavily restricted. This policy prevents binding to the cluster-admin ClusterRole in RoleBinding or ClusterRoleBinding resources.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-binding-clusteradmin/restrict-binding-clusteradmin.yaml
  ```
keywords:
  - kyverno
  - Security
  - ValidatingPolicy
readme: |
  The cluster-admin ClusterRole allows any action to be performed on any resource in the cluster and its granting should be heavily restricted. This policy prevents binding to the cluster-admin ClusterRole in RoleBinding or ClusterRoleBinding resources.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-binding-clusteradmin` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `roleRef.name:cluster-admin` in `spec.allowedValues` to allow that role binding
  within the exception's resource scope. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-binding-clusteradmin/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "RoleBinding, ClusterRoleBinding, RBAC"
