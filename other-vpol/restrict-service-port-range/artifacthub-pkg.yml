name: restrict-service-port-range-vpol
version: 1.0.0
displayName: Restrict Service Port Range in ValidatingPolicy
description: >-
  Services which are allowed to expose any port number may be able to impact other applications running on the Node which require them, or may make specifying security policy externally more challenging. This policy enforces that only the port range 32000 to 33000 may be used for Service resources.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-service-port-range/restrict-service-port-range.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Services which are allowed to expose any port number may be able to impact other applications running on the Node which require them, or may make specifying security policy externally more challenging. This policy enforces that only the port range 32000 to 33000 may be used for Service resources.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-service-port-range` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List decimal Service ports as strings in `spec.allowedValues`, such as `"8080"`, to
  allow only those ports outside 32000–33000. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-service-port-range/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Service"
