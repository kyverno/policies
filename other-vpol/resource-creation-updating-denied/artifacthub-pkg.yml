displayName: Resource Creation and Updating Denied in ValidatingPolicy
description: >-
  To prevent disruption during peak hours, Deployment changes are denied between 08:00 and 10:59 UTC. Adjust startHour and endHour in the policy spec to change the maintenance window.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/resource-creation-updating-denied/resource-creation-updating-denied.yaml
  ```
