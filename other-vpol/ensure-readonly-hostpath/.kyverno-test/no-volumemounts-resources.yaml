# Containers without a volumeMounts field must be evaluated, not error (#1443).
apiVersion: v1
kind: Pod
metadata:
  name: good-init-no-volumemounts
spec:
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
    volumeMounts:
    - mountPath: /some/dir
      name: foo
      readOnly: true
  volumes:
  - name: foo
    hostPath:
      path: /var/log
---
apiVersion: v1
kind: Pod
metadata:
  name: good-hostpath-not-mounted
spec:
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
  volumes:
  - name: foo
    hostPath:
      path: /var/log
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-init-no-volumemounts
spec:
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
    volumeMounts:
    - mountPath: /some/dir
      name: foo
  volumes:
  - name: foo
    hostPath:
      path: /var/log
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goodstatefulset01
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:1.35
        volumeMounts:
        - mountPath: /some/dir
          name: foo
          readOnly: true
      initContainers:
      - name: busybox-init
        image: ghcr.io/kyverno/test-busybox:1.35
      volumes:
      - name: foo
        hostPath:
          path: /var/log
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: badstatefulset01
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:1.35
        volumeMounts:
        - mountPath: /some/dir
          name: foo
      initContainers:
      - name: busybox-init
        image: ghcr.io/kyverno/test-busybox:1.35
      volumes:
      - name: foo
        hostPath:
          path: /var/log
