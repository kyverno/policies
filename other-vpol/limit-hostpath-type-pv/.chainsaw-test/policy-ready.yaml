apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: limit-hostpath-type-pv
status:
  conditionStatus:
    # Background scanning is disabled for this policy, so Kyverno skips the
    # reports-controller RBAC check and reports Succeeded (kyverno/kyverno#16490).
    (conditions[?type == 'RBACPermissionsGranted']):
    - reason: Succeeded
      status: "True"
    (conditions[?type == 'WebhookConfigured']):
    - message: Webhook configured.
      reason: Succeeded
      status: "True"
      type: WebhookConfigured
