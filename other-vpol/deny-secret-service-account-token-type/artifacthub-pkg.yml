name: deny-secret-service-account-token-type-vpol
version: 1.0.0
displayName: Deny Secret Service Account Token Type in ValidatingPolicy
description: >-
  Before version 1.24, Kubernetes automatically generated Secret-based tokens 
  for ServiceAccounts. When creating a Secret, you can specify its type using the 
  type field of the Secret resource . The type kubernetes.io/service-account-token
  is used for legacy ServiceAccount tokens . These legacy Tokens can
  be of security concern and should be audited.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/deny-secret-service-account-token-type/deny-secret-service-account-token-type.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Before version 1.24, Kubernetes automatically generated Secret-based tokens 
  for ServiceAccounts. When creating a Secret, you can specify its type using the 
  type field of the Secret resource . The type kubernetes.io/service-account-token
  is used for legacy ServiceAccount tokens . These legacy Tokens can
  be of security concern and should be audited.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `deny-secret-service-account-token-type` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `kubernetes.io/service-account-token` in `spec.allowedValues` to allow that Secret
  type only within the exception's resource scope. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/deny-secret-service-account-token-type/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Secret, ServiceAccount"
