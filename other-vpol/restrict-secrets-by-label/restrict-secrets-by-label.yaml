apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-secrets-by-label
  annotations:
    policies.kyverno.io/title: Restrict Protected Secrets in Pods
    policies.kyverno.io/category: Other in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Secret
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Pods and pod templates must not consume Secrets labeled status=protected
      through environment variables, Secret volumes, or projected Secret volumes.
spec:
  failurePolicy: Fail
  validationActions: [Audit]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
          object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) && variables.podSpec.initContainers != null
          ? variables.podSpec.initContainers : []) +
        (has(variables.podSpec.ephemeralContainers) && variables.podSpec.ephemeralContainers != null
          ? variables.podSpec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          (has(container.env) && container.env != null ? container.env : []).all(env,
            !has(env.valueFrom) || env.valueFrom == null ||
            !has(env.valueFrom.secretKeyRef) || env.valueFrom.secretKeyRef == null ||
            ('env.secretKeyRef:' + env.valueFrom.secretKeyRef.name) in exceptions.allowedValues ||
            resource.Get("v1", "secrets", object.metadata.namespace,
              env.valueFrom.secretKeyRef.name).metadata.?labels[?"status"].orValue("") != "protected"))
      message: "Pods must not use Secrets labeled status=protected in env."
    - expression: >-
        variables.allContainers.all(container,
          (has(container.envFrom) && container.envFrom != null ? container.envFrom : []).all(envFrom,
            !has(envFrom.secretRef) || envFrom.secretRef == null ||
            ('envFrom.secretRef:' + envFrom.secretRef.name) in exceptions.allowedValues ||
            resource.Get("v1", "secrets", object.metadata.namespace,
              envFrom.secretRef.name).metadata.?labels[?"status"].orValue("") != "protected"))
      message: "Pods must not use Secrets labeled status=protected in envFrom."
    - expression: >-
        (has(variables.podSpec.volumes) && variables.podSpec.volumes != null
          ? variables.podSpec.volumes : []).all(volume,
          (!has(volume.secret) || volume.secret == null ||
            ('volume.secret:' + volume.secret.secretName) in exceptions.allowedValues ||
            resource.Get("v1", "secrets", object.metadata.namespace,
              volume.secret.secretName).metadata.?labels[?"status"].orValue("") != "protected") &&
          (!has(volume.projected) || volume.projected == null ||
            (has(volume.projected.sources) && volume.projected.sources != null
              ? volume.projected.sources : []).all(source,
              !has(source.secret) || source.secret == null ||
              ('projected.secret:' + source.secret.name) in exceptions.allowedValues ||
              resource.Get("v1", "secrets", object.metadata.namespace,
                source.secret.name).metadata.?labels[?"status"].orValue("") != "protected")))
      message: "Pods must not use Secrets labeled status=protected in volumes."
