apiVersion: v1
kind: Pod
metadata:
  name: no-secret
spec:
  containers:
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: unprotected-secret
spec:
  containers:
    - name: app
      image: nginx
      env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: unprotected
              key: token
---
apiVersion: v1
kind: Pod
metadata:
  name: unprotected-projected-secret
spec:
  containers:
    - name: app
      image: nginx
      envFrom:
        - secretRef:
            name: unprotected
  volumes:
    - name: secrets
      projected:
        sources:
          - secret:
              name: unprotected
