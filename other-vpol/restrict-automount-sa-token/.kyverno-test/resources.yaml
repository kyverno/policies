apiVersion: v1
kind: Pod
metadata:
  name: pod-token-disabled
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-token-default
spec:
  containers:
    - name: app
      image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-policy-reporter
  labels:
    app.kubernetes.io/part-of: policy-reporter
spec:
  automountServiceAccountToken: true
  containers:
    - name: app
      image: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-policy-reporter
spec:
  selector:
    matchLabels:
      app: policy-reporter
  template:
    metadata:
      labels:
        app: policy-reporter
        app.kubernetes.io/part-of: policy-reporter
    spec:
      automountServiceAccountToken: true
      containers:
        - name: app
          image: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-token-default
spec:
  selector:
    matchLabels:
      app: token-default
  template:
    metadata:
      labels:
        app: token-default
    spec:
      containers:
        - name: app
          image: nginx
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-token-default
spec:
  selector:
    app: rc-token-default
  template:
    metadata:
      labels:
        app: rc-token-default
    spec:
      containers:
        - name: app
          image: nginx
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-token-disabled
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - name: app
              image: nginx
          restartPolicy: Never
