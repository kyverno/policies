apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-automount-sa-token
  annotations:
    policies.kyverno.io/title: Restrict Auto-Mount of Service Account Tokens in Pods
    policies.kyverno.io/category: Security in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Reports Pods and pod templates that leave automatic ServiceAccount token mounting enabled,
      unless the Pod or its controller's Pod template is labeled
      app.kubernetes.io/part-of=policy-reporter. The default Audit action reports violations
      without rejecting requests.
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
          object.spec.?template.?spec.orValue(object.spec))
    - name: podLabels
      expression: >-
        object.kind == 'Pod'
          ? object.metadata.?labels.orValue({})
          : object.kind == 'CronJob'
            ? object.spec.?jobTemplate.?spec.?template.?metadata.?labels.orValue({})
            : object.spec.?template.?metadata.?labels.orValue({})
  validations:
    - expression: >-
        variables.podLabels[?"app.kubernetes.io/part-of"].orValue("") == "policy-reporter" ||
        (has(variables.podSpec.automountServiceAccountToken) &&
        variables.podSpec.automountServiceAccountToken == false) ||
        exceptions.allowedValues.exists(value,
          value == 'automountServiceAccountToken:' +
          string(variables.podSpec.?automountServiceAccountToken.orValue(true)))
      message: "Pods and pod templates must set automountServiceAccountToken to false unless labeled app.kubernetes.io/part-of=policy-reporter."
