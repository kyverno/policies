---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-deploy
  template:
    metadata:
      labels:
        app: good-deploy
    spec:
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:latest
        command:
        - sleep
        - "3600"
