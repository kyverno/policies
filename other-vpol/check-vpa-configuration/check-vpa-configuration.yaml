apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: check-vpa-configuration
  annotations:
    policies.kyverno.io/title: Check for matching VerticalPodAutoscaler (VPA) in ValidatingPolicy
    policies.kyverno.io/category: Other in Vpol
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.37"
    policies.kyverno.io/subject: Deployment, StatefulSet, ReplicaSet, DaemonSet, VerticalPodAutoscaler
    policies.kyverno.io/description: >-
      VerticalPodAutoscaler (VPA) is useful to automatically adjust the resources assigned to Pods.
      It requires defining a specific target resource by kind and name. There are no built-in
      validation checks by the VPA controller to ensure that the target resource is associated with it.
      This policy ensures that the matching kind has a matching VPA.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, replicasets, daemonsets]
  matchConditions:
    - name: skip-objects-being-deleted
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: vpas
      expression: >-
        dyn(resource.List('autoscaling.k8s.io/v1', 'verticalpodautoscalers', object.metadata.namespace).?items.orValue([]))
  validations:
    - expression: >-
        variables.vpas.exists(vpa,
          vpa.?spec.?targetRef.?kind.orValue('') == object.kind &&
          vpa.?spec.?targetRef.?name.orValue('') == object.metadata.name)
      message: "Workload requires a matching VerticalPodAutoscaler (VPA) in its namespace."
      messageExpression: >-
        "Workload '" + object.kind + "/" + object.metadata.name +
        "' requires a matching VerticalPodAutoscaler (VPA) in the '" +
        object.metadata.namespace + "' namespace."
