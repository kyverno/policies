apiVersion: v1
kind: Namespace
metadata:
  name: check-vpa-configuration-decoy
---
# Targets the bad DaemonSet from another namespace, so it must not satisfy the policy.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-other-namespace
  namespace: check-vpa-configuration-decoy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: bad-ds
  updatePolicy:
    updateMode: "Off"
