apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-good-deploy
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: good-deploy
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-good-sts
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: good-sts
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-good-ds
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: good-ds
  updatePolicy:
    updateMode: "Off"
---
# Uses the name of the bad StatefulSet with the wrong kind, so it must not satisfy the policy.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-wrong-kind
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bad-sts
  updatePolicy:
    updateMode: "Off"
