apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: validate-initdata-configmap-exceptions}
policies: [../validate-initdata-configmap.yaml]
resources:
- ../.kyverno-test/resources.yaml
- sibling-resource.yaml
exceptions: [../.kyverno-test/exceptions.yaml]
results:
- {kind: ConfigMap, policy: validate-initdata-configmap, resources: [default/test-initdata-invalid], result: pass, isValidatingPolicy: true}
- kind: ConfigMap
  policy: validate-initdata-configmap
  isValidatingPolicy: true
  resources:
  - exception-sibling-ns/test-initdata-invalid-sibling
  result: fail
