# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: block-kubectl-cp-by-pod-label
spec:
  steps:
    - name: step-01
      try:
        - apply:
            file: ../block-kubectl-cp.yaml
        - assert:
            file: policy-ready.yaml
    - name: step-02
      try:
        - apply:
            file: ns.yaml
        - apply:
            file: pods.yaml
        - script:
            content: kubectl wait -n bkc-podlabel-ns --for=condition=Ready pod/pod01 --timeout=90s
    - name: step-03
      try:
        - script:
            content: |
              set -eu
              copy_dir=$(mktemp -d)
              trap 'rm -rf "$copy_dir"' EXIT
              if kubectl cp -n bkc-podlabel-ns pod01:/test1.txt "$copy_dir/test1.txt" >"$copy_dir/output" 2>&1; then
                cat "$copy_dir/output"
                exit 1
              fi
              cat "$copy_dir/output"
              grep -F 'block-kubectl-cp' "$copy_dir/output"
              grep -F 'Cannot use `kubectl cp` on pods' "$copy_dir/output"
    - name: allow-one-word-command
      try:
        - continueOnError: true
          script:
            content: kubectl exec -n bkc-podlabel-ns pod01 -- true
    - name: allow-tar-with-other-argument
      try:
        - continueOnError: true
          script:
            content: kubectl exec -n bkc-podlabel-ns pod01 -- tar --help
    - name: allow-non-tar-with-cf-argument
      try:
        - continueOnError: true
          script:
            content: |
              set -eu
              output=$(kubectl exec -n bkc-podlabel-ns pod01 -- echo cf)
              test "$output" = cf
