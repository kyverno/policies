name: namespace-protection-vpol
version: 1.0.0
displayName: Namespace Protection in ValidatingPolicy
description: >-
  Namespaces may be "frozen" by applying the label freeze=true, indicating that no changes should be allowed to resources within them. This policy denies all CREATE and UPDATE operations in Namespaces labeled freeze=true.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/namespace-protection/namespace-protection.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Namespaces may be "frozen" by applying the label freeze=true, indicating that no changes should be allowed to resources within them. This policy denies all CREATE and UPDATE operations in Namespaces labeled freeze=true.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Namespace"
