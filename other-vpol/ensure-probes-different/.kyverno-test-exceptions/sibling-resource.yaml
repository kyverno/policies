apiVersion: apps/v1
kind: Deployment
metadata:
  labels: null
  name: mydeploy-2-sibling
  namespace: exception-sibling-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goproxy
  template:
    metadata:
      name: goproxy
      labels:
        app: goproxy
    spec:
      containers:
      - name: goproxy
        image: registry.k8s.io/goproxy:0.1
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
