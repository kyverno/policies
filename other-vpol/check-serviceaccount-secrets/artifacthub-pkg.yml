name: check-serviceaccount-secrets-vpol
version: 1.0.0
displayName: Check Existence of Secrets in ServiceAccount in ValidatingPolicy
description: >-
  Before version 1.24, Kubernetes automatically generated Secret-based tokens 
  for ServiceAccounts. To distinguish between automatically generated tokens 
  and manually created ones, Kubernetes checks for a reference from the 
  ServiceAccount's secrets field. If the Secret is referenced in the secrets 
  field, it is considered an auto-generated legacy token. These legacy Tokens can
  be of security concern and should be audited.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/check-serviceaccount-secrets/check-serviceaccount-secrets.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Before version 1.24, Kubernetes automatically generated Secret-based tokens 
  for ServiceAccounts. To distinguish between automatically generated tokens 
  and manually created ones, Kubernetes checks for a reference from the 
  ServiceAccount's secrets field. If the Secret is referenced in the secrets 
  field, it is considered an auto-generated legacy token. These legacy Tokens can
  be of security concern and should be audited.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-serviceaccount-secrets` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `serviceaccount-secret:<name>` in `spec.allowedValues` for each allowed entry in the
  ServiceAccount's `secrets` list; every unlisted Secret still fails. CEL consumes
  `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/check-serviceaccount-secrets/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Secret,ServiceAccount"
