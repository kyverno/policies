apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-node
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aws-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aws-node
    spec:
      serviceAccountName: aws-node-irsa
      containers:
      - name: aws-node
        image: ghcr.io/kyverno/test-busybox:1.35
