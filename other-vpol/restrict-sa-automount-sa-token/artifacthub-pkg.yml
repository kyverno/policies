name: restrict-sa-automount-sa-token-vpol
version: 1.0.0
displayName: Restrict Auto-Mount of Service Account Tokens in Service Account in ValidatingPolicy
description: >-
  Kubernetes automatically mounts ServiceAccount credentials in each ServiceAccount.
  The ServiceAccount may be assigned roles allowing Pods to access API resources.
  Blocking this ability is an extension of the least privilege best practice and should
  be followed if Pods do not need to speak to the API server to function.
  This policy ensures that mounting of these ServiceAccount tokens is blocked.  
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-sa-automount-sa-token/restrict-sa-automount-sa-token.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Kubernetes automatically mounts ServiceAccount credentials in each ServiceAccount.
  The ServiceAccount may be assigned roles allowing Pods to access API resources.
  Blocking this ability is an extension of the least privilege best practice and should
  be followed if Pods do not need to speak to the API server to function.
  This policy ensures that mounting of these ServiceAccount tokens is blocked.  
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-sa-automount-sa-token` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `automountServiceAccountToken:true` in `spec.allowedValues` to allow true or omitted
  automount configuration; omission defaults to true for this check. CEL consumes
  `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-sa-automount-sa-token/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "ServiceAccount"
