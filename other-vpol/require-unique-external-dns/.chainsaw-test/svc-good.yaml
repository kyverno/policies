apiVersion: v1
kind: Service
metadata:
  name: goodsvc01
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dns.k8s.io
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: goodsvc02
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dns.foo.bar
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: goodsvc03
  namespace: unique-external-dns-ns
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
# foo.wild.example.com does NOT match *.wild.example.com (exact match only).
apiVersion: v1
kind: Service
metadata:
  name: goodsvc04
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: foo.wild.example.com
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
# Duplicate empty "" values are allowed (behavior change from legacy AnyIn).
apiVersion: v1
kind: Service
metadata:
  name: goodsvc05
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ""
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
