# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-unique-external-dns
spec:
  # Disable templating because it can cause issues with ValidatingPolicy.
  template: false
  steps:
    - name: step-01
      try:
        - apply:
            file: svc.yaml
        - apply:
            file: ../require-unique-external-dns.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: unique-external-dns
              spec:
                validationActions:
                  - Deny
        - assert:
            file: policy-ready.yaml
        - sleep:
            duration: 10s
    - name: step-02
      try:
        - apply:
            file: svc-good.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'is already taken by another service in the cluster.')): true
            file: svc-bad.yaml
        - apply:
            file: svc-self-update.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'is already taken by another service in the cluster.')): true
            file: svc-update-bad.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'is already taken by another service in the cluster.')): true
            file: svc-other-ns.yaml
