apiVersion: v1
kind: Namespace
metadata:
  name: unique-external-dns-ns
---
apiVersion: v1
kind: Service
metadata:
  name: svc01
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dns.kyverno.io
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: svc02
  namespace: unique-external-dns-ns
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dns.bar.foo
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    run: nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: unique-external-dns-other-ns
