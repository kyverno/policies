name: require-deployments-have-multiple-replicas-vpol
version: 1.0.0
displayName: Require Multiple Replicas in ValidatingPolicy
description: >-
  Deployments with a single replica cannot be highly available and thus the application may suffer downtime if that one replica goes down. This policy validates that Deployments have more than one replica.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-deployments-have-multiple-replicas/require-deployments-have-multiple-replicas.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Deployments with a single replica cannot be highly available and thus the application may suffer downtime if that one replica goes down. This policy validates that Deployments have more than one replica.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `deployment-has-multiple-replicas` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List decimal replica counts as strings in `spec.allowedValues`, such as `"1"`, to allow
  only those otherwise-invalid counts. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/require-deployments-have-multiple-replicas/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Deployment"
