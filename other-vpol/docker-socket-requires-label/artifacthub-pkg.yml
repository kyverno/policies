name: docker-socket-requires-label-vpol
version: 1.0.0
displayName: Docker Socket Requires Label in ValidatingPolicy
description: >-
  Accessing a container engine's socket is for highly specialized use cases and should generally be disabled. If access must be granted, it should be done on an explicit basis. This policy requires that, for any Pod mounting the Docker socket, it must have the label `allow-docker` set to `true`.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/docker-socket-requires-label/docker-socket-requires-label.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Accessing a container engine's socket is for highly specialized use cases and should generally be disabled. If access must be granted, it should be done on an explicit basis. This policy requires that, for any Pod mounting the Docker socket, it must have the label `allow-docker` set to `true`.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `docker-socket-check` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List the exact Pod name in `spec.allowedValues` to permit its Docker socket mount
  without `allow-docker=true`; also constrain the namespace in `spec.matchConditions`. CEL
  consumes `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain
  checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/docker-socket-requires-label/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
