name: block-large-images
version: 1.0.0
displayName: Block Large Images in ValidatingPolicy
description: >-
  Pods which run containers of very large image size take longer to pull and require more space to store. A user may either inadvertently or purposefully name an image which is unusually large to disrupt operations. This policy checks the size of every container image and blocks if it is over 2 Gibibytes.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-large-images/block-large-images.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Pods which run containers of very large image size take longer to pull and require more space to store. A user may either inadvertently or purposefully name an image which is unusually large to disrupt operations. This policy checks the size of every container image and blocks if it is over 2 Gibibytes.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `block-large-images` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact container image references in `spec.images` to bypass the 2Gi
  layer-size check only for those images. CEL consumes `spec.images` as
  `exceptions.allowedImages`; unlisted images remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-large-images/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.23"
  kyverno/subject: "Pod"
