apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-edit-for-endpoints
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ../restrict-edit-for-endpoints.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1alpha1
          kind: ValidatingPolicy
          metadata:
            name: restrict-edit-for-endpoints
          spec:
            validationActions:
            - Deny
    - assert:
        file: chainsaw-step-01-assert-1.yaml
    - sleep:
        duration: 10s

  - name: step-02
    try:
    - apply:
        file: cr-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: cr-bad.yaml
