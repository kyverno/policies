# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: unique-ingress-paths
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: step-01
    try:
    - apply:
        file: ingress.yaml
    - apply:
        file: ../unique-ingress-paths.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: unique-ingress-path
          spec:
            validationActions: 
              - Deny
    - assert:
        file: chainsaw-step-01-assert-1.yaml
    - apply:
        file: exceptions.yaml
    - sleep: 
        duration: 10s
  - name: step-02
    try:
    - apply:
        file: exception-ingress.yaml
    - apply:
        file: ingress-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'The root path already exists in the cluster but not in the namespace.')): true
        file: ingress-bad.yaml
    - delete:
        file: exceptions.yaml
    - script:
        content: >-
          for attempt in $(seq 1 20); do output=$(kubectl annotate ingress approved-ingress
          -n exception-ingress-ns kyverno.io/lifecycle-check=denied --overwrite --dry-run=server
          -o yaml 2>&1); status=$?; if test "$status" -ne 0; then echo "$output" | grep -F
          "The root path already exists in the cluster but not in the namespace." >/dev/null
          && exit 0; echo "$output"; exit 1; fi; sleep 1; done; echo "$output"; exit 1
