apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: csr-grant-exception
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: restrict-clusterrole-csr
  matchConditions:
  - name: exact-clusterrole
    expression: object.metadata.name in ['csr-exception-update', 'csr-exception-update-patch']
  allowedValues:
  - csr:approval:update
