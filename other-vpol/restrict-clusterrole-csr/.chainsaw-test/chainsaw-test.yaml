# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-clusterrole-csr
spec:
  steps:
  - name: restrict-csr-permissions
    try:
    - script:
        content: |
          set -eu
          kubectl delete clusterrole csr-chainsaw-good-read csr-chainsaw-good-status csr-chainsaw-nonresource csr-chainsaw-bad-approval csr-chainsaw-literal-resource-suffix csr-chainsaw-bad-subresource-wildcard csr-chainsaw-bad-signers csr-chainsaw-bad-aggregate --ignore-not-found --wait
          kubectl delete validatingpolicies.policies.kyverno.io restrict-clusterrole-csr --ignore-not-found --wait
    - apply:
        file: ../restrict-clusterrole-csr.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: restrict-clusterrole-csr
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
    - apply:
        file: cr-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'ClusterRoles must not grant update or patch access to certificatesigningrequests/approval')): true
        file: cr-bad-approval.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'ClusterRoles must not grant approve access to signers')): true
        file: cr-bad-signers.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Aggregated ClusterRoles are not allowed')): true
        file: cr-bad-aggregate.yaml
    cleanup:
    - script:
        content: |
          set -eu
          kubectl delete clusterrole csr-chainsaw-good-read csr-chainsaw-good-status csr-chainsaw-nonresource csr-chainsaw-bad-approval csr-chainsaw-literal-resource-suffix csr-chainsaw-bad-subresource-wildcard csr-chainsaw-bad-signers csr-chainsaw-bad-aggregate --ignore-not-found --wait
          kubectl delete validatingpolicies.policies.kyverno.io restrict-clusterrole-csr --ignore-not-found --wait
