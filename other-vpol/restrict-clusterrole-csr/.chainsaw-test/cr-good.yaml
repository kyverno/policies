apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chainsaw-good-read
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/approval", "signers"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chainsaw-good-status
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/status", "*/status"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chainsaw-nonresource
rules:
- nonResourceURLs: ["/healthz"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-chainsaw-literal-resource-suffix
rules:
- apiGroups: ["*"]
  resources: ["certificatesigningrequests/*"]
  verbs: ["patch"]
