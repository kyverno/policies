# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: exclude-namespaces-dynamically
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: step-01
    try:
    - apply:
        file: cm.yaml
    - apply:
        file: ns.yaml
    - apply:
        file: ../exclude-namespaces-dynamically.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: exclude-namespaces-example
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - script:
        content: |
          . ../../../.chainsaw/scripts/retry.sh
          policy_enforced() {
            kubectl create --dry-run=server -f pod-good.yaml &&
              kubectl create --dry-run=server -f pod-bad.yaml 2>&1 | grep -F 'Pods must have the "foo" label in metadata.labels'
          }
          retry policy_enforced
  - name: step-02
    try:
    - create:
        file: pod-good.yaml
    - create:
        file: podcontroller-good.yaml
    - create:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - create:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml
  - name: step-03
    try:
    - create:
        file: exception.yaml
    - script:
        content: |
          . ../../../.chainsaw/scripts/retry.sh
          retry kubectl create --dry-run=server -f pod-bad01.yaml
    - create:
        file: pod-bad01.yaml
    - create:
        expect:
        - check:
            (contains($error, 'Pods must have the "foo" label in metadata.labels')): true
        file: pod-bad02.yaml
    - delete:
        file: pod-bad01.yaml
    - delete:
        file: exception.yaml
    - script:
        content: |
          . ../../../.chainsaw/scripts/retry.sh
          exception_revoked() {
            ! kubectl get pod -n default exclude-dynamically-exception-pod &&
              kubectl create --dry-run=server -f pod-bad01.yaml 2>&1 | grep -F 'Pods must have the "foo" label in metadata.labels'
          }
          retry exception_revoked
    - create:
        expect:
        - check:
            (contains($error, 'Pods must have the "foo" label in metadata.labels')): true
        file: pod-bad01.yaml
