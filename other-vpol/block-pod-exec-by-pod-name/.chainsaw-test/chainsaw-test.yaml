# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: block-pod-exec-by-pod-name
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: step-01
    try:
    - apply:
        file: ../block-pod-exec-by-pod-name.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: deny-exec-by-pod-name
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: namespace.yaml
    - apply:
        file: pod-1.yaml
    - apply:
        file: pod-2.yaml
    - apply:
        file: pod-3.yaml
  - name: step-03
    try:
    - sleep:
        duration: 5s
  - name: step-04
    try:
    - apply:
        file: exceptions.yaml
    - script:
        content: |
          set -eu
          kubectl wait --for=condition=Ready pod/myapp-maintenance-01 -n bpe-podname-ns --timeout=60s
          for attempt in $(seq 1 30); do
            if kubectl exec -n bpe-podname-ns myapp-maintenance-01 -- ls >/dev/null 2>exec-allowed.err; then exit 0; fi
            cat exec-allowed.err >&2
            sleep 1
          done
          exit 1
    - script:
        content: |
          set -eu
          kubectl wait --for=condition=Ready pod/myapp-maintenance-02 -n bpe-podname-ns --timeout=60s
          for attempt in $(seq 1 30); do
            set +e
            output=$(kubectl exec -n bpe-podname-ns myapp-maintenance-02 -- ls 2>&1)
            status=$?
            set -e
            if test "$status" -ne 0; then printf '%s' "$output" | grep -F "Exec'ing into Pods called \"myapp-maintenance\" is not allowed." >/dev/null && exit 0; fi
            sleep 1
          done
          printf '%s\n' "$output"
          exit 1
    - script:
        content: kubectl exec -n bpe-podname-ns not-myapp -- ls
    - delete:
        file: exceptions.yaml
    - script:
        content: |
          set -eu
          for attempt in $(seq 1 30); do
            set +e
            output=$(kubectl exec -n bpe-podname-ns myapp-maintenance-01 -- ls 2>&1)
            status=$?
            set -e
            if test "$status" -ne 0; then printf '%s' "$output" | grep -F "Exec'ing into Pods called \"myapp-maintenance\" is not allowed." >/dev/null && exit 0; fi
            sleep 1
          done
          printf '%s\n' "$output"
          exit 1
  - name: step-99
    try:
    - script:
        content: kubectl delete all --all --force --grace-period=0 -n bpe-podname-ns
