name: restrict-wildcard-verbs-vpol
version: 1.0.0
displayName: Restrict Wildcard in Verbs in ValidatingPolicy
description: >-
  Wildcards ('*') in verbs grants all access to the resources referenced by it and does not follow the principal of least privilege. As much as possible, avoid such open verbs unless scoped to perhaps a custom API group. This policy blocks any Role or ClusterRole that contains a wildcard entry in the verbs list found in any rule.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-wildcard-verbs/restrict-wildcard-verbs.yaml
  ```
keywords:
  - kyverno
  - Security
  - EKS Best Practices
  - ValidatingPolicy
readme: |
  Wildcards ('*') in verbs grants all access to the resources referenced by it and does not follow the principal of least privilege. As much as possible, avoid such open verbs unless scoped to perhaps a custom API group. This policy blocks any Role or ClusterRole that contains a wildcard entry in the verbs list found in any rule.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-wildcard-verbs` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `<resource>:*` in `spec.allowedValues`, such as `pods:*`, to permit the literal
  wildcard verb on only that resource; other resources in the same rule still need their
  own token. CEL consumes `spec.allowedValues` as `exceptions.allowedValues`; unlisted
  values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-wildcard-verbs/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security, EKS Best Practices in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Role, ClusterRole, RBAC"
