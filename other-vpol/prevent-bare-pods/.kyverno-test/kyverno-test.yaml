apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prevent-bare-pods
policies:
- ../prevent-bare-pods.yaml
resources:
- ../.chainsaw-test/pod-bad.yaml
- ../.chainsaw-test/pod-good.yaml
- empty-owner-pod.yaml
results:
- policy: prevent-bare-pods
  isValidatingPolicy: true
  kind: Pod
  resources:
  - badpod01
  result: fail
- policy: prevent-bare-pods
  isValidatingPolicy: true
  kind: Pod
  resources:
  - goodpod01
  result: pass
- policy: prevent-bare-pods
  isValidatingPolicy: true
  kind: Pod
  resources:
  - empty-owner-pod
  result: fail
