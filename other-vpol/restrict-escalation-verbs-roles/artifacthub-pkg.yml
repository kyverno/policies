name: restrict-escalation-verbs-roles-vpol
version: 1.0.0
displayName: Restrict Escalation Verbs in Roles in ValidatingPolicy
description: >-
  The verbs `impersonate`, `bind`, and `escalate` may all potentially lead to privilege escalation and should be tightly controlled. This policy prevents use of these verbs in Role or ClusterRole resources.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-escalation-verbs-roles/restrict-escalation-verbs-roles.yaml
  ```
keywords:
  - kyverno
  - Security
  - ValidatingPolicy
readme: |
  The verbs `impersonate`, `bind`, and `escalate` may all potentially lead to privilege escalation and should be tightly controlled. This policy prevents use of these verbs in Role or ClusterRole resources.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-escalation-verbs-roles` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `verb:bind`, `verb:escalate`, `verb:impersonate`, or `verb:*` in
  `spec.allowedValues` to permit the corresponding exact verb; `verb:*` does not exempt
  other verb tokens. CEL consumes `spec.allowedValues` as `exceptions.allowedValues`;
  unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-escalation-verbs-roles/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Security in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Role, ClusterRole, RBAC"
