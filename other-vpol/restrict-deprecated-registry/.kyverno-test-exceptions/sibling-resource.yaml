apiVersion: v1
kind: Pod
metadata:
  name: test-pod-bad-sibling
  namespace: exception-sibling-ns
  labels:
    app: test
spec:
  containers:
  - name: test
    image: k8s.gcr.io/google-containers/pause:3.2
    imagePullPolicy: Always
    securityContext:
      allowPrivilegeEscalation: false
      runAsUser: 1000
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
