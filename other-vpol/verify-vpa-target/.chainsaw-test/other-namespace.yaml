apiVersion: v1
kind: Namespace
metadata:
  name: verify-vpa-target-other
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other-busybox
  namespace: verify-vpa-target-other
spec:
  replicas: 0
  selector:
    matchLabels:
      app: other-busybox
  template:
    metadata:
      labels:
        app: other-busybox
    spec:
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:latest
        command:
        - sleep
        - "3000"
