# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: verify-vpa-target
spec:
  template: false
  steps:
    - name: step-01
      try:
        - assert:
            file: crd-assert.yaml
        - apply:
            file: rbac.yaml
    - name: step-02
      try:
        - apply:
            file: ../verify-vpa-target.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: verify-vpa-target
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: step-03
      try:
        - apply:
            file: prereq.yaml
        - apply:
            file: other-namespace.yaml
    - name: step-04
      try:
        - apply:
            file: good.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'The target kind must be specified exactly as Deployment, StatefulSet, ReplicaSet, or DaemonSet.')): true
            file: bad-kind.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'does not exist in the')): true
            file: bad-target.yaml
    # The lookup is limited to the namespace of the VPA, so a workload with the
    # same name in another namespace does not count.
    - name: step-05
      try:
        - apply:
            expect:
              - check:
                  (contains($error, 'The target Deployment named other-busybox does not exist in the')): true
            file: bad-other-namespace.yaml
        - apply:
            file: good-other-namespace.yaml
    # Like the legacy policy, only CREATE is checked. Pointing an existing VPA
    # at a missing Deployment must still be allowed.
    - name: step-06
      try:
        - patch:
            resource:
              apiVersion: autoscaling.k8s.io/v1
              kind: VerticalPodAutoscaler
              metadata:
                name: good01
              spec:
                targetRef:
                  name: nothere
