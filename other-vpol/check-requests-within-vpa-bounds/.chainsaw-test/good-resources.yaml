apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-deploy
  template:
    metadata:
      labels:
        app: good-deploy
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:latest
        command: [sleep, "3600"]
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-vpa-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-vpa-deploy
  template:
    metadata:
      labels:
        app: no-vpa-deploy
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:latest
        command: [sleep, "3600"]
        resources:
          requests:
            cpu: 4
            memory: 8Gi
---
apiVersion: apps/v1
kind: Deployment
