        - containerName: app
          lowerBound:
            cpu: 100m
            memory: "134217728"
          target:
            cpu: 250m
            memory: "262144k"
          upperBound:
            cpu: 500m
            memory: "536870912"
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-pending-deploy
      namespace: default
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: pending-deploy
      updatePolicy:
        updateMode: "Off"
  - apiVersion: autoscaling.k8s.io/v1
