    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-terminating-deploy
      namespace: default
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: terminating-deploy
      updatePolicy:
        updateMode: "Off"
    status:
      recommendation:
        containerRecommendations:
        - containerName: app
          lowerBound:
            cpu: 10m
            memory: "1048576"
          target:
            cpu: 10m
            memory: "1048576"
          upperBound:
            cpu: 10m
            memory: "1048576"
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-good-sts
      namespace: default
