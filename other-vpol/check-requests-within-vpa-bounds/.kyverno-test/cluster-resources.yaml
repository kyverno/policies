apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata:
  name: cluster-resources
spec:
  crds:
  - vpa-crd.yaml
  resources:
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-good-deploy
      namespace: default
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: good-deploy
      updatePolicy:
        updateMode: "Off"
    status:
      recommendation:
        containerRecommendations:
        - containerName: app
          lowerBound:
            cpu: 100m
            memory: "134217728"
          target:
            cpu: 250m
            memory: "262144k"
          upperBound:
            cpu: 500m
            memory: "536870912"
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-edge-deploy
      namespace: default
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: edge-deploy
      updatePolicy:
        updateMode: "Off"
    status:
      recommendation:
        containerRecommendations:
        - containerName: app
          lowerBound:
            cpu: 100m
            memory: "134217728"
          target:
            cpu: 250m
            memory: "262144k"
          upperBound:
            cpu: 500m
            memory: "536870912"
  - apiVersion: autoscaling.k8s.io/v1
    kind: VerticalPodAutoscaler
    metadata:
      name: vpa-over-deploy
      namespace: default
    spec:
      targetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: over-deploy
      updatePolicy:
        updateMode: "Off"
    status:
      recommendation:
