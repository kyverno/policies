apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-deploy
  template:
    metadata:
      labels:
        app: good-deploy
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:latest
        command: [sleep, "3600"]
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
---
