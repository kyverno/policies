# Mocks resource.List("v1", "pods", "") for the CLI.
# NOTE: mocked Pods must NOT set metadata.namespace because the CLI's fake
# context provider buckets resources by namespace, and the policy lists Pods
# with an empty namespace (all Namespaces). A namespace would make the Pods
# land in a different bucket and the List would return zero items.
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod01
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
