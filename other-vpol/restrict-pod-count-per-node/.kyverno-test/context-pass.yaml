# Mocks resource.List("v1", "pods", "") for the CLI: 10 Pods on `minikube`
# (the limit boundary) plus 2 Pods on other Nodes, which must not count.
# NOTE: mocked Pods must NOT set metadata.namespace because the CLI's fake
# context provider buckets resources by namespace, and the policy lists Pods
# with an empty namespace (all Namespaces).
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod01
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod02
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
