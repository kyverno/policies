# Mocks resource.List("v1", "pods", "") for the CLI: 10 Pods on `minikube`
# (the limit boundary) plus 2 Pods on other Nodes and 1 pending Pod without a
# spec.nodeName, none of which must count.
# NOTE: mocked Pods must NOT set metadata.namespace because the CLI's fake
# context provider buckets resources by namespace, and the policy lists Pods
# with an empty namespace (all Namespaces).
apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod01
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod02
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod03
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod04
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod05
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod06
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod07
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod08
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod09
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod10
      spec:
        nodeName: minikube
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod11
      spec:
        nodeName: other-node
        containers:
          - image: nginx
            name: nginx
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod12
      spec:
        nodeName: other-node
        containers:
          - image: nginx
            name: nginx
    # A pending Pod which has not been scheduled yet, so it has no spec.nodeName.
    # It must be ignored by the policy rather than causing an evaluation error.
    - apiVersion: v1
      kind: Pod
      metadata:
        name: pod13
      spec:
        containers:
          - image: nginx
            name: nginx
