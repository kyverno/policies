name: inspect-csr-vpol
version: 1.0.0
displayName: Inspect CertificateSigningRequests in ValidatingPolicy
description: >-
  Audits CertificateSigningRequests against the requesting identity and approved signer and usages.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/inspect-csr/inspect-csr.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Audits CertificateSigningRequests against the requesting identity and approved signer and usages.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `inspect-csr` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/inspect-csr/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "CertificateSigningRequest"
