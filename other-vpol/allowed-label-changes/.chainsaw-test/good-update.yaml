apiVersion: v1
kind: Pod
metadata:
  name: demo-pod
  labels:
    app: demo
    foo: bar
    breakglass: "true"
spec:
  containers:
  - name: nginx
    image: nginx:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  labels:
    app: demo
    foo: bar
    breakglass: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: nginx
        image: nginx:latest

