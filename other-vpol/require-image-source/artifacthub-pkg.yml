name: require-image-source
version: 1.0.0
displayName: Require Image Source Metadata in ValidatingPolicy
description: >-
  Ensure every container image in Pods and their controllers has a non-empty
  org.opencontainers.image.source OCI config label or manifest annotation.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-image-source/require-image-source.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Images can be built from a variety of source control locations, and the image name does not necessarily reveal this mapping. This policy checks all regular, init, and ephemeral container images in Pods and pod controllers for a non-empty `org.opencontainers.image.source` OCI config label or manifest annotation.

  A ValidatingPolicy is used rather than an ImageValidatingPolicy because this requirement checks raw OCI config labels and manifest annotations, not image signatures or attestations. Unlike the legacy policy, this policy also checks init and ephemeral containers and explicitly matches supported pod controllers (including ReplicaSets and ReplicationControllers) and the `pods/ephemeralcontainers` update subresource. Image references are passed unchanged to `image.GetMetadata`, so both tag and digest references are checked as supplied.

  Registry metadata lookup errors fail closed on admission because `failurePolicy` is `Fail`. This can reject workload changes while a registry is unavailable or the image cannot be read. The default validation action is `Audit`; set it to `Deny` to enforce missing metadata. Background scans also report evaluation errors when metadata cannot be retrieved.
  Background reporting for `pods/ephemeralcontainers` requires granting Kyverno's reports controller `get`, `list`, and `watch` access to that subresource; see the [sample aggregated ClusterRoles](https://github.com/kyverno/policies/blob/main/other-vpol/require-image-source/.chainsaw-test/ephemeral-rbac.yaml).

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-image-source` in `spec.policyRefs`, and restrict the exception with
  `spec.matchConditions` to the exact request identity. Add the exact image reference
  to `spec.allowedValues` to skip metadata lookup for that image only. The expression
  uses `exceptions.allowedValues`; unlisted images remain checked.
  See the tested examples in the [CLI suite](https://github.com/kyverno/policies/blob/main/other-vpol/require-image-source/.kyverno-test-exceptions/exceptions.yaml)
  and [Chainsaw suite](https://github.com/kyverno/policies/blob/main/other-vpol/require-image-source/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the policy
  keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/
annotations:
