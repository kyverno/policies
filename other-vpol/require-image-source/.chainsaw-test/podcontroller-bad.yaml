apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-bad-deployment
spec:
  replicas: 0
  selector:
    matchLabels:
      app: source-bad
  template:
    metadata:
      labels:
        app: source-bad
    spec:
      nodeSelector:
        kyverno.io/chainsaw-admission-only: "true"
      containers:
        - name: app
          image: ghcr.io/kyverno/test-verify-image@sha256:74a98f0e4d750c9052f092a7f7a72de7b20f94f176a490088f7a744c76c53ea5
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: source-bad-cronjob
spec:
  schedule: "* * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kyverno.io/chainsaw-admission-only: "true"
          containers:
            - name: app
              image: ghcr.io/kyverno/test-verify-image@sha256:74a98f0e4d750c9052f092a7f7a72de7b20f94f176a490088f7a744c76c53ea5
          restartPolicy: OnFailure
