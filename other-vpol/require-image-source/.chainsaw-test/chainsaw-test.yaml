# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-image-source
spec:
  steps:
    - name: install-policy
      try:
        - apply:
            file: ephemeral-rbac.yaml
        - apply:
            file: ../require-image-source.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: require-image-source
              spec:
                validationActions: [Deny]
                matchConstraints:
                  namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ($namespace)
        - assert:
            file: policy-ready.yaml
    - name: install-exception
      try:
        - apply:
            file: exception-namespace.yaml
        - apply:
            file: exceptions.yaml
    - name: test-pods
      try:
        - apply:
            file: pod-good.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: pod-bad.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Container images must include a non-empty org.opencontainers.image.source')): true
            file: pod-init-bad.yaml
        - apply:
            file: pod-exception.yaml
        - apply:
            file: pod-ephemeral-base.yaml
        - assert:
            file: pod-running.yaml
        - script:
            content: |-
              set +e
              output=$(kubectl debug source-ephemeral-base -n "$NAMESPACE" --image=ghcr.io/kyverno/test-verify-image:unsigned --target=app --profile=general --attach=false 2>&1)
              status=$?
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                echo "expected ephemeral-container admission to be denied" >&2
                exit 1
              fi
              printf '%s' "$output" | grep -F 'Container images must include a non-empty org.opencontainers.image.source'
    - name: test-controllers
      try:
        - apply:
            file: podcontroller-good.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Container images must include a non-empty org.opencontainers.image.source')): true
            file: podcontroller-bad.yaml
    - name: cleanup
      try:
        - script:
            content: kubectl delete pod source-ephemeral-base -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=60s
