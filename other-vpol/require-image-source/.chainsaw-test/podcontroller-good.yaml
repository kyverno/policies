apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-good-deployment
spec:
  replicas: 0
  selector:
    matchLabels:
      app: source-good
  template:
    metadata:
      labels:
        app: source-good
    spec:
      nodeSelector:
        kyverno.io/chainsaw-admission-only: "true"
      containers:
        - name: app
          image: ghcr.io/kyverno/kyverno-annotations-example@sha256:2910cb73213d60c4166138c8c2220290a636bc82d16f6990c62e8830f57f2d11
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: source-good-cronjob
spec:
  schedule: "* * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kyverno.io/chainsaw-admission-only: "true"
          containers:
            - name: app
              image: ghcr.io/kyverno/kyverno-annotations-example@sha256:2910cb73213d60c4166138c8c2220290a636bc82d16f6990c62e8830f57f2d11
          restartPolicy: OnFailure
