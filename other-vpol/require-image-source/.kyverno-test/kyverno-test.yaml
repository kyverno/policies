apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-image-source
context: context.yaml
variables: values.yaml
policies:
  - ../require-image-source.yaml
resources:
  - resources.yaml
  - null-lists.yaml
results:
  - isValidatingPolicy: true
    kind: Pod
    policy: require-image-source
    resources: [good-label, good-annotation-init, good-ephemeral, good-digest, good-null-init, good-null-ephemeral]
    result: pass
  - isValidatingPolicy: true
    kind: Pod
    policy: require-image-source
    resources: [missing-source, missing-source-init, missing-source-ephemeral, empty-source, absent-metadata, absent-fields]
    result: fail
  - isValidatingPolicy: true
    kind: Deployment
    policy: require-image-source
    resources: [bad-deployment, bad-null-lists]
    result: fail
  - isValidatingPolicy: true
    kind: CronJob
    policy: require-image-source
    resources: [bad-cronjob]
    result: fail
  - isValidatingPolicy: true
    kind: ReplicationController
    policy: require-image-source
    resources: [bad-replicationcontroller]
    result: fail
  - isValidatingPolicy: true
    kind: StatefulSet
    policy: require-image-source
    resources: [default/source-good-statefulset]
    result: pass
  - isValidatingPolicy: true
    kind: StatefulSet
    policy: require-image-source
    resources: [default/source-bad-statefulset]
    result: fail
  - isValidatingPolicy: true
    kind: DaemonSet
    policy: require-image-source
    resources: [default/source-good-daemonset]
    result: pass
  - isValidatingPolicy: true
    kind: DaemonSet
    policy: require-image-source
    resources: [default/source-bad-daemonset]
    result: fail
  - isValidatingPolicy: true
    kind: ReplicaSet
    policy: require-image-source
    resources: [default/source-good-replicaset]
    result: pass
  - isValidatingPolicy: true
    kind: ReplicaSet
    policy: require-image-source
    resources: [default/source-bad-replicaset]
    result: fail
  - isValidatingPolicy: true
    kind: Job
    policy: require-image-source
    resources: [default/source-good-job]
    result: pass
  - isValidatingPolicy: true
    kind: Job
    policy: require-image-source
    resources: [default/source-bad-job]
    result: fail
