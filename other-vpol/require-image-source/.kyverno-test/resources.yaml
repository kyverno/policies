---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment
spec:
  replicas: 0
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: ghcr.io/kyverno/test-verify-image:unsigned
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bad-cronjob
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: app
              image: ghcr.io/kyverno/test-verify-image:unsigned
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-replicationcontroller
spec:
  replicas: 0
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: ghcr.io/kyverno/test-verify-image:unsigned
---
