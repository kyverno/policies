name: block-ephemeral-containers-vpol
version: 1.0.0
displayName: Block Ephemeral Containers in ValidatingPolicy
description: >-
  Ephemeral containers, enabled by default in Kubernetes 1.23, allow users to use the `kubectl debug` functionality and attach a temporary container to an existing Pod. This may potentially be used to gain access to unauthorized information executing inside one or more containers in that Pod. This policy blocks the use of ephemeral containers.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-ephemeral-containers/block-ephemeral-containers.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Ephemeral containers, enabled by default in Kubernetes 1.23, allow users to use the `kubectl debug` functionality and attach a temporary container to an existing Pod. This may potentially be used to gain access to unauthorized information executing inside one or more containers in that Pod. This policy blocks the use of ephemeral containers.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `block-ephemeral-containers` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact ephemeral-container names in `spec.allowedValues`; every other ephemeral
  container remains prohibited. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-ephemeral-containers/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
