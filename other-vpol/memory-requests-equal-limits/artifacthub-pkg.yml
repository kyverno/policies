name: memory-requests-equal-limits-vpol
version: 1.0.0
displayName: Memory Requests Equal Limits in ValidatingPolicy
description: >-
  Pods which have memory limits equal to requests are given a QoS class of Guaranteed which is the highest schedulable class. This policy checks that all containers in a given Pod have memory requests equal to limits.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/memory-requests-equal-limits/memory-requests-equal-limits.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Pods which have memory limits equal to requests are given a QoS class of Guaranteed which is the highest schedulable class. This policy checks that all containers in a given Pod have memory requests equal to limits.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `memory-requests-equal-limits` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  includes regular, init, and ephemeral containers.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/memory-requests-equal-limits/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
