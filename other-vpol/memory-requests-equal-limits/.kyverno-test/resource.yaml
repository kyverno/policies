# DaemonSet with equal  resources.requests.memory  to resources.limits.memory
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd-elasticsearch
  namespace: kube-system
  labels:
    k8s-app: fluentd-logging
spec:
  selector:
    matchLabels:
      name: fluentd-elasticsearch
  template:
    metadata:
      labels:
        name: fluentd-elasticsearch
    spec:
      containers:
      - name: fluentd-elasticsearch
        image: quay.io/fluentd_elasticsearch/fluentd:v2.5.2
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi

---
# Pod with unequal  resources.requests.memory  to resources.limits.memory
apiVersion: v1
kind: Pod
metadata:
  name: myapp-pod
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

---
# CronJob with equal  resources.requests.memory  to resources.limits.memory
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox
            args:
            - /bin/sh
            - -c
            - date; echo Hello from the Kubernetes cluster
            resources:
              requests:
                cpu: "100m"
                memory: "1000m"
              limits:
                cpu: "100m"
                memory: "1000m"
---
apiVersion: v1
kind: Pod
metadata:
  name: canonical-memory
spec:
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
    resources:
      requests: {memory: 1Gi}
      limits: {memory: 1024Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: init-memory-mismatch
spec:
  initContainers:
  - name: init
    image: ghcr.io/kyverno/test-busybox:1.35
    resources:
      requests: {memory: 1000m}
      limits: {memory: 1024Mi}
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
