# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: memory-requests-equal-limits
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ../memory-requests-equal-limits.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: memory-requests-equal-limits
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep: 
       duration: 10s
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    # Kubernetes defaults a Pod's missing request to its limit before validation.
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: goodpod03
          spec:
            containers:
            - name: busybox
              resources:
                requests:
                  memory: 128Mi
                limits:
                  memory: 128Mi
    - apply:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml

  - name: limit-only-controller
    try:
    - apply:
        file: limit-only-deployment.yaml
        expect:
        - check:
            ($error != null): true
            (contains($error || '', 'memory-requests-equal-limits')): true
