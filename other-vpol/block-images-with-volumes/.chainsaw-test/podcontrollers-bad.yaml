apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: busybox
  name: baddeployment01
spec:
  replicas: 0
  selector:
    matchLabels:
      app: busybox
  strategy: {}
  template:
    metadata:
      labels:
        app: busybox
    spec:
      nodeSelector:
        kyverno.io/e2e-unschedulable: "true"
      containers:
      - name: busybox
        image: ghcr.io/kyverno/test-busybox:1.35
      - name: busybox02
        image: ghcr.io/linuxserver/nginx@sha256:ed84137217161f6a830fb1b883fcc70f0eaeef717c16ac2d796662b8c66f4340
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: badcronjob01
spec:
  suspend: true
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kyverno.io/e2e-unschedulable: "true"
          containers:
          - name: busybox
            image: ghcr.io/linuxserver/nginx@sha256:ed84137217161f6a830fb1b883fcc70f0eaeef717c16ac2d796662b8c66f4340
          - name: busybox02
            image: ghcr.io/kyverno/test-busybox:1.35
          restartPolicy: OnFailure
