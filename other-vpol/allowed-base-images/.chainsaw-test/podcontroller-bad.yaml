apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kyverno
  name: baddeployment01
spec:
  replicas: 0
  selector:
    matchLabels:
      app: kyverno
  strategy: {}
  template:
    metadata:
      labels:
        app: kyverno
    spec:
      nodeSelector:
        kyverno.io/chainsaw-admission-only: "true"
      containers:
        - name: kv-01
          image: ghcr.io/kyverno/test-busybox:1.35
        - name: kv-02
          image: ghcr.io/dlorenc/hello-ko:latest
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: badcronjob01
spec:
  schedule: "* * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:  
            foo: bar
        spec:
          nodeSelector:
            kyverno.io/chainsaw-admission-only: "true"
          containers:
          - name: hello
            image: ghcr.io/dlorenc/hello-ko:latest
            imagePullPolicy: IfNotPresent
          - name: hello02
            image: ghcr.io/kyverno/test-busybox:1.35
            imagePullPolicy: IfNotPresent
          restartPolicy: OnFailure