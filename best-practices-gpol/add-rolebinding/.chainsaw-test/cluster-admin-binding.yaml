apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: addrb-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: addrbadmin
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: addrb-admins
- kind: ServiceAccount
  name: addrb-admin-sa
  namespace: default
