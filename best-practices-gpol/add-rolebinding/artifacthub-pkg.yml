name: add-rolebinding
version: 1.0.0
displayName: Add RoleBinding
createdAt: "2023-04-10T19:47:15.000Z"
description: >-
  Typically in multi-tenancy and other use cases, when a new Namespace is created, users and other principals must be given some permissions to create and interact with resources in the Namespace. Very commonly, Roles and RoleBindings are used to grant permissions at the Namespace level. This policy generates a RoleBinding called `<userName>-admin-binding` in the new Namespace which binds to the ClusterRole `admin` as long as a `cluster-admin` did not create the Namespace. Additionally, an annotation named `kyverno.io/user` is added to the RoleBinding recording the name of the user responsible for the Namespace's creation.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-gpol/add-rolebinding/add-rolebinding.yaml
  ```
keywords:
  - kyverno
  - Multi-Tenancy
readme: |
  Typically in multi-tenancy and other use cases, when a new Namespace is created, users and other principals must be given some permissions to create and interact with resources in the Namespace. Very commonly, Roles and RoleBindings are used to grant permissions at the Namespace level. This policy generates a RoleBinding called `<userName>-admin-binding` in the new Namespace which binds to the ClusterRole `admin` as long as a `cluster-admin` did not create the Namespace. Additionally, an annotation named `kyverno.io/user` is added to the RoleBinding recording the name of the user responsible for the Namespace's creation.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `GeneratingPolicy` named
  `add-rolebinding` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-gpol/add-rolebinding/.chainsaw-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal generation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Multi-Tenancy"
  kyverno/subject: "RoleBinding"
