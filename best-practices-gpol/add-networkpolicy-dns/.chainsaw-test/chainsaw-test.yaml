# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-networkpolicy-dns
spec:
  steps:
    - name: create-namespace-before-policy
      try:
        - apply:
            file: exception-namespace.yaml
        - apply:
            file: old-resource.yaml
        - assert:
            file: old-resource.yaml
        - apply:
            file: update-resource.yaml
        - assert:
            file: update-resource.yaml
    - name: install-policy
      try:
        - apply:
            file: ../add-networkpolicy-dns.yaml
        - assert:
            file: policy-ready.yaml
    - name: generate-allow-dns-policy
      try:
        - apply:
            file: resource.yaml
        - assert:
            file: resource.yaml
        - assert:
            file: ../.kyverno-test/generatedResource.yaml
        - error:
            file: notGeneratedResource.yaml
    - name: generate-on-namespace-update
      try:
        - apply:
            file: updated-resource.yaml
        - assert:
            file: updated-resource.yaml
        - assert:
            file: update-generated.yaml
    - name: exception-scope
      try:
        - apply:
            file: exception.yaml
        - apply:
            file: exception-resource.yaml
        - apply:
            file: sibling-resource.yaml
        - assert:
            file: sibling-generated.yaml
        - error:
            file: exception-generated.yaml
    - name: cleanup
      try:
        - delete:
            file: exception.yaml
        - delete:
            file: exception-resource.yaml
        - delete:
            file: sibling-resource.yaml
        - delete:
            file: resource.yaml
        - delete:
            file: updated-resource.yaml
        - delete:
            file: old-resource.yaml
        - delete:
            file: ../add-networkpolicy-dns.yaml
