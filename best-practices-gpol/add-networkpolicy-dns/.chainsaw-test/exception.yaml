apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: add-networkpolicy-dns-exception
  namespace: policy-exceptions
spec:
  policyRefs:
    - name: add-networkpolicy-dns
      kind: GeneratingPolicy
  matchConditions:
    - name: exact-namespace
      expression: object.metadata.name == 'dns-networkpolicy-excluded'
