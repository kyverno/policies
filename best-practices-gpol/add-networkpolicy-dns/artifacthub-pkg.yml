name: add-networkpolicy-dns
version: 1.0.0
displayName: Add Network Policy for DNS
createdAt: "2026-10-27T16:00:00Z"
description: >-
  This policy generates an egress-only NetworkPolicy named `allow-dns` when a
  Namespace is created or updated. It selects every Pod in that Namespace and
  permits UDP/53 egress to Pods in `kube-system`, selected by Kubernetes'
  auto-applied `kubernetes.io/metadata.name: kube-system` label. Other egress is
  blocked unless another NetworkPolicy allows it. Generated resources are not
  synchronized after creation.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-gpol/add-networkpolicy-dns/add-networkpolicy-dns.yaml
  ```
keywords:
  - kyverno
  - Multi-Tenancy
  - EKS Best Practices
readme: |
  NetworkPolicy resources and a supporting CNI plug-in are needed to restrict Pod communications. This policy generates an egress-only NetworkPolicy named `allow-dns` when a Namespace is created or updated. It selects every Pod in that Namespace and permits UDP/53 egress to Pods in the `kube-system` Namespace, selected by Kubernetes' automatically applied `kubernetes.io/metadata.name: kube-system` label. By itself, the policy blocks other egress; another NetworkPolicy must allow any additional egress. Generated resources are not synchronized after creation.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno and reference the `GeneratingPolicy`
  named `add-networkpolicy-dns` in `spec.policyRefs`. Use `spec.matchConditions`
  to scope the exception to the exact Namespace trigger; no `spec.allowedValues`
  entry is needed. The exception skips generation only for matching requests,
  not for sibling namespaces. See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-gpol/add-networkpolicy-dns/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal generation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Multi-Tenancy, EKS Best Practices"
  kyverno/kubernetesVersion: "1.23"
  kyverno/subject: "NetworkPolicy"
