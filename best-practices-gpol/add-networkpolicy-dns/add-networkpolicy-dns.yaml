apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-networkpolicy-dns
  annotations:
    policies.kyverno.io/title: Add Network Policy for DNS
    policies.kyverno.io/category: Multi-Tenancy, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/minversion: 1.19.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/description: >-
      NetworkPolicy resources and a supporting CNI plug-in are needed to restrict
      Pod communications. This policy generates an egress-only NetworkPolicy named
      `allow-dns` when a Namespace is created or updated, allowing UDP/53 traffic
      to Pods in the `kube-system` Namespace. Pair it with a default-deny egress
      policy; this policy allows DNS but does not deny other egress traffic.
      Generated resources are not synchronized after creation.
spec:
  evaluation:
    synchronize:
      enabled: false
    generateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-dns
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
