apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: add-networkpolicy-dns
  annotations:
    policies.kyverno.io/title: Add Network Policy for DNS
    policies.kyverno.io/category: Multi-Tenancy, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: NetworkPolicy
    policies.kyverno.io/minversion: 1.19.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/description: >-
      NetworkPolicy resources and a supporting CNI plug-in are needed to restrict
      Pod communications. This policy generates an egress-only NetworkPolicy named
      `allow-dns` when a Namespace is created or updated. It selects every Pod in
      that Namespace and permits UDP/53 egress to Pods in `kube-system`, selected
      by the auto-applied `kubernetes.io/metadata.name: kube-system` label. Other
      egress is blocked unless another NetworkPolicy allows it. Generated
      resources are not synchronized after creation.
spec:
  evaluation:
    synchronize:
      enabled: false
    generateExisting:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: allow-dns
            namespace: (( object.metadata.name ))
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
